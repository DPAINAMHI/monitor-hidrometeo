<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor hidrometeorológico INAMHI</title>
<!-- Leaflet va EMPAQUETADO, igual que Plotly. Venia de unpkg.com, o sea que
     el mapa dependia de un CDN externo en tiempo de uso: si unpkg no responde
     -o la red de la institucion lo bloquea- el visor carga, pinta los KPI y
     las series, y el mapa se queda en blanco sin decir por que. El mismo
     razonamiento que ya estaba escrito para Plotly en publicar_github.py no
     se habia aplicado aqui. El visor solo usa circleMarker y divIcon, asi que
     no hacen falta las imagenes de marcador de la distribucion. -->
<link rel="stylesheet" href="leaflet-1.9.4.css">
<script defer src="plotly-2.35.2.min.js"></script>
<script>
/* El tema se fija ANTES de que el navegador evalúe la hoja de estilo. Hacerlo al
   final del documento provocaba que el primer pintado saliera con el tema del
   sistema y solo después cambiara: en pantalla se ve como un parpadeo, y en una
   captura automática sale directamente el tema equivocado. */
(function(){
  var t=null;
  try{ t=new URLSearchParams(location.search).get("tema"); }catch(e){}
  if(t!=="claro"&&t!=="oscuro"){ try{ t=localStorage.getItem("tema"); }catch(e){} }
  if(t==="claro"||t==="oscuro") document.documentElement.setAttribute("data-tema",t);
})();
</script>
<style>
/* Las dependencias de interfaz se sirven junto con el visor: un servidor puede
   no tener salida a internet y el monitor debe seguir mostrando sus gráficos.

   LA PANTALLA NO HACE SCROLL. Es una consola de vigilancia, no un documento:
   altura 100dvh y cada panel se reparte lo que hay. Donde el contenido no cabe,
   el scroll vive DENTRO del panel, para que la cabecera, las cifras y las
   alertas nunca salgan de la vista. */
:root{
  --tinta:#12181F; --tinta2:#4A5568; --tinta3:#8A94A6;
  --fondo:#FFFFFF; --superficie:#F7F8FA; --superficie2:#EEF1F5; --linea:#DDE1E8;
  --acento:#0B5FA5; --acento-cl:#4F94CE; --acento-fondo:#E8F1F9;
  --mar:transparent; --tierra:#E9ECF1; --tierra-b:#C6CCD6; --costa:#AAB3C0;
  --normal:#4A5568; --atencion:#D97706; --alerta:#C2410C; --emergencia:#B3261E;
  /* --critico se usaba en 14 reglas y NO ESTABA DEFINIDA en ningun tema:
     var(--critico) no resolvia a nada y esos elementos -que debian salir
     en rojo de emergencia- heredaban el color del texto. Se define como
     alias de --emergencia, que es el rojo que ya usa el resto del sistema
     de avisos, para que las catorce reglas empiecen a hacer lo que dicen. */
  --critico:#B3261E;
  --crecida:#B3261E; --sube:#D97706; --estable:#4A5568; --baja:#0E7490; --recesion:#155E75;
  --ok:#0E7490; --lluvia:#1D6FA8; --frio:#2E6FA8; --calor:#C2410C;
  --hidro:#16835F; --hidro-cl:#52B788;
  /* el gris de "no llueve" tiene que verse como punto, no desaparecer */
  --seco:#9AA4B2;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,"Courier New",monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --tinta:#E8ECF2; --tinta2:#A8B2C1; --tinta3:#6B7688;
    --fondo:#0E1319; --superficie:#161C24; --superficie2:#1E2630; --linea:#2A3441;
    --acento:#5AA3E0; --acento-cl:#3D7BAF; --acento-fondo:#152634;
    --mar:transparent; --tierra:#1C242E; --tierra-b:#2F3B48; --costa:#3E4C5C;
    --normal:#A8B2C1; --atencion:#E8A03C; --alerta:#E0703C; --emergencia:#E05A52; --critico:#E05A52;
    --crecida:#E05A52; --sube:#E8A03C; --estable:#A8B2C1; --baja:#3FA8BE; --recesion:#2E8CA0;
    --ok:#3FA8BE; --lluvia:#4F94CE; --frio:#5AA3E0; --calor:#E0703C;
    --hidro:#52B788; --hidro-cl:#95D5B2;
  --seco:#5A6472;
  }
}
:root[data-tema="oscuro"]{
  --tinta:#E8ECF2; --tinta2:#A8B2C1; --tinta3:#6B7688;
  --fondo:#0E1319; --superficie:#161C24; --superficie2:#1E2630; --linea:#2A3441;
  --acento:#5AA3E0; --acento-cl:#3D7BAF; --acento-fondo:#152634;
  --mar:transparent; --tierra:#1C242E; --tierra-b:#2F3B48; --costa:#3E4C5C;
  --normal:#A8B2C1; --atencion:#E8A03C; --alerta:#E0703C; --emergencia:#E05A52; --critico:#E05A52;
  --crecida:#E05A52; --sube:#E8A03C; --estable:#A8B2C1; --baja:#3FA8BE; --recesion:#2E8CA0;
  --ok:#3FA8BE; --lluvia:#4F94CE; --frio:#5AA3E0; --calor:#E0703C;
    --hidro:#52B788; --hidro-cl:#95D5B2;
  --seco:#5A6472;
}
/* Las barras de desplazamiento del navegador se pintan con el tema del sistema
   operativo, no con el de la pagina: en modo oscuro salian blancas. */
:root{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){color-scheme:dark}}
*{scrollbar-width:thin;scrollbar-color:var(--linea) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--linea);border-radius:99px;
  border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tinta3);background-clip:content-box}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;padding:0 12px 8px}

/* La cabecera SE PARTE en varias filas cuando no cabe. Con nowrap, en 800 px
   el bloque de selectores quedaba aplastado a 12 px de ancho -inservible- y el
   boton de tema se salia de la ventana montandose sobre el latido. Un control
   que no se puede pulsar es peor que un control que baja de linea. */
header{display:flex;align-items:center;gap:10px;padding:8px 2px 7px;
  border-bottom:1px solid var(--linea);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}
.marca{font-size:9px;letter-spacing:.14em;color:var(--acento);font-weight:700;line-height:1.2}
.marca{flex:0 0 auto}
.marca b{display:block;font-size:14.5px;letter-spacing:-.01em;color:var(--tinta);font-weight:600}
nav{display:flex;gap:2px}
nav button{appearance:none;background:none;border:0;border-bottom:2.5px solid transparent;
  padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--tinta3);
  cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento)}
nav button:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.sep{flex:1}
/* Una sola fila, siempre. Con flex-wrap los menus saltaban a una segunda linea
   y robaban altura a los paneles; ahora el selector de variable es el unico que
   cede ancho (min-width:0) y el resto mantiene su tamano. */
/* los selectores no se encogen por debajo de lo legible; si falta sitio,
   la cabecera entera pasa a dos filas */
.ctrl{display:flex;align-items:center;gap:5px;flex-wrap:wrap;row-gap:5px;
  flex:1 1 auto;min-width:220px}
.ctrl select{min-width:0;max-width:100%}
select,input[type=search]{font:inherit;font-size:11.5px;padding:3px 6px;
  border:1px solid var(--linea);border-radius:6px;background:var(--fondo);
  color:var(--tinta)}
#f-var{min-width:0;flex:1 1 auto;max-width:210px}
input[type=search]{width:110px;flex:0 0 auto}
.ctrl label{flex:0 0 auto}
header{min-width:0}
nav{flex:0 0 auto}
.chip{appearance:none;font:inherit;font-size:11px;font-weight:600;padding:3px 9px;
  border:1px solid var(--linea);border-radius:99px;background:var(--fondo);
  color:var(--tinta2);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acento-fondo);border-color:var(--acento);color:var(--acento)}
select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--acento);outline-offset:1px}
.latido{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tinta3);
  white-space:nowrap;flex:0 0 auto;margin-left:auto}
.luz{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:latir 2.4s infinite}
.luz.parado{background:var(--tinta3);animation:none} .luz.error{background:var(--emergencia);animation:none}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.luz{animation:none}}

/* Rejilla, no fila unica: con ocho casillas en 800 px el reparto a partes
   iguales daba 90 px cada una y los rotulos salian cortados -"CON LLUVIA 2...",
   "hace 1,8 h · de..."-. Un indicador cortado no es un indicador. Con
   auto-fit/minmax nunca bajan de 148 px: si no caben, saltan a otra fila. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:7px;padding:7px 0;flex:0 0 auto;align-items:stretch}
.kpi{background:var(--superficie);border:1px solid var(--linea);
  border-radius:var(--r);padding:5px 10px;min-width:0;
  display:flex;flex-direction:column;justify-content:flex-start}
.kpi .rot{font-size:8.5px;letter-spacing:.08em;color:var(--tinta3);font-weight:700;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums}
/* el pie se parte en dos lineas antes que perder texto */
.kpi .pie{font-size:10px;color:var(--tinta3);line-height:1.3;margin-top:1px;
  overflow-wrap:anywhere}
.kpi.hot{background:color-mix(in srgb,var(--emergencia) 9%,var(--superficie));
  border-color:color-mix(in srgb,var(--emergencia) 34%,var(--linea))}
.kpi.hot .val{color:var(--emergencia)}
.kpi.warm{background:color-mix(in srgb,var(--atencion) 10%,var(--superficie));
  border-color:color-mix(in srgb,var(--atencion) 34%,var(--linea))}
.kpi.warm .val{color:var(--atencion)}

.cuerpo{flex:1 1 auto;display:grid;gap:8px;min-height:0}
/* El territorio es casi cuadrado y el panel era mucho mas ancho que alto, asi
   que sobraba espacio a izquierda y derecha del mapa. Se estrecha la columna y
   ese ancho pasa a la serie temporal, que si lo aprovecha. */
/* DOS COLUMNAS, NO TRES.
   La columna de Prioridad ocupaba 250 px fijos a la izquierda diciendo lo mismo
   que ya dice Estaciones, que viene ordenada por riesgo. Quitandola, esos
   250 px pasan al mapa, que es el elemento que peor se leia: era la caja mas
   pequena de la pantalla y la unica donde el tamano se traduce directamente en
   cuanta informacion se ve.
   El mapa y las series ocupan ahora las dos filas superiores enteras, y
   Estaciones pasa a una fila propia a lo ancho. */
/* MITAD Y MITAD.
   Izquierda: el mapa, de arriba abajo, sin nada que le robe altura. Derecha:
   dos filas, la serie temporal arriba y las estaciones debajo.
   Antes eran tres columnas -Prioridad, mapa, serie- con las estaciones cruzando
   a lo ancho por abajo, y el mapa quedaba en la caja mas pequena de la pantalla
   siendo el elemento donde el tamano se traduce directamente en cuanta
   informacion se ve. */
/* ESTACIONES OCUPA TRES FILAS; EL RESTO ES PARA LA SERIE.
   Repartir la columna derecha al 50% daba a Estaciones mucho mas alto del que
   necesita -son 180 tarjetas, siempre va a hacer falta scroll- y se lo quitaba
   al grafico, que es donde se mira el detalle. Con tres filas visibles se ve de
   un vistazo lo que esta arriba por riesgo y el scroll sigue estando para el
   resto.
   La cuenta es explicita a proposito: cabecera + N tarjetas + los huecos entre
   ellas + el margen inferior. Si cambia el alto de la tarjeta, se cambia aqui
   un numero y no hay que volver a medir nada. */
#p-mon .cuerpo{--filas-estaciones:3;--alto-tarjeta:56px;--hueco-tarjeta:5px;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr calc(29px
    + var(--alto-tarjeta) * var(--filas-estaciones)
    + var(--hueco-tarjeta) * (var(--filas-estaciones) - 1)
    + 9px);
  grid-template-areas:"mapa serie" "mapa rejilla";
  transition:grid-template-columns .45s cubic-bezier(.4,0,.2,1)}
/* durante el cambio de tema se desactivan todas las transiciones: si no, cada
   tarjeta anima su color por separado y se ve un barrido feo */
:root.cambiando-tema *{transition:none !important;animation:none !important}
@media (prefers-reduced-motion:reduce){#p-mon .cuerpo{transition:none}}
.a-prio{grid-area:prio} .a-mapa{grid-area:mapa}
/* Sin <h2>, la caja no necesita reservar la banda del titulo. */
.a-mapa--pleno{display:flex;flex-direction:column}
.a-mapa--pleno>.cont{flex:1 1 auto;min-height:0}
.a-serie{grid-area:serie} .a-rejilla{grid-area:rejilla}

.caja{border:1px solid var(--linea);border-radius:var(--r);background:var(--fondo);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.caja>h2{margin:0;padding:7px 11px 5px;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3);
  display:flex;align-items:center;gap:7px;flex:0 0 auto}
.caja>h2 .cuenta{font-family:var(--mono);font-size:11px;color:var(--tinta2);
  background:var(--superficie2);border-radius:99px;padding:1px 7px}
.caja>h2 .sub{font-weight:500;text-transform:none;letter-spacing:0;color:var(--tinta3);
  font-size:10.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caja>h2 .tabs{margin-left:auto;display:flex;gap:3px;align-items:center}
.caja>h2 .tabs select{font-size:10px;padding:1px 4px;border-radius:99px;
  text-transform:none;letter-spacing:0;font-weight:600;color:var(--tinta3)}
.caja>h2 .tabs button{appearance:none;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta3);font:inherit;font-size:10px;font-weight:700;padding:2px 7px;
  border-radius:99px;cursor:pointer;text-transform:none;letter-spacing:0}
.caja>h2 .tabs button[aria-pressed="true"]{background:var(--acento-fondo);
  border-color:var(--acento);color:var(--acento)}
.caja>h2 .tabs button:disabled{opacity:.38;cursor:not-allowed}
.cont{flex:1 1 auto;min-height:0;overflow:auto;padding:0 9px 9px}
.cont.sin-pad{padding:0}

.prio-lista{display:flex;flex-direction:column;gap:6px}
.tar{border:1px solid var(--linea);border-left:3px solid var(--tinta3);border-radius:8px;
  padding:6px 9px;cursor:pointer;background:var(--fondo)}
.tar:hover{transition:background .15s}
.tar:hover{background:var(--superficie)}
.tar[aria-selected="true"]{background:var(--acento-fondo);border-color:var(--acento)}
.tar .l1{display:flex;align-items:baseline;gap:6px}
.tar .cod{font-family:var(--mono);font-weight:700;font-size:12px}
.tar .nom{font-size:10.5px;color:var(--tinta3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
.tar .l2{display:flex;align-items:baseline;gap:7px;margin-top:1px}
.tar .v{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tar .d{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.tar .spark{margin-left:auto}
.tar.r-alto{border-left-width:5px;padding:9px 11px;
  background:color-mix(in srgb,var(--emergencia) 6%,var(--fondo))}
.tar.r-alto .v{font-size:23px} .tar.r-alto .cod{font-size:13.5px}
.tar.r-medio{border-left-width:4px;padding:7px 10px} .tar.r-medio .v{font-size:18px}
.barra-r{height:3px;border-radius:2px;background:var(--superficie2);margin-top:5px;overflow:hidden}
.barra-r i{display:block;height:100%;border-radius:2px}
.insignia{font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 5px;
  border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.acums{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.acum{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:4px;
  background:var(--superficie2);color:var(--tinta2);white-space:nowrap}
.acum b{font-weight:700}
.calma{color:var(--tinta3);font-size:11.5px;text-align:center;padding:18px 8px;line-height:1.6}

.mapa-caja{position:relative;flex:1 1 auto;min-height:0}
svg.mapa{position:absolute;inset:0;width:100%;height:100%}
/* Fondo de mapa propio, sin teselas: no hay CDN que las sirva y descargarlas
   ataria el visor a internet. Se construye con lo que hay — el contorno del
   pais — dandole tratamiento de carta: mar, tierra, costa marcada y division
   provincial fina. Los dos temas usan la misma estructura con otros tonos. */
.m-tierra{fill:var(--tierra);stroke:var(--costa);stroke-width:.9;stroke-linejoin:round}
.m-prov{fill:none;stroke:var(--tierra-b);stroke-width:.4;stroke-linejoin:round;opacity:.6}
.m-cuenca{fill:none;stroke:var(--acento);stroke-width:.7;stroke-opacity:.28;
  stroke-dasharray:3 2}
.m-central{fill:var(--tinta3);opacity:.5}
.m-inset{fill:none;stroke:var(--linea);stroke-width:1}
.mapa-caja{cursor:default}
.mapa-caja.zoom{cursor:grab}
.mapa-caja.arrastrando{cursor:grabbing}
.m-zoom{position:absolute;right:7px;top:7px;display:flex;align-items:center;gap:5px;
  font-size:9.5px;color:var(--tinta3);pointer-events:none;font-family:var(--mono)}
.m-zoom b{color:var(--acento);font-weight:700}
.m-ayuda{position:absolute;right:7px;bottom:5px;font-size:9px;color:var(--tinta3);
  opacity:.65;pointer-events:none}
.m-inset-eti{font-size:7.5px;fill:var(--tinta3);font-family:var(--sans);
  font-weight:700;letter-spacing:.06em}
/* Leyenda del mapa. Sin ella el color de un punto es una decoración: hay que
   decir que un circulo grande y rojo significa "cerca de su umbral y subiendo",
   no "estacion importante". */
/* leyenda en una franja horizontal al pie: ocupa poco y no tapa el territorio */
.m-ley{position:absolute;left:0;right:0;bottom:0;display:flex;gap:11px;
  align-items:center;flex-wrap:wrap;padding:4px 9px;font-size:9.5px;
  color:var(--tinta3);pointer-events:none;
  background:linear-gradient(to top,var(--fondo) 62%,transparent)}
.m-ley span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.m-ley i{display:inline-block;border-radius:50%}
.m-pt{cursor:pointer}
.m-aspa{pointer-events:none}
.eti.e-mudo{color:var(--tinta3);border-color:var(--tinta3)}
.m-halo{animation:pulsar 2.6s ease-out infinite}
@keyframes pulsar{0%{opacity:.5;transform-box:fill-box;transform-origin:center;transform:scale(.6)}
  100%{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.m-halo{animation:none;opacity:.25}}
.m-eti{font-size:8px;fill:var(--tinta2);font-family:var(--mono);pointer-events:none}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));
  gap:5px;padding:0 9px 9px}
.mini{border:1px solid var(--linea);border-radius:6px;padding:4px 6px;cursor:pointer;
  border-left:3px solid var(--tinta3);min-width:0}
.mini:hover{background:var(--superficie)}
.mini[aria-selected="true"]{background:var(--acento-fondo);border-color:var(--acento)}
.mini .c{font-family:var(--mono);font-size:10.5px;font-weight:700}
.mini .n{font-size:9px;color:var(--tinta3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .f{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-top:1px}
.mini .v{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

svg.grafico{display:block;width:100%;height:100%}
.gr-rej{stroke:var(--linea);stroke-width:1;opacity:.8}
.gr-tick{fill:var(--tinta3);font-size:9px}
.gr-obs{fill:none;stroke:var(--tinta);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gr-ens{fill:none;stroke:var(--acento);stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
/* SIN stroke: en SVG una regla CSS gana al atributo de presentacion, asi que
   declararlo aqui pintaba de gris TODAS las curvas de modelo, que traen su color
   propio en stroke="...". Cada serie que use esta clase debe pasar su color. */
.gr-mie{fill:none;stroke-width:1.4;opacity:.75;stroke-linejoin:round}
.gr-banda{fill:var(--acento);opacity:.15}
.gr-um{stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.gr-um-t{font-size:9px;font-weight:700}
.gr-pron{fill:var(--superficie)}
.vacio{color:var(--tinta3);font-size:11.5px;text-align:center;padding:20px 8px}
.gr-ejey{fill:var(--tinta3);font-size:10px;font-weight:600;letter-spacing:.03em}
.gr-dia{stroke:var(--linea);stroke-width:1;opacity:.9}
.gr-diafondo{fill:var(--superficie);opacity:.55}
.gr-diaeti{fill:var(--tinta3);font-size:9px;font-weight:700;letter-spacing:.04em}
.gr-diares{font-family:var(--mono);font-size:10.5px;font-weight:700;fill:var(--tinta2);
  paint-order:stroke;stroke:var(--fondo);stroke-width:3px;stroke-linejoin:round}
.gr-min{fill:none;stroke:var(--frio,#4F94CE);stroke-width:1.9;stroke-linejoin:round;
  stroke-linecap:round}
.gr-bigote{stroke:var(--tinta3);stroke-width:1.2;opacity:.75}
.gr-cruz{stroke:var(--tinta3);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.lector .lec-f{display:flex;align-items:center;gap:6px;white-space:nowrap;
  font-size:10.5px;line-height:1.55}
.lector .lec-f b{margin-left:auto;font-variant-numeric:tabular-nums}
.lector .lec-c{width:9px;height:2.5px;border-radius:2px;flex:0 0 auto}
.lector .lec-u{display:block;font-size:9px;color:var(--tinta3);margin-bottom:3px}
.gr-rot{font-size:8.5px;font-weight:600;paint-order:stroke;stroke:var(--fondo);
  stroke-width:2.4px;stroke-linejoin:round}
.gr-marca{fill:var(--acento);stroke:var(--fondo);stroke-width:1.5;pointer-events:none}
.gr-caja{position:relative;height:100%}
/* Lectura bajo el cursor. Sin esto hay que adivinar a que hora corresponde
   cada punto de la serie, que es lo primero que se pregunta en operacion. */
.lector{position:absolute;z-index:12;pointer-events:none;background:var(--fondo);
  border:1px solid var(--linea);border-left:3px solid var(--acento);border-radius:7px;
  padding:4px 9px;font-size:11px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.2);
  white-space:nowrap}
.lector b{font-family:var(--mono);font-size:14px;font-weight:600}
.lector i{display:block;color:var(--tinta3);font-size:10px;font-style:normal}

/* Estado de carga: al cambiar de variable la consulta puede tardar, y sin aviso
   parece que el visor se ha colgado. */
.cargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--fondo) 72%,transparent);z-index:14;
  font-size:11.5px;color:var(--tinta2);gap:7px;backdrop-filter:blur(1.5px)}
.cargando::before{content:"";width:12px;height:12px;border-radius:50%;
  border:2px solid var(--linea);border-top-color:var(--acento);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cargando::before{animation:none}}
.pastilla{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;
  padding:2px 8px;border-radius:99px;border:1px solid var(--linea);color:var(--tinta3)}
.pastilla.ok{border-color:var(--ok);color:var(--ok)}

/* leyenda vertical, bajo el titulo del panel */
/* columna propia a la izquierda: superpuesta al mapa lo tapaba */
/* align-items:start y ancho completo en cada fila: el contenedor las centraba y
   como cada etiqueta mide distinto, la columna salia en zigzag */
.m-ley{position:absolute;left:8px;top:8px;width:66px;display:flex;flex-direction:column;
  align-items:stretch;gap:3px;font-size:9.5px;color:var(--tinta3);pointer-events:none}
.m-ley .t{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;margin-bottom:1px;color:var(--tinta3)}
/* el punto vive en una caja de ancho fijo: si no, cada tamaño desplazaba su
   etiqueta y la columna quedaba en zigzag */
/* El numero va a la derecha, alineado, para poder leer la columna entera de
   un vistazo sin que los nombres lo descoloquen. */
.cuenta-ley{margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--tinta)}
.m-ley .fila{display:flex;align-items:center;gap:6px}
.m-ley span{display:grid;grid-template-columns:12px 1fr;align-items:center;
  gap:6px;white-space:nowrap;width:100%;justify-self:start}
.m-ley i{display:block;border-radius:50%;margin:0 auto}
.m-ley i svg{width:11px;height:11px;display:block;margin:-1px 0 0 -1px;overflow:visible}
/* La columna crece de 66 a 104 px para que quepa el recuento. Es lo que
   convierte la leyenda en informacion: "vigilar" ya se sabe lo que significa;
   "vigilar 3" dice si hay que hacer algo ahora. */
/* NO se parte en columnas. Con `wrap` heredado, en una ventana baja -el panel
   del mapa se queda en 76 px- las cuatro filas se repartian en cuatro columnas
   de 321 px que cruzaban el territorio de lado a lado. Cinco lineas de 14 px
   caben en el alto que hay; si algun dia no caben, es mejor que sobresalgan a
   que se desplieguen sobre el mapa. */
.m-ley{width:104px;flex-wrap:nowrap}
.m-ley .t{white-space:nowrap}
.m-ley span{grid-template-columns:12px 1fr auto}
.m-ley span b{font-family:var(--mono);font-variant-numeric:tabular-nums;
  color:var(--tinta2);font-weight:700;justify-self:end}
.m-ley span.nulo{opacity:.4}

.gr-eti{font-family:var(--mono);font-size:10px;font-weight:700;
  paint-order:stroke;stroke:var(--fondo);stroke-width:3px;stroke-linejoin:round}

/* Popup del mapa. El <title> de SVG da un tooltip nativo lento y feo, que
   ademas tarda un segundo en aparecer: en una consola de vigilancia eso es
   demasiado. Este sigue al puntero y muestra lo que hace falta para decidir. */
.popup{position:absolute;z-index:30;pointer-events:none;min-width:158px;max-width:250px;
  background:var(--fondo);border:1px solid var(--linea);border-left:3px solid var(--acento);
  border-radius:8px;padding:7px 10px;box-shadow:0 6px 22px rgba(0,0,0,.22);
  font-size:11.5px;line-height:1.45}
.popup .pc{font-family:var(--mono);font-weight:700;font-size:12.5px;
  display:flex;align-items:center;gap:6px;justify-content:space-between}
.popup .pn{color:var(--tinta3);font-size:10.5px;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .pv{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.2}
.popup .pv small{font-size:10px;color:var(--tinta3);font-weight:400}
.popup .pd{color:var(--tinta2);font-size:10.5px;margin-top:2px;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.popup .pp{color:var(--tinta3);font-size:10px;margin-top:3px;
  border-top:1px solid var(--linea);padding-top:3px}
/* el h2 va en mayusculas, pero una unidad como "mm/h" en mayusculas se lee mal */
.tend{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);
  font-weight:700;font-size:11px;text-transform:none}
.a-mapa>h2{font-size:12.5px;letter-spacing:.08em}
#serie-tit{font-size:12.5px;letter-spacing:.025em}
.caja>h2 .nomest{text-transform:none;font-weight:600;font-size:12px;color:var(--tinta2)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--fondo);text-align:left;padding:5px 7px;
  font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3);
  border-bottom:1px solid var(--linea);white-space:nowrap;z-index:2}
th.num,td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td{padding:4px 7px;border-bottom:1px solid var(--linea)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--superficie)}
tbody tr[aria-selected="true"]{background:var(--acento-fondo)}
.cod{font-family:var(--mono);font-weight:700}
.eti{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.eti::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.e-normal{color:var(--normal)} .e-atencion{color:var(--atencion)}
.e-alerta{color:var(--alerta)} .e-emergencia{color:var(--emergencia)}
.e-crecida{color:var(--crecida)} .e-sube{color:var(--sube)} .e-estable{color:var(--estable)}
.e-baja{color:var(--baja)} .e-recesion{color:var(--recesion)}
.e-sinumbral,.e-sindato{color:var(--tinta3)}

#p-pro .cuerpo{grid-template-columns:.95fr 1.05fr 1.15fr;grid-template-rows:1.3fr .85fr;
  grid-template-areas:"pgraf pgraf ptabla" "pbarras pmet ptabla"}
.a-pgraf{grid-area:pgraf} .a-ptabla{grid-area:ptabla}
.a-pmet{grid-area:pmet} .a-pbarras{grid-area:pbarras}
.leyenda{display:flex;gap:9px;flex-wrap:wrap;padding:2px 9px 4px;font-size:10px;
  color:var(--tinta3);flex:0 0 auto}
.leyenda i{display:inline-block;width:13px;height:2.5px;border-radius:2px;margin-right:3px;
  vertical-align:middle}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:4px;
  padding:3px 0 5px;flex:0 0 auto}
.stat{background:var(--superficie);border-radius:6px;padding:3px 6px;min-width:0}
/* Aviso de habilidad del pronostico. Usa las mismas variables de color que el
   resto, asi que responde al modo claro y al oscuro sin una regla aparte. El
   color-mix da el fondo tenue sin fijar un gris que solo valga en un tema. */
.aviso-habilidad{margin:0 0 12px;padding:10px 12px;border-radius:8px;
  font-size:13px;line-height:1.45;color:var(--tinta)}
.aviso-habilidad--sin{border-left:4px solid var(--critico);
  background:color-mix(in srgb,var(--critico) 12%,transparent)}
.aviso-habilidad--ok{border-left:4px solid var(--atencion);
  background:color-mix(in srgb,var(--atencion) 12%,transparent)}
.stat .k{font-size:8px;color:var(--tinta3);text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}


[hidden]{display:none !important}
@media(max-width:1240px){
  /* Suelo en las dos filas superiores. Con `1fr 1fr auto`, la rejilla de
     estaciones -169 tarjetas- se comia todo el alto disponible y las filas
     flexibles se quedaban en 2 px: el mapa y la serie desaparecian por completo
     en cualquier ventana de menos de 1240 px, sin aviso ninguno. Con minmax la
     pagina crece y se desplaza, que es lo correcto. */
  #p-mon .cuerpo{grid-template-columns:1fr;
    grid-template-rows:minmax(320px,1.15fr) minmax(200px,1fr) auto;
    grid-template-areas:"mapa" "serie" "rejilla"}
  #p-pro .cuerpo{grid-template-columns:1fr;grid-template-rows:1.2fr 1fr;
    grid-template-areas:"pgraf" "ptabla"}
  .a-pmet,.a-pbarras{display:none}
}

/* -------------------------------------------------- vistas de pronostico */
/* Van junto a Serie y Normales, no en pestania aparte: asi el pronostico se
   consulta sobre la estacion ya elegida en el mapa, sin volver a buscarla.
   Solo aparecen en hidrologico y solo si esa estacion tiene lamina. */
#v-pron-grupo{display:inline-flex;align-items:center;gap:3px}
#v-pron-grupo button:disabled{opacity:.3;cursor:not-allowed}
.pron-marco{flex:1 1 auto;min-height:110px;overflow:auto;display:flex;
  align-items:center;justify-content:center}
.pron-marco img{max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;border-radius:7px;border:1px solid var(--linea);
  background:#fff;cursor:zoom-in}
.pron-marco.zoom{align-items:flex-start;justify-content:flex-start}
.pron-marco.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.pron-pie{font-size:10.5px;color:var(--tinta3);padding:2px 2px 4px;line-height:1.35}
.pron-pie b{color:var(--acento)}

/* El grafico lleva height:100% para llenar su caja, asi que dentro del panel de
   pronostico hay que darle una caja propia que sea la que se encoge: si no, el
   SVG se estira al alto completo y las tarjetas y el pie lo desbordan. */
/* El pronostico ocupa TODO el panel. Encogido al hueco de la serie salia como
   una miniatura ilegible: la lamina lleva tarjetas, curva principal, miembros y
   barras, y eso no cabe en un recuadro de 275 px de alto. Cuando se elige una
   vista de pronostico, el resto de cajas se apartan. */
#p-mon .cuerpo.pron-max{grid-template-columns:1fr;grid-template-rows:1fr;
  grid-template-areas:"serie"}
#p-mon .cuerpo.pron-max .a-prio,
#p-mon .cuerpo.pron-max .a-mapa,
#p-mon .cuerpo.pron-max .a-rejilla{display:none}

/* Cada grafico con su alto comodo y, si el conjunto no cabe, se desplaza. Es la
   decision correcta aqui: comprimirlo todo para evitar el scroll dejaba tres
   graficos aplastados y ninguno legible, que es peor que desplazarse. */
/* El panel no se expande, pero su contenido SI se desplaza: cabe todo —tarjetas,
   curva principal, miembros y barras— con alturas legibles, y quien mira baja si
   quiere el detalle. Comprimirlo para evitar el scroll dejaba los tres graficos
   aplastados y ninguno se leia. */
#serie.pron{display:flex;flex-direction:column;min-height:0;gap:7px;
  overflow-y:auto;padding-right:4px}
#serie.pron .pron-graf{flex:0 0 auto;height:230px;position:relative}
#serie.pron .stat-grid,#serie.pron .pron-pie{flex:0 0 auto}
#serie.pron .pron-marco{flex:1 1 auto;min-height:0}
/* fila inferior: miembros y barras, como en la lamina */
.pron-abajo{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;flex:0 0 auto}
.pron-sub{display:flex;flex-direction:column}
.pron-sub h3{margin:0 0 3px;font-size:11px;font-weight:600;color:var(--tinta2);
  letter-spacing:.01em}
.pron-sub .caja-g{height:190px}
.pron-ley{display:flex;flex-wrap:nowrap;gap:3px 10px;overflow-x:auto;scrollbar-width:thin;padding:4px 2px 0;
  font-size:10px;color:var(--tinta2)}
.pron-ley span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pron-ley i{display:inline-block;width:11px;height:2.5px;border-radius:2px}
.q-orig{font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:99px;
  background:var(--superficie2);color:var(--tinta3);border:1px solid var(--linea2);
  text-transform:none;letter-spacing:0;vertical-align:middle}
.hermana{font:inherit;font-size:9.5px;margin-left:6px;padding:1px 8px;
  border:1px solid var(--linea);background:var(--fondo);color:var(--acento);
  border-radius:999px;cursor:pointer;vertical-align:middle}
.hermana:hover{background:var(--acento-fondo);border-color:var(--acento)}
.q-orig.derivado{background:rgba(217,119,6,.12);color:var(--atencion);
  border-color:var(--atencion)}
.met-tabs{display:flex;gap:3px;margin:2px 0 5px;flex-wrap:wrap}
.met-tabs button{font:inherit;font-size:10.5px;padding:2px 9px;cursor:pointer;
  border:1px solid var(--linea);background:var(--fondo);color:var(--tinta2);
  border-radius:999px}
.met-tabs button[aria-pressed=true]{background:var(--acento);color:#fff;
  border-color:var(--acento);font-weight:600}
/* Avisos. El color lo lleva una banda lateral y no el fondo entero: un bloque
   rojo a pantalla completa se lee como error del sistema, no como aviso. */
.avi-cuenta{display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:16px;padding:0 4px;margin-left:5px;border-radius:9px;
  background:var(--emergencia);color:#fff;font-size:9.5px;font-weight:700}
.avi{border:1px solid var(--linea);border-left-width:4px;border-radius:var(--r);
  padding:9px 12px;margin-bottom:9px;background:var(--fondo)}
.avi.emergencia{border-left-color:var(--emergencia)}
.avi.alerta{border-left-color:var(--alerta)}
.avi.atencion{border-left-color:var(--atencion)}
.avi.normal{border-left-color:var(--ok)}
.avi h4{margin:0 0 4px;font-size:12px;letter-spacing:0}
.avi .avi-txt{font-size:11.5px;line-height:1.55;color:var(--tinta2)}
.avi .avi-pie{margin-top:5px;font-size:10px;color:var(--tinta3);
  display:flex;gap:12px;flex-wrap:wrap}
.avi .avi-pobl{margin-top:4px;font-size:10.5px;color:var(--tinta2)}
/* El estado va en su propia linea y en frase, no en mayusculas: "SIN LLUVIA
   DESDE HACE 10 H" a 9 px se descifra, no se lee, y esto se mira de un vistazo
   y muchas veces al dia. El punto de color da el estado antes que el texto. */
.acums{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.fase-fila{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.fase{display:inline-flex;align-items:center;gap:5px;font-size:10px;
  font-weight:600;letter-spacing:0;color:var(--tinta2)}
.fase::before{content:"";width:6px;height:6px;border-radius:50%;
  background:currentColor;flex:0 0 auto}
.fase.activa{color:var(--lluvia)}
.fase.amainando{color:var(--tinta2)}
.fase.antecedente,.fase.sin_dato{color:var(--tinta3);font-weight:500}
.fase.sin_dato::before{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.fase.reactiva{color:var(--emergencia);font-weight:800}
.fase.reactiva::before{animation:lat 1.6s ease-in-out infinite}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.fase.reactiva::before{animation:none}}
.edad{font-size:9.5px;white-space:nowrap}
.edad.viejo{color:var(--atencion);font-weight:700}
.acum.cero{opacity:.5}
.acum.vacio{font-family:inherit;font-size:9.5px;color:var(--tinta3);
  background:none;padding:1px 0;font-style:italic}
.avi-acc{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.avi-pdf{font-size:10.5px;padding:3px 10px;border-radius:999px;text-decoration:none;
  background:var(--acento);color:#fff;font-weight:600}
.avi-pdf:hover{filter:brightness(1.1)}
.avi-pend{font-size:10px;color:var(--tinta3);font-style:italic}
.avi-btn{font:inherit;font-size:10.5px;padding:3px 10px;border-radius:999px;
  border:1px solid var(--linea);background:var(--fondo);color:var(--acento);
  cursor:pointer}
.avi-btn:hover{background:var(--acento-fondo);border-color:var(--acento)}
.avi-serie{margin-top:8px}
.avi-sec{margin:2px 0 8px;font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--tinta3);font-weight:700}
.pron-marca{color:var(--tinta3);font-weight:400;font-size:9.5px}
.pron-tabla td.pron-sep{padding-top:9px;color:var(--tinta2);font-weight:600;
  border-bottom:1px solid var(--linea)}
.pron-tabla{overflow-x:auto}
.pron-tabla table{width:100%;border-collapse:collapse;font-size:10.5px}
.pron-tabla th{text-align:left;font-weight:600;color:var(--tinta3);
  padding:3px 6px;border-bottom:1px solid var(--linea);white-space:nowrap;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.03em}
.pron-tabla td{padding:3px 6px;border-bottom:1px solid var(--linea);
  color:var(--tinta2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pron-tabla td:first-child{color:var(--tinta);font-weight:500}
@media (max-width:900px){.pron-abajo{grid-template-columns:1fr}}
/* La lamina necesita una caja ACOTADA para que su max-height:100% signifique
   algo: sin esto la imagen se dibujaba a su tamanio natural y desbordaba el
   panel, que es corto y ancho. */
#serie.pron .pron-marco{flex:1 1 auto;min-height:0}

/* Mapa geográfico dinámico: OSM como base y cartografía institucional como capas. */
#mapa-leaflet{position:absolute;inset:0;background:var(--superficie2)}
.leaflet-container{font-family:var(--sans);color:var(--tinta)}
.leaflet-control-attribution{display:none!important}
.mapa-herramientas{position:absolute;z-index:800;right:8px;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none}
.mapa-botones{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:none;flex-wrap:nowrap;pointer-events:auto}
.mapa-boton{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--linea);border-radius:999px;padding:4px 8px;background:color-mix(in srgb,var(--fondo) 94%,transparent);color:var(--tinta2);font:600 9.5px var(--sans);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14)}
#mapa .mapa-botones{max-width:calc(100% - 16px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#mapa .mapa-botones::-webkit-scrollbar{display:none}
.mapa-boton[data-mapa-capa="complejos"][aria-pressed="true"],.mapa-boton[data-mapa-capa="centrales"][aria-pressed="true"]{background:var(--hidro);border-color:var(--hidro);color:#fff}
.mapa-boton:hover{border-color:var(--acento);color:var(--acento)}

<!-- PUBLICACION-ESTATICA: las API se resuelven contra snapshots generados en el servidor -->
<script>
(() => {
  const originalFetch = window.fetch.bind(window);
  const archivo = rel => new URL(rel, document.baseURI).href;
  let estadisticas;
  window.fetch = function(input, init) {
    const raw = typeof input === "string" ? input : input.url;
    const u = new URL(raw, document.baseURI);
    const p = u.pathname;
    if (p.endsWith("/api/pulso")) {
      const v = u.searchParams.get("variable") || "nivel";
      return originalFetch(archivo("datos/pulso/" + encodeURIComponent(v) + ".json"), init);
    }
    if (p.includes("/api/estadisticas/")) {
      const codigo = decodeURIComponent(p.substring(p.lastIndexOf("/") + 1));
      estadisticas ||= originalFetch(archivo("datos/estadisticas.json"), {cache:"no-store"}).then(r => r.json());
      return estadisticas.then(todo => {
        const cuerpo = todo[codigo]
          ? {codigo, variables: todo[codigo]}
          : {codigo, sin_estadistica:true, motivo:"sin histórico suficiente en el archivo"};
        return new Response(JSON.stringify(cuerpo), {status:200, headers:{"Content-Type":"application/json"}});
      });
    }
    const fijos = {
      "/api/estado":"datos/estado.json",
      "/api/cartografia":"datos/cartografia.json",
      "/api/avisos":"datos/avisos.json",
      "/api/boletines":"datos/boletines.json",
      "/api/laminas":"datos/laminas.json",
      "/api/pronostico-datos":"datos/pronostico-datos.json",
      "/api/pronostico-meteo":"datos/pronostico-meteo.json",
      "/api/version":"datos/version.json"
    };
    for (const [sufijo, destino] of Object.entries(fijos)) {
      if (p.endsWith(sufijo)) return originalFetch(archivo(destino), init);
    }
    return originalFetch(input, init);
  };
})();
</script>
