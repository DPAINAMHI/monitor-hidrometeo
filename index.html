<script src="leaflet-1.9.4.min.js" crossorigin=""></script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const NADA="—";
const num=(v,d=2)=>(v==null||!isFinite(v))?NADA
  :Math.abs(v)>=1000?v.toLocaleString("es-EC",{maximumFractionDigits:0})
  :v.toLocaleString("es-EC",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>(v==null||!isFinite(v))?NADA:(v>0?"+":"")+v.toLocaleString("es-EC",{maximumFractionDigits:0})+"%";
const hora=s=>{if(!s)return NADA;const d=new Date(s);return isNaN(d)?NADA
  :d.toLocaleString("es-EC",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function pasos(lo,hi,n=4){
  if(!isFinite(lo)||!isFinite(hi)||hi<=lo)return[lo,hi];
  const b=(hi-lo)/n,m=Math.pow(10,Math.floor(Math.log10(b))),k=b/m;
  const p=(k<1.5?1:k<3?2:k<7?5:10)*m, ini=Math.ceil(lo/p)*p, o=[];
  for(let v=ini;v<=hi+p*1e-6;v+=p)o.push(+v.toFixed(10));
  return o.length>1?o:[lo,hi];
}
/* `isFinite(null)` es TRUE en JavaScript: null se convierte en 0. Usar isFinite
   a secas sobre datos con huecos metia ceros por todas partes —bandas que bajaban
   al fondo del grafico, umbrales dibujados en cero, ejes estirados hasta el 0—.
   Todo dato que pueda venir vacio se comprueba con esto. */
const finito = z => z != null && Number.isFinite(z);

const ruta=pts=>pts.filter(p=>p&&isFinite(p[1]))
  .map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");

/* La lluvia se dibuja en barras y el nivel en linea: un hietograma con linea
   sugiere continuidad donde hay pulsos, y engaña sobre cuando llovio. */
function chispa(v,w=58,h=18,color="var(--acento)",barras=false){
  const a=(v||[]).filter(x=>x!=null&&isFinite(x));
  if(a.length<2)return`<svg width="${w}" height="${h}"></svg>`;
  const hi=Math.max(...a,0.0001), lo=barras?0:Math.min(...a), r=(hi-lo)||1;
  if(barras){
    const bw=Math.max((w-2)/a.length-0.6,0.7);
    return`<svg width="${w}" height="${h}" aria-hidden="true">`+a.map((x,i)=>{
      const hh=Math.max((x-lo)/r*(h-3),x>0?1:0);
      return`<rect x="${(1+i*(w-2)/a.length).toFixed(1)}" y="${(h-1-hh).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${color}"/>`;}).join("")+`</svg>`;
  }
  const p=a.map((x,i)=>[i*(w-3)/(a.length-1)+1.5,h-2-((x-lo)/r)*(h-4)]);
  return`<svg width="${w}" height="${h}" aria-hidden="true"><path d="${ruta(p)}" fill="none"
    stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${p.at(-1)[0].toFixed(1)}" cy="${p.at(-1)[1].toFixed(1)}" r="2" fill="${color}"/></svg>`;
}
function grafico(c){
  // margen derecho mayor cuando hay rotulos al final de curva, para que quepan
  const rot=(c.series||[]).some(s=>s.rotulo);
  const W=c.w||700,H=c.h||240,cabDia=c.dias&&c.dias.length?25:0,extUm=!!(c.rotulosUmbralExternos&&(c.umbrales||[]).length),
    M={t:12+cabDia,r:extUm?92:(rot?92:20),b:24,l:c.ejeY?60:48},iw=W-M.l-M.r,ih=H-M.t-M.b;
  const t=[];(c.series||[]).forEach(s=>s.v.forEach(v=>{if(v!=null&&isFinite(v))t.push(v)}));
  (c.barras||[]).forEach(s=>s.v.forEach(v=>{if(v!=null&&isFinite(v))t.push(v)}));
  [...(c.banda||[]),...(c.bigotes||[])].forEach(b=>{
    (b.hi||[]).forEach(v=>{if(v!=null&&isFinite(v))t.push(v)});
    (b.lo||[]).forEach(v=>{if(v!=null&&isFinite(v))t.push(v)});});
  (c.umbrales||[]).forEach(u=>{if(finito(u.v))t.push(u.v)});
  if(!t.length)return`<div class="vacio">Sin datos en la ventana</div>`;
  let lo=c.desdeCero?0:Math.min(...t),hi=Math.max(...t);
  // Un grafico de cambio porcentual necesita el cero en el eje: es la referencia
  // de la lectura. Sin el, con todos los valores negativos las barras colgaban
  // desde el borde superior y parecian crecer hacia abajo desde "arriba".
  if(c.conCero){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  const mg=(hi-lo)*.12||Math.abs(hi)*.1||1; hi+=mg; if(!c.desdeCero)lo-=mg;
  const n=c.n,X=i=>M.l+(n<2?iw/2:i*iw/(n-1)),Y=v=>M.t+ih-((v-lo)/(hi-lo))*ih;
  let g="";
  // Bandas alternas por dia natural: sin ellas, en una ventana de 48 h no se
  // distingue donde acaba un dia y empieza el siguiente, que es lo primero que
  // se busca al leer una crecida.
  if(c.dias&&c.dias.length){
    c.dias.forEach((d,k)=>{
      const x0=X(d.i), x1=d.fin!=null?X(d.fin):W-M.r;
      if(k%2===1)g+=`<rect class="gr-diafondo" x="${x0.toFixed(1)}" y="${M.t}"
        width="${Math.max(x1-x0,0).toFixed(1)}" height="${ih}"/>`;
      if(k>0)g+=`<line class="gr-dia" x1="${x0.toFixed(1)}" y1="${M.t}"
        x2="${x0.toFixed(1)}" y2="${M.t+ih}"/>`;
      // El resumen del día va DENTRO del gráfico, sobre su propia banda: una
      // tabla aparte obliga a mirar en dos sitios y a cruzarlos con la vista.
      // "en curso" SOLO para el dia que de verdad no ha cerrado. El primer dia
      // de la ventana esta cortado por el borde, no en curso: rotularlo igual
      // hacia que dias ya pasados pareciesen abiertos.
      if(x1-x0>34){
        g+=`<text class="gr-diaeti" x="${(x0+4).toFixed(1)}"
          y="${(M.t-17).toFixed(1)}">${esc(d.t)}</text>`;
        const flojo=`y="${(M.t-6).toFixed(1)}" opacity="0.5"`
          +` style="font-weight:400;font-size:9.5px"`;
        if(d.resumen)g+=`<text class="gr-diares" x="${(x0+4).toFixed(1)}"
          y="${(M.t-6).toFixed(1)}">${esc(d.resumen)}</text>`;
        // El primer dia de la ventana SIEMPRE esta cortado por el borde: eso no
        // dice nada de la estacion ni del dato, es como se eligio la ventana.
        // Rotularlo "dia incompleto" hacia pensar en un fallo de transmision que
        // no existe, asi que no se rotula. Lo que si se avisa es un dia que ya
        // cerro pero al que le faltan horas MEDIDAS, que si es informacion.
        else if(!d.cerrado && !d.truncado)
          g+=`<text class="gr-diares" x="${(x0+4).toFixed(1)}"
            ${flojo}>en curso</text>`;
      }
    });
  }
  if(c.corte!=null&&c.corte>=0)
    g+=`<rect class="gr-pron" x="${X(c.corte).toFixed(1)}" y="${M.t}"
      width="${(W-M.r-X(c.corte)).toFixed(1)}" height="${ih}"/>`;
  if(c.guiasX)(c.etiquetasX||[]).forEach(e=>{const xx=X(e.i).toFixed(1);g+=`<line class="gr-hora" x1="${xx}" y1="${M.t}" x2="${xx}" y2="${M.t+ih}"/>`;});
  for(const v of pasos(lo,hi,4)){const y=Y(v).toFixed(1);
    g+=`<line class="gr-rej" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/>
      <text class="gr-tick" x="${M.l-5}" y="${y}" text-anchor="end" dominant-baseline="middle">${num(v,Math.abs(v)<10?1:0)}</text>`;}
  g+=`<line class="gr-eje" x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${M.t+ih}"/><line class="gr-eje" x1="${M.l}" y1="${M.t+ih}" x2="${W-M.r}" y2="${M.t+ih}"/>`;
  if(c.ejeY)g+=`<text class="gr-ejey" transform="translate(11,${(M.t+ih/2).toFixed(1)}) rotate(-90)"
    text-anchor="middle">${esc(c.ejeY)}</text>`;
  // En las normales la banda va como bigotes verticales, no como area difusa:
  // con doce valores sueltos el area sugiere continuidad entre meses que no
  // existe, y ademas tapaba las barras.
  (c.bigotes||[]).forEach(b=>{
    for(let i=0;i<n;i++){
      if(!finito(b.lo[i])||!finito(b.hi[i]))continue;
      const px=X(i), y1=Y(b.hi[i]), y2=Y(b.lo[i]);
      g+=`<line class="gr-bigote" x1="${px.toFixed(1)}" y1="${y1.toFixed(1)}"
          x2="${px.toFixed(1)}" y2="${y2.toFixed(1)}"/>
        <line class="gr-bigote" x1="${(px-3.5).toFixed(1)}" y1="${y1.toFixed(1)}"
          x2="${(px+3.5).toFixed(1)}" y2="${y1.toFixed(1)}"/>
        <line class="gr-bigote" x1="${(px-3.5).toFixed(1)}" y1="${y2.toFixed(1)}"
          x2="${(px+3.5).toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }});
  /* OJO con isFinite: `isFinite(null)` devuelve TRUE, porque null se convierte
     en 0. La version anterior metia todos los huecos en el poligono valiendo
     cero, y la banda bajaba hasta el fondo del grafico y volvia a subir: esas
     eran las cunas y los triangulos que aparecian en media red.
     Ademas se corta en TRAMOS contiguos. Un solo poligono que salte por encima
     de un hueco lo cierra en diagonal e inventa una incertidumbre donde no se
     calculo ninguna. */
  (c.banda||[]).forEach(b=>{
    const tramos=[]; let a=[];
    for(let i=0;i<n;i++){
      if(finito(b.lo[i]) && finito(b.hi[i])) a.push(i);
      else { if(a.length>1) tramos.push(a); a=[]; }
    }
    if(a.length>1) tramos.push(a);
    tramos.forEach(idx=>{
      const sup=idx.map(i=>[X(i),Y(b.hi[i])]);
      const inf=idx.slice().reverse().map(i=>[X(i),Y(b.lo[i])]);
      g+=`<path class="gr-banda" d="${ruta(sup)} L ${inf.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")} Z"
        ${b.op!=null?`opacity="${b.op}"`:""}/>`;});});
  (c.barras||[]).forEach(s=>{const bw=Math.max(iw/Math.max(n,1)*(s.ancho??.86)-1.2,1);
    // La base es el CERO, no el minimo del eje: con valores negativos —un cambio
    // porcentual a la baja— la version anterior los descartaba enteros y el
    // grafico salia con las cifras flotando y ninguna barra debajo.
    const base = (lo<=0 && hi>=0) ? Y(0) : Y(lo);
    s.v.forEach((v,i)=>{if(v==null||!isFinite(v))return;
      const yv=Y(v), y0=Math.min(yv,base), h=Math.max(Math.abs(base-yv),0.6);
      const col=(s.colores&&s.colores[i])||s.color||"var(--lluvia)";
      g+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${y0.toFixed(1)}"
        width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"
        fill="${col}" opacity="${s.op??.85}"/>`;});
    if(lo<=0 && hi>=0)
      g+=`<line class="gr-rej" x1="${M.l}" y1="${base.toFixed(1)}"
        x2="${W-M.r}" y2="${base.toFixed(1)}" stroke-dasharray="none"/>`;});
  // Un umbral en cero no es un umbral: sale de un percentil mal calculado en
  // estaciones con muchos ceros, y dibujado se lee como "emergencia siempre".
  // `u.cero` deja pasar valores <=0 donde el cero es una medida legitima. En
  // caudal o nivel un umbral en cero delata un percentil mal calculado, pero una
  // mediana de temperatura bajo cero es lo normal en el paramo y hay que trazarla.
  const rotUm=[];
  (c.umbrales||[]).forEach(u=>{
    if(!finito(u.v)||(!u.cero&&u.v<=0)||u.v<lo||u.v>hi)return;
    const y=+Y(u.v).toFixed(1);
    // La franja alta del lienzo la ocupan los resumenes de cada dia. Una linea
    // que cae ahi lleva su rotulo DEBAJO, o los dos textos se pisan y no se lee
    // ninguno de los dos.
    const alto = y < M.t+30, ty = (alto ? y+11 : y-4).toFixed(1);
    g+=`<line class="gr-um" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="${u.color}"/>`;
    if(c.rotulosUmbralExternos)rotUm.push({y,v:u.v,color:u.color});
    if(c.rotularUmbrales!==false)g+=`<text class="gr-um-t" x="${W-M.r-2}" y="${ty}" text-anchor="end" fill="${u.color}">${esc(u.corto||u.nombre)}</text>`;});
  if(rotUm.length){rotUm.sort((a,b)=>a.y-b.y);for(let i=1;i<rotUm.length;i++)if(rotUm[i].y-rotUm[i-1].y<12)rotUm[i].y=rotUm[i-1].y+12;
    const sobra=rotUm.at(-1).y-(M.t+ih-2);if(sobra>0)rotUm.forEach(z=>z.y-=sobra);
    rotUm.forEach(z=>g+=`<text class="gr-um-ext" x="${W-M.r+6}" y="${Math.max(M.t+8,z.y+3).toFixed(1)}" fill="${z.color}">${num(z.v,Math.abs(z.v)<10?2:1)}${c.unidad?" "+esc(c.unidad):""}</text>`);}
  const rotulos=[];
  (c.series||[]).forEach((s,si)=>{const tr=[];let a=[];
    s.v.forEach((v,i)=>{if(v==null||!isFinite(v)){if(a.length>1)tr.push(a);a=[]}else a.push([X(i),Y(v)])});
    if(a.length>1)tr.push(a);
    tr.forEach(x=>{
      if((c.series||[]).length===1 && s.clase==="gr-obs" && x.length>1){
        const base=Y(lo), sup=x.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ");
        g+=`<path class="gr-area" d="M ${x[0][0].toFixed(1)} ${base.toFixed(1)} L ${sup} L ${x[x.length-1][0].toFixed(1)} ${base.toFixed(1)} Z"/>`;
      }
      g+=`<path class="${s.clase}" d="${ruta(x)}" ${s.color?`stroke="${s.color}"`:""}`
        + `${s.guion?` stroke-dasharray="${s.guion}"`:""}/>`;
    });
    if((c.series||[]).length===1 && s.clase==="gr-obs" && tr.length){
      const u=tr[tr.length-1],pt=u[u.length-1];
      g+=`<circle class="gr-fin" cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="4"/>`;
    }
    // Nombre al final de la curva. Con varias series superpuestas, una leyenda
    // aparte obliga a ir y volver; el nombre donde acaba la linea se lee de una vez.
    if(s.rotulo && tr.length){
      const ult=tr[tr.length-1], pt=ult[ult.length-1];
      rotulos.push({x:pt[0]+4, y:pt[1]+3, t:s.rotulo,
                    col:s.colorRot||"currentColor"});
    }});
  /* Los nombres se escribian donde acabara cada curva, asi que dos lineas que
     terminan juntas ponian sus nombres uno encima del otro. Se reparten en
     vertical: ordenados por altura, separados lo justo para que quepan, y
     recolocados si el reparto se sale del lienzo. */
  if(rotulos.length){
    // 13 px, no 10,5: el texto de .gr-rot mide 11,6 de alto y con 10,5 los
    // nombres seguian rozandose. Se mide la caja real, no el tamaño de fuente.
    const ALTO=13;
    rotulos.sort((a,b)=>a.y-b.y);
    for(let z=1;z<rotulos.length;z++)
      if(rotulos[z].y - rotulos[z-1].y < ALTO)
        rotulos[z].y = rotulos[z-1].y + ALTO;
    const sobra = rotulos[rotulos.length-1].y - (M.t+ih);
    if(sobra > 0) rotulos.forEach(r=>r.y -= sobra);
    rotulos.forEach(r=>{ g+=`<text class="gr-rot" x="${r.x.toFixed(1)}" `
      + `y="${Math.max(M.t+8, r.y).toFixed(1)}" fill="${r.col}">${esc(r.t)}</text>`;});
  }
  (c.etiquetasX||[]).forEach(e=>{g+=`<text class="gr-tick" x="${X(e.i).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(e.t)}</text>`});
  // Etiquetas de valor sobre la propia curva: en operacion se lee el numero,
  // no se estima la altura contra el eje.
  // Se descartan las etiquetas que se solaparian con una ya escrita. Se ordenan
  // por valor descendente para que, cuando haya que elegir, sobreviva la cifra
  // mas alta: en un hietograma es la que importa.
  // Las etiquetas de dia van primero y quedan registradas como ocupadas: si no,
  // el valor del primer punto se escribia encima del rotulo del dia y salia
  // "28máx17" superpuesto.
  const puestas=[];
  const ANCHO_CAR=5.6;   // ancho medio de un digito a 10px en la fuente mono
  (c.dias||[]).forEach(d=>{
    const x0=X(d.i), x1=d.fin!=null?X(d.fin):W-M.r;
    if(x1-x0<=34)return;
    puestas.push({x0:x0+4,x1:x0+4+String(d.t).length*5.2,y:M.t-17});
  });
  [...(c.puntos||[])]
    .map((pt,orden)=>({...pt,orden}))
    .sort((a,b)=>(b.v??-Infinity)-(a.v??-Infinity))
    .forEach(pt=>{
      if(pt.v==null||!isFinite(pt.v))return;
      const txt=pt.t!=null?String(pt.t):num(pt.v,Math.abs(pt.v)<10?1:0);
      const px=X(pt.i), py=Y(pt.v), arriba=pt.abajo?1:-1;
      const w=txt.length*ANCHO_CAR;
      const x0=pt.ancla==="end"?px-w:pt.ancla==="start"?px:px-w/2;
      const y0=py+arriba*7;
      const choca=puestas.some(q=>Math.abs(q.y-y0)<12 &&
                                  x0<q.x1+3 && x0+w>q.x0-3);
      if(choca)return;
      puestas.push({x0,x1:x0+w,y:y0});
      g+=`<text class="gr-eti" x="${px.toFixed(1)}" y="${y0.toFixed(1)}"
          text-anchor="${pt.ancla||"middle"}" fill="${pt.color||"var(--acento)"}"
          >${esc(txt)}</text>`;});
  return`<svg class="grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="${esc(c.alt||"gráfico")}"
    data-m="${M.l},${M.t},${iw},${ih},${lo},${hi},${n}">${g}</svg>`;
}

/* Enlaza un grafico con un lector: al mover el cursor muestra el valor y la hora
   del registro bajo el puntero, y marca su posicion con una cruz. */
/* `series` es opcional: [{nombre, v, color}]. Cuando se pasa, el globo lista el
   valor de TODAS las curvas en esa fecha, no solo el de una. Con once modelos
   encima, leer un unico numero obligaba a adivinar de cual era. La cruz y el
   punto siguen marcando `valores`, que es la curva de referencia. */
function lector(cajaSel, valores, tiempos, unidad, fmt, series){
  const caja=$(cajaSel); if(!caja)return;
  const svg=caja.querySelector("svg.grafico"); if(!svg)return;
  let cap=caja.querySelector(".lector");
  if(!cap){cap=document.createElement("div");cap.className="lector";cap.hidden=true;
    caja.style.position="relative";caja.appendChild(cap);}
  const m=(svg.dataset.m||"").split(",").map(Number);
  if(m.length<7)return;
  const [ML,MT,iw,ih,lo,hi,n]=m;
  const cruz=document.createElementNS("http://www.w3.org/2000/svg","g");
  cruz.setAttribute("class","gr-cruz-g"); cruz.style.display="none";
  cruz.innerHTML=`<line class="gr-cruz" y1="${MT}" y2="${MT+ih}"/>
    <circle class="gr-marca" r="3.6"/>`;
  svg.appendChild(cruz);
  const vb=svg.viewBox.baseVal;
  svg.onmousemove=ev=>{
    const r=svg.getBoundingClientRect();
    const sx=(ev.clientX-r.left)/r.width*vb.width;
    let i=Math.round((sx-ML)/(n<2?iw:iw/(n-1)));
    i=Math.max(0,Math.min(n-1,i));
    const v=valores[i];
    if(v==null||!isFinite(v)){cruz.style.display="none";cap.hidden=true;return;}
    const px=ML+(n<2?iw/2:i*iw/(n-1));
    const py=MT+ih-((v-lo)/(hi-lo))*ih;
    cruz.style.display="";
    cruz.children[0].setAttribute("x1",px); cruz.children[0].setAttribute("x2",px);
    cruz.children[1].setAttribute("cx",px); cruz.children[1].setAttribute("cy",py);
    if(series && series.length){
      const filas = series.map(s=>{
        const y = s.v && s.v[i];
        if(y==null || !isFinite(y)) return "";
        return `<span class="lec-f"><i class="lec-c" style="background:${s.color||"var(--tinta2)"}"></i>`
          + `${esc(s.nombre)}<b>${fmt?fmt(y):num(y,2)}</b></span>`;
      }).filter(Boolean).join("");
      cap.innerHTML = `<i>${esc(tiempos&&tiempos[i]?tiempos[i]:"")}</i>`
        + `<span class="lec-u">${esc(unidad||"")}</span>${filas}`;
    } else {
      cap.innerHTML=`<b>${fmt?fmt(v):num(v,2)}</b> ${esc(unidad||"")}
        <i>${esc(tiempos&&tiempos[i]?tiempos[i]:"")}</i>`;
    }
    cap.hidden=false;
    const cr=caja.getBoundingClientRect(), pr=cap.getBoundingClientRect();
    let lx=ev.clientX-cr.left+12, ly=ev.clientY-cr.top-8;
    if(lx+pr.width>cr.width-4)lx=ev.clientX-cr.left-pr.width-12;
    cap.style.left=Math.max(2,lx)+"px";
    cap.style.top=Math.max(2,Math.min(ly,cr.height-pr.height-2))+"px";
  };
  svg.onmouseleave=()=>{cruz.style.display="none";cap.hidden=true;};
}

/* ==================================================== MONITOREO ========= */
/* ARRANQUE: METEOROLOGICO, CON VALORES Y UMBRALES ENCENDIDOS.
   Es el estado con el que se empieza a mirar la pantalla todas las mañanas, y
   tenerlo que reconstruir a mano en cada sesion -tres clics- es trabajo que la
   herramienta puede ahorrarse. Los tres siguen siendo conmutables, y la URL
   manda sobre esto: ?umbrales=0, ?valores=0 y ?variable=... siguen funcionando
   para cuando se comparte un enlace a una vista concreta. */
const M={d:null,sel:null,soloLinea:false,busca:"",timer:null,fam:"meteo",
         vista:"serie",escala:"horaria",mostrarUmbrales:true,mostrarValores:true,stats:{},carto:null,vars:null,
         // `estaciones` empieza encendido: son el dato. Se puede apagar para
         // mirar la nubosidad del satelite sin cien puntos encima.
         mapa:{complejos:false,centrales:false,codigos:false,leyenda:true,
               estaciones:true,
               // null | "geocolor" | "infrarrojo". Apagado al abrir: son teselas
               // externas y no deben pedirse si nadie las ha pedido.
               satelite:null},
         // Estado de la secuencia de satelite. `animar` arranca en true porque
         // la secuencia es el producto: una imagen fija no dice hacia donde va.
         goes:{animar:true}};
let MAPA_L=null,MAPA_BASE=null,MAPA_GAL=null,MAPA_BASE_GAL=null,MAPA_AJUSTADO=false;
const MAPA_CAPAS={provincias:null,complejos:null,centrales:null,estaciones:null,codigos:null};
const MAPA_GAL_CAPAS={provincias:null,estaciones:null,codigos:null};
const colRiesgo=r=>r>=55?"var(--emergencia)":r>=25?"var(--alerta)":r>=10?"var(--atencion)":"var(--acento)";
const claseRiesgo=r=>r>=55?"r-alto":r>=25?"r-medio":"";

function velo(on,texto){
  const c=$("#mapa"); if(!c)return;
  let v=c.querySelector(".cargando");
  if(on){
    if(!v){v=document.createElement("div");v.className="cargando";c.appendChild(v);}
    v.textContent=texto||"consultando…";
  }else if(v)v.remove();
}
/* La consulta al servidor trae SIEMPRE la ventana larga y el recorte se hace
   aquí. Así, mover el selector de ventana no vuelve a consultar la red de observación ni
   redibuja el mapa: la ventana solo gobierna la serie temporal, que es lo único
   sobre lo que actúa, y el cambio es instantáneo.
   Cuesta 737 kB en vez de 260, y tarda lo mismo (~1 s). */
const VENTANA_MAX = 720;
function horasConsulta(){
  const h=+(($("#f-horas")||{}).value)||48;
  return M.escala==="diaria"?Math.min(h+48,768):Math.max(h,168);
}
function serieVentana(cod){
  const s = M.d && M.d.series[cod];
  if(!s) return null;
  const horas = +($("#f-horas")||{}).value || 48;
  if(horas >= VENTANA_MAX || !s.t.length) return s;
  const corte = new Date(new Date(s.t[s.t.length-1]).getTime() - horas*3600000);
  let i = 0;
  while(i < s.t.length && new Date(s.t[i]) < corte) i++;
  if(i === 0) return s;
  const rec = {t:s.t.slice(i), v:s.v.slice(i)};
  if(s.v_min) rec.v_min = s.v_min.slice(i);
  return rec;
}

/* Un latido que aun no ha vuelto no debe solaparse con el siguiente. Si
   la red de observación tarda mas que el intervalo de refresco las peticiones se apilan, y
   entonces puede volver una respuesta vieja DESPUES de una nueva y pisarla: el
   visor se quedaria enseñando datos mas antiguos que los que ya tenia. El
   contador de orden descarta toda respuesta que llegue tarde. */
let _latido = 0, _enVuelo = false;

async function latir(cambio){
  const v=$("#f-var").value; if(!v)return;
  if(_enVuelo && !cambio) return;        // el anterior sigue en camino
  const mio = ++_latido;
  _enVuelo = true;
  luz("carga","consultando…");
  // La primera consulta a una variable poco usada puede tardar (la red de observación no tiene
  // indice por fecha en esas tablas). Sin aviso parece que el visor se colgo.
  if(cambio)velo(true,"cargando "+($("#f-var").selectedOptions[0]||{}).text+"…");
  const t0=performance.now();
  try{
    // encodeURIComponent: hay variables con "+" en el nombre
    // (temperatura_del_suelo_a_+5cm) y sin codificar llega como espacio, asi
    // que esa variable devolvia error y era la unica que no cargaba.
    const r=await fetch(`api/pulso?variable=${encodeURIComponent(v)}`
      +`&horas=${horasConsulta()}`,{cache:"no-store"});
    const d=await r.json();
    if(mio!==_latido)return;             // llego tarde: ya hay algo mas nuevo
    if(d.error){luz("error","la red de observación no responde");return;}
    M.d=d;
    // al cambiar de variable con el boton "ver nivel/caudal" se conserva la
    // estacion: sin esto el salto devolvia al usuario a la lista entera
    if(M.pendiente && d.estaciones.some(z=>z.codigo===M.pendiente)){
      M.sel = M.pendiente;
    }
    M.pendiente = null;
    pintarMon();
    // censo de variables hermanas, en segundo plano: no debe retrasar el pintado
    if(M.fam === "hidro") censarHermanas();
    _vivo.t0=Date.now(); _vivo.n=d.estaciones.length; _vivo.marca=marcaMasNueva(d);
    luz("ok");
  }catch(e){ if(mio===_latido)luz("error","servidor caído"); }
  finally{ if(mio===_latido){_enVuelo=false;velo(false);} }
}
function luz(e,t){$("#luz").className="luz"+(e==="error"?" error":e==="carga"?" parado":"");
  _vivo.on=(e==="ok"); if(!_vivo.on)$("#luz-txt").textContent=t; else rotulo();}

/* El dato de la red de observación avanza una vez por hora, asi que un refresco correcto casi
   siempre repinta lo mismo y parece que el visor esta parado. El contador que
   corre solo demuestra que sigue latiendo, y la hora del dato dice lo unico que
   de verdad importa: cuan viejo es lo que se esta mirando. Son dos edades
   distintas y confundirlas es lo que hace pensar que hay que refrescar a mano. */
const _vivo = {on:false, t0:0, n:0, marca:null};

function marcaMasNueva(d){
  let m = null;
  for(const s of Object.values(d.series||{}))
    if(s.t && s.t.length){ const x = s.t[s.t.length-1]; if(!m || x > m) m = x; }
  return m;
}
function edad(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if(s < 60) return `hace ${s} s`;
  const m = Math.floor(s/60);
  if(m < 60) return `hace ${m} min`;
  const h = Math.floor(m/60);
  return `hace ${h} h ${String(m%60).padStart(2,"0")}`;
}
function rotulo(){
  if(!_vivo.on || !_vivo.t0) return;
  let t = `${_vivo.n} est · ${edad(Date.now()-_vivo.t0)}`;
  if(_vivo.marca){
    const d=new Date(_vivo.marca);
    const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    t += ` · dato ${hm} (${edad(Date.now()-d.getTime()).replace("hace ","")})`;
  }
  $("#luz-txt").textContent = t;
}
setInterval(rotulo, 1000);

function filtradas(){
  if(!M.d)return[];
  let e=[...M.d.estaciones];
  if(M.soloLinea)e=e.filter(x=>x.estado==="en linea");
  if(M.busca){const q=slug(M.busca);
    e=e.filter(x=>slug(`${x.codigo} ${x.nombre} ${x.cuenca} ${x.provincia}`).includes(q));}
  return e;
}

function pintarMon(){
  const d=M.d;if(!d)return;
  const e=d.estaciones,u=d.unidad||"",lluvia=d.variable==="precipitacion";
  const operativas=e.filter(x=>x.estado==="en linea"&&finito(x.horas_sin_dato)&&x.horas_sin_dato<5);
  const cnt=k=>operativas.filter(x=>x.alerta===k).length;
  const emer=cnt("emergencia"),aler=cnt("alerta"),aten=cnt("atencion");
  const enL=e.filter(x=>x.estado==="en linea").length;
  const nivelesRiesgo=new Set(["atencion","alerta","emergencia"]);
  const riesgo=operativas.filter(x=>nivelesRiesgo.has(x.alerta));
  const sosp=e.filter(x=>x.sospecha).length;
  document.documentElement.style.setProperty("--col-prio",
    (riesgo.length>=4?380:riesgo.length>=1?320:240)+"px");

  /* El corte real de la red = la estacion MENOS retrasada. Usar la mediana
     diria "2,6 h" aunque media red estuviera muda; el minimo dice hasta que
     hora hay dato, que es lo que decide si el visor sirve ahora mismo.
     Va fuera de la rama porque nivel y lluvia lo necesitan igual. */
  const lags=e.map(x=>x.horas_sin_dato).filter(finito);
  const lag=lags.length?Math.min(...lags):null;
  /* La hora se toma del SELLO del dato mas reciente, no de restarle el retraso
     al reloj del navegador: ese calculo mezclaba el reloj del servidor -que
     midio el retraso- con el del cliente, y la casilla decia 10:54 mientras el
     latido, tres centimetros mas arriba, decia 11:00. Dos relojes que no
     coinciden en la misma pantalla hacen dudar de todo lo demas. */
  const sellos=e.map(x=>x.ultimo_t).filter(Boolean).sort();
  const sello=sellos.length?sellos[sellos.length-1]:null;
  /* La antiguedad se deriva del MISMO sello que se muestra, igual que el
     latido. Antes venia de `horas_sin_dato`, que el servidor calcula con otra
     consulta: misma hora arriba y abajo, pero "43 min" en un sitio y "54 min"
     en el otro. */
  const minEdad = sello ? Math.max(0, Math.round((Date.now()-new Date(sello))/60000)) : null;
  const retrasoRed = (minEdad==null)
    ? {txt:"—", pie:"sin estaciones transmitiendo", cl:"hot"}
    : {txt:String(sello).slice(11,16),
       pie:`hace ${minEdad<90?minEdad+" min":num(minEdad/60,1)+" h"} · demora normal de la red de observación`,
       cl: minEdad>240?"hot":minEdad>180?"warm":""};

  let kpis;
  if(lluvia){
    // Los sensores marcados como no-lluvia quedan fuera de TODOS los agregados,
    // no solo de las alertas: si M5190 no mide lluvia, sus 529 mm no pueden
    // aparecer como "máximo de la red" ni inflar la media.
    const val=e.filter(x=>!x.sospecha);
    /* Un acumulado nulo es "no se", no "cero": sumarlo como cero rebajaba la
       media de la red con las estaciones que aun no han reportado. Se excluyen
       del recuento y se dice sobre cuantas se calcula. */
    const conA24=val.filter(x=>finito((x.acumulados||{})[24]));
    const a24s=conA24.map(x=>x.acumulados[24]);
    const conLluvia=a24s.filter(z=>z>0.2).length;
    /* Un maximo sin su estacion obliga a buscarla a mano en 169 tarjetas: el
       numero solo dice que algo pasa, no donde. */
    const peor=conA24.length
      ? conA24.reduce((a,x)=>x.acumulados[24]>a.acumulados[24]?x:a) : null;
    const max24=peor?peor.acumulados[24]:0;
    /* Cuantas estan LLOVIENDO, no cuanto llovio de media.
       El promedio de la red mezclaba la costa con la sierra en un solo numero
       que no decide nada -y ademas el navegador traducia "Media red" como
       "medio rojo"-. Para vigilar importa si el episodio sigue vivo: 24 h de
       acumulado es historia, la lluvia en curso es lo que puede crecer. */
    const activas=val.filter(x=>x.fase_lluvia==="activa").length;
    const reactiv=val.filter(x=>x.reactivada).length;
    kpis=[["Con lluvia 24 h",conLluvia,`de ${a24s.length} con dato`,""],
      ["Máximo 24 h",num(max24,1),
       peor?`mm · ${peor.codigo} ${String(peor.nombre||"").slice(0,18)}`:"mm acumulados",
       max24>=60?"hot":max24>=30?"warm":""],
      ["Lloviendo ahora",activas,
       reactiv?`${reactiv} sobre suelo ya cargado`:"estaciones con lluvia en curso",
       reactiv?"hot":activas?"warm":""],
      ["Emergencia",emer,"lluvia extrema",emer?"hot":""],
      ["Alerta",aler,"lluvia intensa",aler?"hot":""],
      ["Atención",aten,"lluvia significativa",aten?"warm":""],
      ["En línea",`${enL}/${e.length}`,"menos de 5 h sin transmitir",""],
      /* El retraso de la red va AQUI y no en cada tarjeta. Toda la red comparte
         el mismo suelo -la red de observación publica la hora completa con unas 2,5 h de
         demora-, asi que es un dato de la red, no de la estacion. Puesto una
         sola vez explica de golpe por que las ventanas de 1 h y 3 h suelen
         faltar; repetido 169 veces solo tapaba. */
      ["Datos hasta",retrasoRed.txt,retrasoRed.pie,retrasoRed.cl]];
  }else{
    const subiendo=e.filter(x=>x.pendiente_h>0).length;
    /* CUANDO NO PASA NADA, LA CASILLA TIENE QUE SEGUIR DICIENDO ALGO
       Cinco ceros en fila no informan: no distinguen "todo tranquilo" de "el
       visor no esta leyendo". Sin ningun rio en riesgo se nombra el que mas se
       acerca a su umbral, que es la pregunta siguiente de quien vigila. */
    const escalaQC="horario";
    const conQC=e.filter(x=>x.umbral_qc&&x.umbral_qc[escalaQC]);
    const cerca=e.map(x=>{
        const q=x.umbral_qc&&x.umbral_qc[escalaQC];
        const a=q&&q.atencion;
        return finito(a)&&a>0&&finito(x.ultimo)?{x,f:x.ultimo/a}:null;
      }).filter(Boolean).sort((p,q)=>q.f-p.f)[0];
    const pieRiesgo = riesgo.length
      ? "cerca del umbral y subiendo"
      : (cerca?`el más alto: ${cerca.x.codigo} al ${num(cerca.f*100,0)}% de atención`
              :"sin umbrales recalculados");
    const esTemp=d.variable==="temp_aire";
    kpis=[["En riesgo",riesgo.length,pieRiesgo,riesgo.length?(emer||aler?"hot":"warm"):""],
      ["Muy alto",emer,esTemp?"sobre P99 o bajo P1":"sobre P99",emer?"hot":""],
      ["Alto",aler,esTemp?"sobre P95 o bajo P5":"sobre P95",aler?"hot":""],
      ["Medio",aten,esTemp?"sobre P90 o bajo P10":"sobre P90",aten?"warm":""],
      ["Subiendo",subiendo,`de ${e.length} · últimas 6 h`,""],
      ["En línea",`${enL}/${e.length}`,"menos de 5 h sin transmitir",
       enL<e.length/2?"hot":enL<e.length*0.8?"warm":""],
      ["Umbrales",`${conQC.length}/${e.length}`,"estaciones con QC",conQC.length<e.length/2?"warm":""],
      ["Datos hasta",retrasoRed.txt,retrasoRed.pie,retrasoRed.cl]];
  }
  $("#mon-kpis").innerHTML=kpis.map(([r,v,p,c])=>`<div class="kpi ${c}"><div class="rot">${esc(r)}</div>
    <div class="val">${esc(String(v))}</div><div class="pie">${esc(p)}</div></div>`).join("");

  // Prioridad significa umbral realmente superado y dato vigente. La cercanía
  // matemática a un umbral y una estación muda se explican en otros lugares;
  // ninguna de las dos debe convertirse en una falsa orden de VIGILAR.
  const prio=riesgo.slice().sort((a,b)=>b.riesgo-a.riesgo).slice(0,14);
  // "descartado" no dice nada por si solo: se nombra el motivo y la estacion
  const listaSosp=e.filter(x=>x.sospecha);
  M.sospechosos=listaSosp;

  /* EL AVISO DE SENSOR AVERIADO SOBREVIVE A LA COLUMNA QUE LO ALOJABA.
     Vivia en el subtitulo del panel Prioridad. Al quitar ese panel -decia lo
     mismo que Estaciones, que ya viene ordenada por riesgo- el aviso se habria
     ido con el, y es de las pocas cosas de la pantalla que exigen una accion
     concreta: un sensor averiado no se arregla mirando la grafica.
     Pasa a la fila de indicadores, que es lo primero que se lee. */
  const kAvisos = $("#mon-kpis");
  if (kAvisos && listaSosp.length) {
    const chip = document.createElement("div");
    chip.className = "kpi atencion";
    chip.id = "aviso-sensor";
    chip.style.cursor = "help";
    chip.innerHTML = `<div class="rot">SENSORES</div>`
      + `<div class="val">${listaSosp.length}</div>`
      + `<div class="pie">con avería detectada</div>`;
    kAvisos.appendChild(chip);
  }

  /* El panel de Prioridad ya no existe en el DOM. Se conserva el calculo
     porque `prio` y `M.sospechosos` los usan el mapa y el detalle, pero el
     pintado se salta si no hay donde pintar, en vez de reventar la funcion
     entera y dejar la pantalla a medias. */
  const cajaPrio = $("#prio-lista");
  if (cajaPrio) cajaPrio.innerHTML=prio.length?prio.map(x=>{
    const c=colRiesgo(x.riesgo),cl=claseRiesgo(x.riesgo),s=serieVentana(x.codigo);
    /* La etiqueta dice ademas EN QUE momento del episodio esta. Un "VIGILAR"
       sostenido por el acumulado de 12 h cuando lleva siete horas sin llover se
       lee como si estuviera lloviendo ahora, y no lo esta: M1217 marcaba VIGILAR
       a las 09 por un aguacero que escampo a las 03.
       La reactivacion va aparte y en rojo: la misma lluvia sobre suelo ya cargado
       escurre mucho mas que la primera, asi que es el caso mas peligroso y el que
       antes se veia igual que cualquier otro. */
    const ins=x.riesgo>=55?"CRÍTICO":x.riesgo>=25?"VIGILAR":"";
    /* ESTADO DE LA LLUVIA, EN CASTELLANO LLANO
       "Amainando" y "antecedente" son palabras de informe, no de pantalla. Lo
       que el turno necesita saber cabe en tres frases: si llueve, cuando paro,
       o si no hay dato. La hora que se da es la REAL -incluye el retraso de la
       ingesta-, porque al suelo le da igual cuando nos llego el dato. */
    const faseTexto=(x)=>{
      const h=x.horas_sin_lluvia, n=h==null?null:num(h,0);
      if(x.reactivada)              return ["reactiva","Vuelve a llover"];
      if(x.fase_lluvia==="activa")  return ["activa","Llueve ahora"];
      if(x.fase_lluvia==="sin_dato")return ["sin_dato",`No transmite desde hace ${n} h`];
      if(x.fase_lluvia==="amainando")   return ["amainando",`Paró de llover hace ${n} h`];
      if(x.fase_lluvia==="antecedente") return ["antecedente",`Sin lluvia desde hace ${n} h`];
      return ["",""];
    };
    const [fcl,ftx]=lluvia&&x.fase_lluvia?faseTexto(x):["",""];
    const fase=ftx?`<span class="fase ${fcl}">${esc(ftx)}</span>`:"";
    /* La edad del dato solo se muestra cuando es ANORMAL. Toda la red va con
       2,6 h de retraso: repetirlo en las 169 tarjetas no informa de nada y tapa
       lo que si distingue a una estacion de otra. El retraso normal se dice una
       sola vez en la cabecera; aqui solo se marca quien va peor que la red. */
    const edad = lluvia && x.horas_sin_dato>=5
      ? `<span class="edad viejo" title="Esta estación va más retrasada que el resto de la red">× ${num(x.horas_sin_dato,0)} h sin transmitir</span>` : "";
    const ac=x.acumulados||{};
    /* Las ventanas que no tienen dato NO se dibujan. Antes salian como "1h —",
       un recuadro del mismo tamaño que un valor real para decir que no hay
       valor; con el suelo de 2,6 h de la red de observación esas dos casillas estarian vacias
       casi siempre, ruido fijo en todas las tarjetas. Cuando la ventana corta
       si llega -y llega cuando importa, en lluvia intensa- aparece sola. */
    const chips=[1,3,6,12,24].map(h=>`<span class="acum${finito(ac[h])&&ac[h]>0?"":" cero"}">${h} h <b>${finito(ac[h])?num(ac[h],1):"—"}</b></span>`);
    const acums=lluvia?`<div class="acums">
        <div class="fase-fila">${fase}${edad}</div>
        <div class="chips">${chips.length?chips.join("")
          :`<span class="acum vacio">sin acumulados aún</span>`}</div>
      </div>`:"";
    const tend=lluvia?"":`<span class="d" style="color:${x.pendiente_h>0?"var(--atencion)":"var(--tinta3)"}">
        ${x.pendiente_h>0?"▲":x.pendiente_h<0?"▼":"■"} ${num(Math.abs(x.pendiente_h||0),3)}/h${x.acelera?" ⚡":""}</span>`;
    return`<div class="tar ${cl}" data-cod="${esc(x.codigo)}" tabindex="0" role="button"
      ${M.sel===x.codigo?'aria-selected="true"':""} style="border-left-color:${c}">
      <div class="l1"><span class="cod">${esc(x.codigo)}</span>
        <span class="nom">${esc(x.nombre||"")}</span>
        ${ins?`<span class="insignia" style="color:${c}">${ins}</span>`:""}</div>
      <div class="l2"><span class="v">${num(x.ultimo,lluvia?1:2)}</span>
        <span style="font-size:9.5px;color:var(--tinta3)">${esc(u)}</span>${tend}
        <span class="spark">${s?chispa(s.v,cl==="r-alto"?86:58,cl==="r-alto"?24:18,c,lluvia):""}</span></div>
      ${acums}
      <div class="barra-r"><i style="width:${Math.min(x.riesgo,100)}%;background:${c}"></i></div>
    </div>`;}).join("")
    :`<div class="calma">${lluvia?"No hay lluvia significativa en la red."
      :"Ningún río se acerca a su umbral."}<br>
      <span style="font-size:10.5px">${lluvia
        ?"Manda el acumulado que peor esté: 1, 3, 6, 12, 24 o 48 h."
        :"Cercanía al umbral + velocidad de ascenso + aceleración."}</span></div>`;

  const f=filtradas();
  $("#rej-n").textContent=f.length;
  $("#rej-sub").textContent=lluvia?`acumulado 24 h · mm`:`por riesgo · ${u}`;
  $("#rejilla").innerHTML=f.length?f.map(x=>{
    const c=colRiesgo(x.riesgo),s=serieVentana(x.codigo);
    /* sin acumulado de 24 h no hay color: pintarla como 0 mm la mete en el
       mismo verde que una estacion seca de verdad. */
    const a24=(x.acumulados||{})[24];
    const v=lluvia?(finito(a24)?a24:null):x.ultimo;
    return`<div class="mini" data-cod="${esc(x.codigo)}" tabindex="0" role="button"
      ${M.sel===x.codigo?'aria-selected="true"':""} style="border-left-color:${x.riesgo>0?c:"var(--linea)"}"
      title="${esc(x.nombre||"")}${x.sospecha?" · "+esc(x.sospecha):""}">
      <div class="c">${esc(x.codigo)}</div><div class="n">${esc(x.nombre||"")}</div>
      <div class="f"><span class="v">${num(v,lluvia?1:2)}</span>${s?chispa(s.v,54,16,c,lluvia):""}</div>
    </div>`;}).join(""):`<div class="vacio">Ninguna estación cumple el filtro</div>`;

  if(!M.sel&&e.length)M.sel=e[0].codigo;
  engancharAvisoSensor();
  pintarMapa();pintarSerie();
}

/* ---------------------------------------------------------------- mapa --- */
function cssMapa(nombre,alterno){
  const v=getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
  return v||alterno;
}
function colorRiesgoMapa(r){
  return r>=55?cssMapa("--emergencia","#B3261E"):r>=25?cssMapa("--alerta","#C2410C"):
    r>=10?cssMapa("--atencion","#D97706"):cssMapa("--tinta3","#8A94A6");
}
function radioEstacion(x){return x.alerta==="emergencia"?7:x.alerta==="alerta"?6:x.alerta==="atencion"?5:3.6;}
function escalaMapa(){
  if(!MAPA_L||!MAPA_CAPAS.estaciones)return;
  const z=MAPA_L.getZoom(),f=Math.max(.88,Math.min(1.55,1+(z-7)*.075));
  MAPA_CAPAS.estaciones.eachLayer(m=>{
    if(m._radioBase)m.setRadius((m._radioBase+(m._seleccionada?2:0))*f);
    if(m.setStyle)m.setStyle({weight:m._seleccionada?Math.max(2,1.5*f):Math.max(1,1.05*f)});
  });
  const ef=Math.max(.90,Math.min(1.18,.94+(z-7)*.035));
  document.querySelectorAll(".codigo-estacion span,.estacion-sin-transmitir span").forEach(n=>n.style.transform=`scale(${ef})`);
}
/* LA LEYENDA CUENTA, NO SOLO NOMBRA.
   Decia que colores existen. Lo que hace falta saber de un vistazo es CUANTAS
   estaciones hay en cada categoria: "Alto 3" se lee y se decide; "Alto" obliga a
   contar puntos en el mapa. Las categorias sin ninguna estacion siguen sin
   mostrarse, para que la leyenda no crezca con filas en cero. */
function leyendaMapaDinamica(d){
  const lluvia=d.variable==="precipitacion", e=d.estaciones||[];
  const fila=(color,tam,txt,n,tipo="punto")=>`<div class="fila"><i class="${tipo}" style="${tipo==="linea"?`background:${color}`:`width:${tam}px;height:${tam}px;background:${color}`}"></i><span>${txt}</span>${n==null?"":`<b class="cuenta-ley">${n}</b>`}</div>`;
  let h=`<div class="titulo">${lluvia?"Precipitación actual":"Nivel de riesgo"}</div>`;
  if(lluvia){
    const llueve=e.filter(x=>x.fase_lluvia==="activa").length;
    h+=fila("var(--lluvia)",8,"Llueve ahora",llueve)
      +fila("var(--seco)",6,"Sin lluvia",e.length-llueve);
  }
  const activos=[
    ["emergencia","var(--emergencia)",9,"Muy alto"],
    ["alerta","var(--alerta)",8,"Alto"],
    ["atencion","var(--atencion)",7,"Medio"]];
  let enRiesgo=0;
  activos.forEach(([k,c,z,t])=>{
    const n=e.filter(x=>x.alerta===k).length;
    enRiesgo+=n;
    if(n)h+=fila(c,z,t,n);
  });
  if(!lluvia)h+=fila("var(--tinta3)",6,"Normal",Math.max(e.length-enRiesgo,0));
  const mudas=e.filter(x=>finito(x.horas_sin_dato)&&x.horas_sin_dato>=5).length;
  if(mudas)h+=`<div class="fila"><i class="aspa">×</i><span>No transmite</span><b class="cuenta-ley">${mudas}</b></div>`;
  if(M.mapa.complejos)h+=fila("var(--hidro)",0,"Complejo",null,"linea");
  if(M.mapa.centrales)h+=fila("var(--hidro-cl)",6,"Central",null);
  return h;
}
/* ==================================================== SATELITE GOES ======
   Imagineria del ABI de GOES-East, servida por NASA GIBS como WMTS estandar.
   Sin clave y sin proxy: son teselas como las del mapa base.

   POR QUE ANIMADO Y NO UNA IMAGEN SUELTA
     Una foto fija dice donde hay nubes. La secuencia dice HACIA DONDE VAN y si
     la celda esta creciendo o muriendo, que es lo que decide si hay que vigilar
     una cuenca. Se cargan los ultimos cuadros y se pasan en bucle.

   EL RETRASO SE DICE, NO SE ESCONDE
     Medido sobre Ecuador el 18-sep-2026: 26 min el infrarrojo, 36 el GeoColor,
     con imagen nueva cada 10 minutos. Es lo normal en teselas GOES publicas.
     Media hora de retraso sirve para ver por donde entra un sistema, pero
     llamarlo "ahora" seria mentir: la hora de cada cuadro va escrita.

   GALAPAGOS TAMBIEN
     La misma secuencia se pinta en el recuadro insular. Las islas estan a
     1.000 km de la costa y su nubosidad no tiene nada que ver con la del
     continente; ensenar satelite solo en el continente dejaria ciega justo la
     parte del pais donde no hay casi estaciones.

   NIVELES DISTINTOS POR BANDA
     Cada capa se publica hasta un zoom distinto. Pedir por encima devuelve 400,
     asi que se declara y Leaflet reescala con maxNativeZoom. */
const GOES_BANDAS = {
  infrarrojo: {etiqueta:"Infrarrojo 10,3 um", capa:"GOES-East_ABI_Band13_Clean_Infrared",
               nivel:6, opacidad:.75, escala:"ir"},
  geocolor:   {etiqueta:"GeoColor", capa:"GOES-East_ABI_GeoColor", nivel:7,
               opacidad:.80, escala:"geocolor"},
  visible:    {etiqueta:"Visible 0,64 um", capa:"GOES-East_ABI_Band2_Red_Visible_1km",
               nivel:7, opacidad:.78, escala:"vis"},
  airmass:    {etiqueta:"Masas de aire", capa:"GOES-East_ABI_Air_Mass", nivel:6,
               opacidad:.72, escala:"airmass"},
  polvo:      {etiqueta:"Polvo y nubes bajas", capa:"GOES-East_ABI_Dust", nivel:7,
               opacidad:.72, escala:"dust"},
  fuego:      {etiqueta:"Temperatura de fuego", capa:"GOES-East_ABI_FireTemp",
               nivel:7, opacidad:.72, escala:"fuego"},
};
const GOES_BASE = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best";
const GOES_N_CUADROS = 10;      // ~100 min de secuencia, a 10 min por cuadro
const GOES_MS = 700;            // velocidad del bucle
const GOES_PAUSA_FIN = 1400;    // se detiene un momento en el ultimo cuadro

/* Las escalas van escritas aqui porque GIBS no publica un colormap para estas
   capas. Se comprobo sobre la tesela real: el Band 13 llega en GRIS (93% de sus
   pixeles son neutros), asi que su lectura es una rampa de un solo eje y se
   puede dibujar. Las de color no lo son y se describen con palabras. */
const GOES_ESCALAS = {
  /* CADA CANAL CON SU ESCALA, NO UNA FRASE GENERICA.
     Los tres primeros son productos de UN eje -mas señal, mas de algo- y se
     leen con una rampa. Los tres ultimos son composiciones RGB: su color no
     ordena nada de menos a mas, sino que cada tono significa una cosa distinta,
     asi que su leyenda son muestras sueltas. Dibujar una rampa para un RGB
     haria creer que hay una gradacion donde no la hay.
     Las lecturas son las estandar de cada producto del ABI. */
  ir:  {titulo:"Tope de nube",
        rampa:"linear-gradient(90deg,#0d0d0d 0%,#6a6a6a 34%,#c9c9c9 52%,"
             +"#f4f4f4 60%,#29b6d8 68%,#3fbf5a 78%,#e8d33c 87%,#d9482f 100%)",
        izq:"cálido · suelo", der:"muy frío · convección"},
  vis: {titulo:"Reflectancia",
        rampa:"linear-gradient(90deg,#0d0d0d,#7a7a7a,#ffffff)",
        izq:"oscuro · superficie", der:"brillante · nube espesa"},
  fuego:{titulo:"Temperatura de fuego",
        rampa:"linear-gradient(90deg,#101010,#8c1c10,#e2571f,#f0b429,#fdf6d8)",
        izq:"frío", der:"foco de calor"},
  geocolor:{titulo:"GeoColor", claves:[
        ["#f2f4f7","nube alta"], ["#b9c6d4","nube baja o niebla"],
        ["#2f6f3e","vegetación"], ["#1d3f6b","mar"]]},
  airmass:{titulo:"Masas de aire", claves:[
        ["#2f8f4e","húmedo tropical"], ["#2a5fa8","frío polar"],
        ["#c0492f","seco estratosférico"]]},
  dust:{titulo:"Polvo y nubes bajas", claves:[
        ["#c86fbe","polvo en suspensión"], ["#c9a86a","superficie seca"],
        ["#7fc2d8","nube baja"]]},
};


let GOES_CUADROS = [], GOES_I = 0, GOES_BUCLE = null, GOES_RECARGA = null;

function goesDef(){ return GOES_BANDAS[M.mapa.satelite] || null; }
function goesSello(minutosAtras){
  const t = new Date(Date.now() - minutosAtras*60000);
  t.setUTCSeconds(0,0); t.setUTCMinutes(Math.floor(t.getUTCMinutes()/10)*10);
  return t;
}
function goesUrl(def, sello){
  return GOES_BASE + "/" + def.capa + "/default/"
       + sello.toISOString().slice(0,19) + "Z"
       + "/GoogleMapsCompatible_Level" + def.nivel + "/{z}/{y}/{x}.png";
}
function goesHoraLocal(sello){
  const l = new Date(sello.getTime() - 5*3600000);
  return String(l.getUTCHours()).padStart(2,"0") + ":"
       + String(l.getUTCMinutes()).padStart(2,"0");
}

/* La ultima imagen disponible se BUSCA. El retraso de GIBS varia y pedir una
   hora que aun no esta deja el mapa vacio sin decir por que. */
async function goesUltimaHora(def){
  for(let m=15;m<=180;m+=10){
    const s=goesSello(m);
    const u=goesUrl(def,s).replace("{z}","4").replace("{y}","8").replace("{x}","4");
    try{ if((await fetch(u,{cache:"no-store"})).ok) return s; }catch(_){}
  }
  return null;
}

/* Panel propio en cada mapa: el filtro de modo oscuro se aplica al panel de
   teselas ENTERO y invertiria la imagen, con las nubes negras sobre suelo
   blanco, que es lo contrario de lo que hay que ver. */
function goesPanel(mapa){
  if(!mapa) return null;
  if(!mapa.getPane("goes")){
    const pn = mapa.createPane("goes");
    pn.style.zIndex = 250;
    pn.classList.add("leaflet-goes-pane");
  }
  return "goes";
}

function goesParar(){ if(GOES_BUCLE){clearInterval(GOES_BUCLE);GOES_BUCLE=null;} }

function goesLimpiar(){
  goesParar();
  if(GOES_RECARGA){clearInterval(GOES_RECARGA);GOES_RECARGA=null;}
  GOES_CUADROS.forEach(c=>{
    try{ if(MAPA_L&&c.capa) MAPA_L.removeLayer(c.capa); }catch(_){}
    try{ if(MAPA_GAL&&c.gal) MAPA_GAL.removeLayer(c.gal); }catch(_){}
  });
  GOES_CUADROS=[]; GOES_I=0;
  const p=document.getElementById("goes-panel"); if(p)p.hidden=true;
}

function goesMostrar(i){
  if(!GOES_CUADROS.length) return;
  GOES_I = (i+GOES_CUADROS.length) % GOES_CUADROS.length;
  const def = goesDef();
  const op = def ? def.opacidad : .75;
  GOES_CUADROS.forEach((c,k)=>{
    const v = (k===GOES_I) ? op : 0;
    if(c.capa) c.capa.setOpacity(v);
    if(c.gal)  c.gal.setOpacity(v);
  });
  const h=document.getElementById("goes-hora");
  if(h){
    const s=GOES_CUADROS[GOES_I].sello;
    const edad=Math.round((Date.now()-s.getTime())/60000);
    h.innerHTML = "<b>"+goesHoraLocal(s)+"</b><span style=\"opacity:.65\"> -"
                + edad + "\u2032 " + (GOES_I+1) + "/" + GOES_CUADROS.length
                + "</span>";
  }
  const barra=document.getElementById("goes-barra");
  if(barra) barra.value=GOES_I;
}

function goesAnimar(){
  goesParar();
  if(!M.goes.animar || GOES_CUADROS.length<2) return;
  GOES_BUCLE=setInterval(()=>{
    /* Una pausa al llegar al ultimo cuadro: sin ella el salto del final al
       principio se lee como un movimiento mas y engana sobre la direccion. */
    if(GOES_I===GOES_CUADROS.length-1){
      goesParar();
      setTimeout(()=>{goesMostrar(0);goesAnimar();},GOES_PAUSA_FIN);
      return;
    }
    goesMostrar(GOES_I+1);
  },GOES_MS);
}

async function goesCargar(){
  const def=goesDef();
  if(!def||!MAPA_L){goesLimpiar();return;}
  const panel=document.getElementById("goes-panel");
  const hora=document.getElementById("goes-hora");
  if(panel)panel.hidden=false;
  if(hora)hora.textContent="buscando imagenes...";

  const ultima=await goesUltimaHora(def);
  if(!ultima){
    goesLimpiar();
    if(panel)panel.hidden=false;
    if(hora)hora.textContent="sin imagenes disponibles ahora mismo";
    return;
  }
  goesParar();
  const viejos=GOES_CUADROS; GOES_CUADROS=[];
  const pane=goesPanel(MAPA_L);
  const paneGal=goesPanel(MAPA_GAL);
  const nuevos=[];
  for(let k=GOES_N_CUADROS-1;k>=0;k--){
    const s=new Date(ultima.getTime()-k*10*60000);
    const url=goesUrl(def,s);
    const comun={opacity:0, maxNativeZoom:def.nivel, maxZoom:18, crossOrigin:true};
    const capa=L.tileLayer(url,Object.assign({},comun,{pane}));
    capa.addTo(MAPA_L);
    let gal=null;
    if(MAPA_GAL){
      gal=L.tileLayer(url,Object.assign({},comun,{pane:paneGal}));
      gal.addTo(MAPA_GAL);
    }
    nuevos.push({sello:s, capa, gal});
  }
  GOES_CUADROS=nuevos;
  viejos.forEach(c=>{
    try{ if(MAPA_L&&c.capa) MAPA_L.removeLayer(c.capa); }catch(_){}
    try{ if(MAPA_GAL&&c.gal) MAPA_GAL.removeLayer(c.gal); }catch(_){}
  });

  const barra=document.getElementById("goes-barra");
  if(barra){barra.max=GOES_CUADROS.length-1;barra.value=GOES_CUADROS.length-1;}
  goesMostrar(GOES_CUADROS.length-1);
  goesEscala(def);
  goesAnimar();

  if(GOES_RECARGA)clearInterval(GOES_RECARGA);
  /* Cada cinco minutos se comprueba si hay cuadro nuevo. La imagen cambia cada
     diez, asi que no se pierde ninguno y no se machaca el servicio. */
  GOES_RECARGA=setInterval(goesCargar,5*60000);
}

function goesEscala(def){
  const caja=document.getElementById("goes-escala");
  if(!caja)return;
  const e=GOES_ESCALAS[def.escala];
  if(!e){caja.innerHTML="";return;}
  caja.innerHTML = e.rampa
    ? "<div class=\"goes-esc-rampa\" style=\"background:"+e.rampa+"\"></div>"
      + "<div class=\"goes-esc-pies\"><span>"+esc(e.izq)+"</span><span>"
      + esc(e.der)+"</span></div>"
    : "<div class=\"goes-esc-claves\">"
      + (e.claves||[]).map(c=>"<span><i style=\"background:"+c[0]+"\"></i>"
        + esc(c[1])+"</span>").join("") + "</div>";
}

function goesPanelHTML(){
  const opts = Object.keys(GOES_BANDAS).map(k=>
    "<option value=\""+k+"\""+(M.mapa.satelite===k?" selected":"")+">"
    + esc(GOES_BANDAS[k].etiqueta)+"</option>").join("");
  /* Dos filas en vez de cuatro: el titulo de la escala sobraba -la banda ya
     esta escrita en el selector- y la barra comparte fila con el boton y la
     hora. El panel pasa de 300 a 236 px de ancho y de cuatro lineas a dos. */
  return "<div class=\"goes-panel\" id=\"goes-panel\" hidden>"
    + "<div class=\"goes-fila\">"
    + "<select id=\"goes-banda\" aria-label=\"Banda del satelite\">"+opts+"</select>"
    + "<button id=\"goes-play\" class=\"goes-btn\" aria-pressed=\"true\""
    + " title=\"Animar la secuencia\">&#10074;&#10074;</button>"
    + "<input type=\"range\" id=\"goes-barra\" min=\"0\" max=\"0\" value=\"0\" step=\"1\""
    + " aria-label=\"Cuadro de la secuencia\">"
    + "<span class=\"goes-hora\" id=\"goes-hora\"></span></div>"
    + "<div class=\"goes-escala\" id=\"goes-escala\"></div></div>";
}

function goesConectar(caja){
  const sel=caja.querySelector("#goes-banda");
  if(sel)sel.onchange=()=>{M.mapa.satelite=sel.value;goesCargar();};
  const play=caja.querySelector("#goes-play");
  if(play)play.onclick=()=>{
    M.goes.animar=!M.goes.animar;
    play.innerHTML=M.goes.animar?"&#10074;&#10074;":"&#9654;";
    play.setAttribute("aria-pressed",M.goes.animar);
    if(M.goes.animar)goesAnimar(); else goesParar();
  };
  const barra=caja.querySelector("#goes-barra");
  if(barra)barra.oninput=()=>{
    /* Mover la barra es pedir ver un cuadro concreto: se pausa, o la animacion
       se lo lleva por delante en menos de un segundo. */
    M.goes.animar=false; goesParar();
    const b=caja.querySelector("#goes-play");
    if(b){b.innerHTML="&#9654;";b.setAttribute("aria-pressed",false);}
    goesMostrar(parseInt(barra.value,10));
  };
}

function goesBoton(){
  const b=document.querySelector("[data-mapa-satelite]");
  if(b)b.setAttribute("aria-pressed",!!M.mapa.satelite);
}

function goesAlternar(){
  /* El boton enciende y apaga. La banda se elige en el selector, que es donde
     se espera encontrarla cuando hay seis. */
  M.mapa.satelite = M.mapa.satelite ? null : "infrarrojo";
  goesBoton();
  if(M.mapa.satelite) goesCargar(); else goesLimpiar();
}


function herramientasMapaHTML(d){return `<div class="mapa-herramientas"><div class="mapa-botones">
  <button class="mapa-boton" data-mapa-capa="complejos" aria-pressed="${M.mapa.complejos}"><span class="icono">◇</span>Complejos</button>
  <button class="mapa-boton" data-mapa-capa="centrales" aria-pressed="${M.mapa.centrales}"><span class="icono">●</span>Centrales</button>
  <button class="mapa-boton" data-mapa-capa="estaciones" aria-pressed="${M.mapa.estaciones}"><span class="icono">◉</span>Estaciones</button>
  <button class="mapa-boton" data-mapa-capa="codigos" aria-pressed="${M.mapa.codigos}"><span class="icono">Aa</span>Códigos</button>
  <button class="mapa-boton" data-mapa-leyenda aria-pressed="${M.mapa.leyenda}"><span class="icono">≡</span>Leyenda</button>
  <button class="mapa-boton" data-mapa-satelite aria-pressed="${!!M.mapa.satelite}"
    title="Nubosidad GOES-East. Pulsa para alternar GeoColor, Infrarrojo y apagado."
    ><span class="icono">☁</span><span class="texto">${
      M.mapa.satelite ? GOES_CAPAS[M.mapa.satelite].etiqueta : "Satélite"}</span></button>
  <button class="mapa-boton" data-mapa-ajustar><span class="icono">⌖</span>Ecuador</button>
  </div><div class="mapa-estado" hidden>Mapa base no disponible; cartografía local activa</div>
  </div>
  ${goesPanelHTML()}
  <div id="mapa-galapagos" aria-label="Mapa de Galápagos"></div>
  <div class="mapa-leyenda" aria-label="Leyenda del mapa">${leyendaMapaDinamica(d)}</div>`;}
function ajustarMapaEcuador(){
  if(!MAPA_L)return;
  const B=(M.carto&&M.carto.bounds)||[-81.1,-5.05,-75.15,1.5];
  const lim=[[B[1]-.18,B[0]-.18],[B[3]+.18,B[2]+.18]];
  MAPA_L.setMaxBounds(lim);
  MAPA_L.fitBounds([[B[1],B[0]],[B[3],B[2]]],{padding:[12,12],animate:false});
  MAPA_L.setMinZoom(MAPA_L.getZoom());
}
function temaOscuroMapa(){
  const t=document.documentElement.getAttribute("data-tema");
  return t==="oscuro"||(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches);
}
function actualizarBaseMapa(){
  if(!MAPA_L)return;
  const caja=$("#mapa"),mapa=$("#mapa-leaflet");
  if(mapa)mapa.classList.toggle("tema-mapa-oscuro",temaOscuroMapa());
  const gal=$("#mapa-galapagos");if(gal)gal.classList.toggle("tema-mapa-oscuro",temaOscuroMapa());
  if(MAPA_BASE)return;
  const atrib='Teselas &copy; <a href="https://www.esri.com/">Esri</a> — Esri, HERE, Garmin, &copy; OpenStreetMap contributors y la comunidad GIS';
  // SIN LA CAPA DE REFERENCIA, TAMPOCO EN EL MAPA PRINCIPAL.
  //
  // "World_Light_Gray_Reference" son rotulos Y LINEAS DE LIMITE, y esas lineas
  // rectas son las que se veian como una cuadricula cruzando el pais y las
  // islas. Fuera de los dos mapas. La geografia la dan los contornos
  // provinciales del propio catalogo, que son los buenos, y los nombres de las
  // estaciones estan en sus etiquetas.
  const base=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:18,attribution:atrib});
  const error=()=>{const a=caja&&caja.querySelector(".mapa-estado");if(a){a.textContent="Mapa base no disponible; cartografía local activa";a.hidden=false;}};
  const ok=()=>{const a=caja&&caja.querySelector(".mapa-estado");if(a)a.hidden=true;};
  base.on("tileerror",error);base.on("load",ok);
  MAPA_BASE=L.layerGroup([base]).addTo(MAPA_L);
  if(MAPA_GAL&&!MAPA_BASE_GAL){
    // SOLO EL FONDO, SIN LA CAPA DE REFERENCIA.
    //
    // "World_Light_Gray_Reference" son los rotulos y las lineas de limite. En
    // un recuadro de menos de 200 px los rotulos no se leen, y lo que si se ve
    // son sus lineas rectas: la que cruzaba Galapagos de arriba abajo salia de
    // ahi y del limite maritimo provincial. El recuadro esta para situar las
    // estaciones, no para leer toponimos.
    const gb=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:18});
    MAPA_BASE_GAL=L.layerGroup([gb]).addTo(MAPA_GAL);
  }
}
function aplicarLeyendaMapa(){
  const ley=$("#mapa .mapa-leyenda"),boton=$("#mapa [data-mapa-leyenda]");
  if(ley){ley.hidden=!M.mapa.leyenda;if(M.d)ley.innerHTML=leyendaMapaDinamica(M.d);}
  if(boton)boton.setAttribute("aria-pressed",!!M.mapa.leyenda);
}
function aplicarCapasMapa(){
  if(!MAPA_L)return;
  for(const k of ["complejos","centrales","codigos","estaciones"]){
    const capa=MAPA_CAPAS[k],visible=!!M.mapa[k];
    if(capa&&visible&&!MAPA_L.hasLayer(capa))capa.addTo(MAPA_L);
    if(capa&&!visible&&MAPA_L.hasLayer(capa))MAPA_L.removeLayer(capa);
    const b=document.querySelector(`[data-mapa-capa="${k}"]`);if(b)b.setAttribute("aria-pressed",visible);
  }
  if(MAPA_GAL&&MAPA_GAL_CAPAS.codigos){
    const visible=!!M.mapa.codigos;
    if(visible&&!MAPA_GAL.hasLayer(MAPA_GAL_CAPAS.codigos))MAPA_GAL_CAPAS.codigos.addTo(MAPA_GAL);
    if(!visible&&MAPA_GAL.hasLayer(MAPA_GAL_CAPAS.codigos))MAPA_GAL.removeLayer(MAPA_GAL_CAPAS.codigos);
  }
  // Las estaciones se apagan en los DOS mapas a la vez: apagarlas solo en el
  // continente y dejarlas en Galapagos seria una incoherencia visible.
  if(MAPA_GAL&&MAPA_GAL_CAPAS.estaciones){
    const v=!!M.mapa.estaciones;
    if(v&&!MAPA_GAL.hasLayer(MAPA_GAL_CAPAS.estaciones))MAPA_GAL_CAPAS.estaciones.addTo(MAPA_GAL);
    if(!v&&MAPA_GAL.hasLayer(MAPA_GAL_CAPAS.estaciones))MAPA_GAL.removeLayer(MAPA_GAL_CAPAS.estaciones);
  }
  const ley=$("#mapa .mapa-leyenda");if(ley&&M.d)ley.innerHTML=leyendaMapaDinamica(M.d);
  escalaMapa();
}
let MAPA_POP_TIMER=null;
function popupDinamico(layer){
  // El popup se abre únicamente por clic. Leaflet lo cierra al pulsar el mapa,
  // otra estación o capa; no hay cierre prematuro al mover el cursor.
  return layer;
}

function seleccionarEstacionMapa(x,m){
  M.sel=x.codigo;
  document.querySelectorAll("[data-cod]").forEach(n=>n.setAttribute("aria-selected",n.getAttribute("data-cod")===M.sel));
  MAPA_CAPAS.estaciones.eachLayer(z=>{
    const sel=z._codigo===M.sel;z._seleccionada=sel;
    if(z.setStyle)z.setStyle({color:sel?cssMapa("--tinta","#12181F"):cssMapa("--fondo","#fff"),weight:sel?2.2:1});
    if(sel&&z.bringToFront)z.bringToFront();
    if(z.setZIndexOffset)z.setZIndexOffset(sel?1000:0);
    const el=z.getElement&&z.getElement();if(el)el.classList.toggle("seleccionada",sel);
  });
  if(MAPA_GAL_CAPAS.estaciones)MAPA_GAL_CAPAS.estaciones.eachLayer(z=>{
    const sel=z._codigo===M.sel;z._seleccionada=sel;
    if(z.setStyle)z.setStyle({color:sel?cssMapa("--tinta","#12181F"):cssMapa("--fondo","#fff"),weight:sel?2.2:1});
    if(sel&&z.bringToFront)z.bringToFront();
    if(z.setZIndexOffset)z.setZIndexOffset(sel?1000:0);
  });
  escalaMapa();pintarSerie();
}
function prepararPanesEstaciones(mapa){
  [["estacionesSinTx",390],["estacionesNormal",430],["estacionesMedio",450],
   ["estacionesAlto",470],["estacionesMuyAlto",490]].forEach(([nombre,z])=>{
    const p=mapa.getPane(nombre)||mapa.createPane(nombre);p.style.zIndex=String(z);
  });
}
function paneEstacion(x,sinTx){
  if(sinTx)return"estacionesSinTx";
  if(x.alerta==="emergencia")return"estacionesMuyAlto";
  if(x.alerta==="alerta")return"estacionesAlto";
  if(x.alerta==="atencion")return"estacionesMedio";
  return"estacionesNormal";
}
function pintarMapa(){
  const d=M.d,caja=$("#mapa");if(!d||!caja)return;
  if(typeof L==="undefined"){caja.innerHTML='<div class="calma">No se pudo cargar el motor cartográfico Leaflet.</div>';return;}
  if(!MAPA_L){
    caja.innerHTML='<div id="mapa-leaflet" aria-label="Mapa dinámico de estaciones"></div>'+herramientasMapaHTML(d);
    MAPA_L=L.map("mapa-leaflet",{zoomControl:false,attributionControl:false,maxBoundsViscosity:1,scrollWheelZoom:true,doubleClickZoom:true,touchZoom:true,boxZoom:true,keyboard:true,minZoom:3,maxZoom:18,closePopupOnClick:true});
    MAPA_GAL=L.map("mapa-galapagos",{zoomControl:false,attributionControl:false,dragging:true,scrollWheelZoom:true,doubleClickZoom:true,touchZoom:true,boxZoom:true,keyboard:true,minZoom:3,maxZoom:18,maxBoundsViscosity:1,closePopupOnClick:true});
    prepararPanesEstaciones(MAPA_L);prepararPanesEstaciones(MAPA_GAL);
    // Sin barra de escala. Ocupaba la esquina inferior izquierda, que es donde
    // va el control del satelite, y en un mapa que siempre encuadra el mismo
    // pais la escala no cambia y no se consulta nunca.
    actualizarBaseMapa();
    MAPA_L.on("zoom zoomend",escalaMapa);
    caja.addEventListener("mouseleave",()=>MAPA_L&&MAPA_L.closePopup());
    caja.addEventListener("mouseleave",()=>MAPA_GAL&&MAPA_GAL.closePopup());
  }else{const l=caja.querySelector(".mapa-leyenda");if(l)l.innerHTML=leyendaMapaDinamica(d);}
  MAPA_L.closePopup();
  for(const k of Object.keys(MAPA_CAPAS)){
    if(MAPA_CAPAS[k]&&MAPA_L.hasLayer(MAPA_CAPAS[k]))MAPA_L.removeLayer(MAPA_CAPAS[k]);
    MAPA_CAPAS[k]=L.layerGroup();
  }
  for(const k of Object.keys(MAPA_GAL_CAPAS)){
    if(MAPA_GAL_CAPAS[k]&&MAPA_GAL.hasLayer(MAPA_GAL_CAPAS[k]))MAPA_GAL.removeLayer(MAPA_GAL_CAPAS[k]);
    MAPA_GAL_CAPAS[k]=L.layerGroup();
  }
  /* CONTORNO CON HALO, PARA QUE SE VEA SOBRE EL SATELITE.
     Un trazo fino gris se pierde igual sobre la nube blanca que sobre el suelo
     oscuro, y con la imagen de satelite encendida el pais dejaba de
     distinguirse. Se dibuja DOS VECES: primero una linea blanca mas gruesa y
     encima la negra mas fina. El resultado es un borde que contrasta contra
     cualquier fondo, claro u oscuro, porque lleva los dos colores pegados.
     Es el mismo recurso que se usa para rotular mapas sobre ortofoto. */
  const carto=M.carto||{};
  const provHalo={color:"#FFFFFF",weight:2.6,opacity:.9,fill:false};
  const provStyle={color:"#000000",weight:1.1,opacity:.85,
                   fillColor:cssMapa("--tierra","#E9ECF1"),fillOpacity:.04};
  if(carto.provincias){
    L.geoJSON(carto.provincias,{style:provHalo,interactive:false}).addTo(MAPA_CAPAS.provincias);
    L.geoJSON(carto.provincias,{style:provStyle,interactive:false}).addTo(MAPA_CAPAS.provincias);
  }
  if(carto.provincias_insular && MAPA_GAL_CAPAS.provincias){
    // En el recuadro insular tambien: con satelite, las islas se confunden con
    // la nube si no llevan borde.
    L.geoJSON(carto.provincias_insular,{style:provHalo,interactive:false}).addTo(MAPA_GAL_CAPAS.provincias);
    L.geoJSON(carto.provincias_insular,{style:{...provStyle,weight:.9},interactive:false}).addTo(MAPA_GAL_CAPAS.provincias);
  }
  // El contorno insular es el limite MARITIMO, un rectangulo de lineas rectas
  // que en el recuadro se lee como una grilla encima de las islas. Fuera.

  MAPA_CAPAS.provincias.addTo(MAPA_L);
  MAPA_GAL_CAPAS.provincias.addTo(MAPA_GAL);
  /* ENCUADRE PEGADO AL ARCHIPIELAGO.
     `bounds_insular` del catalogo cubre la provincia entera, que es mucho mar
     alrededor de muy poca isla: en un recuadro de 196 px las Galapagos salian
     diminutas y no se distinguia una isla de otra. Estos limites son los del
     archipielago propiamente dicho, con un margen minimo. El maximo sigue
     siendo generoso para poder arrastrar y mirar alrededor. */
  const BI=[-91.75,-1.45,-89.15,0.75];
  const gbounds=[[BI[1],BI[0]],[BI[3],BI[2]]];
  const BIMAX=carto.bounds_insular||[-92.1,-1.5,-89.1,1.8];
  MAPA_GAL.setMaxBounds([[BIMAX[1]-.6,BIMAX[0]-.6],[BIMAX[3]+.6,BIMAX[2]+.6]]);
  MAPA_GAL.fitBounds(gbounds,{padding:[2,2],animate:false});
  MAPA_GAL.setMinZoom(MAPA_GAL.getZoom());
  if(carto.complejos){
    const normal={color:cssMapa("--hidro","#16835F"),weight:2,opacity:.82,dashArray:"5 4",fillColor:cssMapa("--hidro-cl","#52B788"),fillOpacity:.12};
    L.geoJSON(carto.complejos,{style:normal,onEachFeature:(f,l)=>{
      const nombre=(f.properties&&f.properties.nombre)||"Complejo hidroeléctrico";
      l.bindPopup(`<b>${esc(nombre)}</b><br><span style="color:var(--tinta3);font-size:10px">Complejo hidroeléctrico</span>`,{className:"mapa-popup",closeButton:false,autoClose:true});
      popupDinamico(l);
      l.on("popupopen",()=>l.setStyle({weight:3.2,fillOpacity:.20,dashArray:null}));
      l.on("popupclose",()=>l.setStyle(normal));
    }}).addTo(MAPA_CAPAS.complejos);
  }
  if(carto.centrales)L.geoJSON(carto.centrales,{pointToLayer:(f,ll)=>{
      const m=L.circleMarker(ll,{radius:4.5,color:cssMapa("--fondo","#fff"),weight:1.3,fillColor:cssMapa("--hidro","#16835F"),fillOpacity:.95});m._radioBase=4.5;return m;},
    onEachFeature:(f,l)=>{const p=f.properties||{},nombre=p.nombre||"Central hidroeléctrica";
      l.bindPopup(`<b>${esc(nombre)}</b><br><span style="color:var(--tinta3);font-size:10px">Central hidroeléctrica${p.potencia?` · ${num(p.potencia,0)} MW`:""}</span>`,{className:"mapa-popup",closeButton:false,autoClose:true});
      popupDinamico(l);
      l.on("popupopen",()=>{l.setRadius(7);l.setStyle({fillColor:cssMapa("--hidro-cl","#52B788"),weight:2});});
      l.on("popupclose",()=>{l.setRadius(4.5);l.setStyle({fillColor:cssMapa("--hidro","#16835F"),weight:1.3});});
    }}).addTo(MAPA_CAPAS.centrales);
  const lluvia=d.variable==="precipitacion";
  for(const x of (d.estaciones||[]).filter(x=>finito(x.lat)&&finito(x.lon))){
    const sinTx=finito(x.horas_sin_dato)&&x.horas_sin_dato>=5,activa=lluvia&&x.fase_lluvia==="activa",sel=M.sel===x.codigo;
    let m,base=lluvia?(activa?5.8:3.8):radioEstacion(x);
    if(sinTx){
      const icon=L.divIcon({className:`estacion-sin-transmitir${sel?" seleccionada":""}`,html:"<span>×</span>",iconSize:[20,20],iconAnchor:[10,10]});
      m=L.marker([x.lat,x.lon],{icon,pane:paneEstacion(x,true),keyboard:true,title:`${x.codigo} · sin transmisión`,zIndexOffset:-1000});
    }else{
      const colorNivel=x.alerta==="emergencia"?cssMapa("--emergencia","#B3261E"):
        x.alerta==="alerta"?cssMapa("--alerta","#C2410C"):
        x.alerta==="atencion"?cssMapa("--atencion","#D97706"):null;
      const color=lluvia?(activa?cssMapa("--lluvia","#1D6FA8"):cssMapa("--tinta3","#8A94A6")):(colorNivel||cssMapa("--tinta3","#8A94A6"));
      const borde=sel?cssMapa("--tinta","#12181F"):(colorNivel||cssMapa("--fondo","#fff"));
      m=L.circleMarker([x.lat,x.lon],{pane:paneEstacion(x,false),radius:sel?base+2:base,color:borde,weight:sel?2.2:(colorNivel?2:1),fillColor:color,fillOpacity:activa?.98:.88});
      m._radioBase=base;
    }
    m._codigo=x.codigo;m._seleccionada=sel;
    const aviso=sinTx?`<div class="sin-transmision">× Sin transmisión durante ${num(x.horas_sin_dato,1)} h</div>`:"";
    m.bindPopup(aviso+fichaHTML(x,d),{className:"mapa-popup",closeButton:false,autoClose:true,closeOnClick:true,maxWidth:280});
    popupDinamico(m);
    m.on("click",()=>seleccionarEstacionMapa(x,m));m.addTo(x.lon < -82 ? MAPA_GAL_CAPAS.estaciones : MAPA_CAPAS.estaciones);
    const iconCod=L.divIcon({className:"codigo-estacion",html:`<span>${esc(x.codigo)}</span>`,iconSize:[1,1],iconAnchor:[-Math.round(base+3),5]});
    L.marker([x.lat,x.lon],{icon:iconCod,interactive:false,keyboard:false}).addTo(x.lon < -82 ? MAPA_GAL_CAPAS.codigos : MAPA_CAPAS.codigos);
  }
  MAPA_CAPAS.estaciones.addTo(MAPA_L);MAPA_GAL_CAPAS.estaciones.addTo(MAPA_GAL);aplicarCapasMapa();aplicarLeyendaMapa();
  caja.querySelectorAll("[data-mapa-capa]").forEach(b=>b.onclick=()=>{const k=b.dataset.mapaCapa;M.mapa[k]=!M.mapa[k];MAPA_L.closePopup();aplicarCapasMapa();});
  const leyenda=caja.querySelector("[data-mapa-leyenda]");if(leyenda)leyenda.onclick=()=>{M.mapa.leyenda=!M.mapa.leyenda;aplicarLeyendaMapa();};
  const ajustar=caja.querySelector("[data-mapa-ajustar]");if(ajustar)ajustar.onclick=ajustarMapaEcuador;
  // Satelite GOES. El mapa se redibuja entero en cada latido, asi que hay que
  // volver a pintar la capa: el nodo anterior ya no existe.
  const sat=caja.querySelector("[data-mapa-satelite]");
  if(sat){sat.onclick=goesAlternar;}
  goesConectar(caja);
  // El mapa se reconstruye en cada latido, asi que las capas anteriores ya no
  // existen: si el satelite estaba encendido hay que volver a montarlo.
  if(M.mapa.satelite){GOES_CUADROS=[];goesCargar();}
  if(!MAPA_AJUSTADO){ajustarMapaEcuador();MAPA_AJUSTADO=true;}
  setTimeout(()=>{MAPA_L.invalidateSize(false);if(MAPA_GAL)MAPA_GAL.invalidateSize(false);escalaMapa();},0);

  /* EL MAPA SE REENCUADRA CUANDO SU CAJA CAMBIA DE TAMAÑO.
     Leaflet calcula el encuadre una vez, al crearse, y no se entera de que su
     contenedor ha crecido: sigue dibujando el pais al tamaño que tenia cuando
     nacio y deja el resto de la caja en negro. Se notaba al pasar el mapa a
     media pantalla -mas espacio, mismo Ecuador diminuto en el centro- y tambien
     al plegar la barra lateral o al girar una tableta.
     invalidateSize le dice que mida de nuevo; fitBounds vuelve a ajustar el
     pais al ancho disponible. El retardo evita hacerlo en cada pixel mientras
     se arrastra el borde. */
  if(window.ResizeObserver && !MAPA_L._observador){
    let pendiente=null;
    MAPA_L._observador=new ResizeObserver(()=>{
      clearTimeout(pendiente);
      pendiente=setTimeout(()=>{
        try{
          MAPA_L.invalidateSize(false);
          const B=(M.carto&&M.carto.bounds)||[-81.2,-5.2,-74.9,1.7];
          MAPA_L.fitBounds([[B[1],B[0]],[B[3],B[2]]],{padding:[12,12],animate:false});
          if(MAPA_GAL)MAPA_GAL.invalidateSize(false);
          escalaMapa();
        }catch(e){}
      },160);
    });
    const caja=document.getElementById("mapa");
    if(caja)MAPA_L._observador.observe(caja);
  }
}

/* --------------------------------------------------------------- popup --- */
/* Ficha flotante sobre el mapa. Muestra lo mismo que haria falta preguntar en
   una sala de crisis: cuanto lleva, cuanto ha subido, en que estado esta y de
   cuando es el dato. El <title> de SVG no vale: tarda en salir y no da formato. */
function fichaHTML(x,d){
  const lluvia=d.variable==="precipitacion", ac=x.acumulados||{};
  const EST={atencion:"Medio",alerta:"Alto",emergencia:"Muy alto",normal:"Normal","sin umbral":"Sin umbral"};
  const sinTx=finito(x.horas_sin_dato)&&x.horas_sin_dato>=5;
  const estado=sinTx?"No transmite":(EST[x.alerta]||x.alerta||"Normal");
  const instante=`${num(x.ultimo,lluvia?1:2)} ${d.unidad||""}`;
  let filas="";
  if(lluvia)filas=`<div class="mp-res"><span>1 h <b>${finito(ac[1])?num(ac[1],1):"—"}</b></span><span>6 h <b>${finito(ac[6])?num(ac[6],1):"—"}</b></span><span>24 h <b>${finito(ac[24])?num(ac[24],1):"—"}</b></span></div>`;
  else if(finito(x.pendiente_h))filas=`<div class="mp-fila"><span>Cambio/h</span><b>${x.pendiente_h>0?"▲ ":x.pendiente_h<0?"▼ ":""}${num(Math.abs(x.pendiente_h),3)}</b></div>`;
  return `<div class="mp-cab"><b>${esc(x.codigo)}</b><span class="eti e-${sinTx?"mudo":String(x.alerta||"normal").replace(/\s/g,"")}">${esc(estado)}</span></div>
    <div class="mp-nom">${esc(x.nombre||"")}</div>
    <div class="mp-valor">${esc(instante)}</div>${filas}
    <div class="mp-pie">${hora(x.ultimo_t)}${x.sospecha?`<br><strong>⚠ Dato apartado por QC</strong>`:""}</div>`;
}
function moverPopup(ev){
  const caja=$("#mapa"), pop=$("#popup");
  if(!caja||!pop)return;
  const r=caja.getBoundingClientRect();
  // Se mide DESPUES de escribir el contenido y con el popup ya visible; antes
  // se usaban las medidas de la ficha anterior y en las estaciones del borde
  // se salia del panel.
  const pw=pop.offsetWidth||170, ph=pop.offsetHeight||90;
  let x=ev.clientX-r.left+14;
  let y=ev.clientY-r.top+12;
  if(x+pw>r.width-4)x=ev.clientX-r.left-pw-14;   // se pasa al otro lado
  if(x<4)x=4;
  if(y+ph>r.height-4)y=ev.clientY-r.top-ph-12;   // arriba en vez de abajo
  if(y<4)y=4;
  pop.style.left=Math.round(x)+"px";

/* Zoom y arrastre. Se exige Ctrl para la rueda a proposito: sin esa tecla la
   rueda desplaza la pagina, y un mapa que secuestra el scroll es de las cosas
   que mas molestan cuando se revisa un tablero entero. */
function engancharZoom(){
  const caja=$("#mapa"); if(!caja)return;
  const W=MAPA_W,H=MAPA_H;
  const limitar=()=>{
    const z=M.mapa;
    z.k=Math.max(1,Math.min(z.k,14));
    const w=W/z.k,h=H/z.k;
    z.x=Math.max(0,Math.min(z.x,W-w));
    z.y=Math.max(0,Math.min(z.y,H-h));
  };
  caja.onwheel=ev=>{
    if(!ev.ctrlKey)return;              // sin Ctrl, la pagina se desplaza normal
    ev.preventDefault();
    const z=M.mapa, r=caja.getBoundingClientRect();
    // el svg conserva proporcion, asi que hay bandas a los lados: se calcula
    // donde cae el cursor DENTRO del dibujo, no del contenedor
    const esc=Math.min(r.width/W, r.height/H);
    const dx=(r.width-W*esc)/2, dy=(r.height-H*esc)/2;
    const sx=z.x+((ev.clientX-r.left-dx)/esc)/z.k;
    const sy=z.y+((ev.clientY-r.top-dy)/esc)/z.k;
    if(!isFinite(sx)||!isFinite(sy))return;
    const antes=z.k;
    z.k=Math.max(1,Math.min(z.k*(ev.deltaY<0?1.22:1/1.22),14));
    if(z.k===antes)return;
    // el punto bajo el cursor no se mueve
    z.x=sx-(sx-z.x)*(antes/z.k);
    z.y=sy-(sy-z.y)*(antes/z.k);
    limitar(); pintarMapa();
  };
  let arr=null;
  caja.onmousedown=ev=>{
    if(M.mapa.k<=1.01||ev.button!==0)return;
    if(ev.target.closest("circle[data-pop]"))return;   // clic en estacion manda
    arr={x:ev.clientX,y:ev.clientY,ox:M.mapa.x,oy:M.mapa.y};
    caja.classList.add("arrastrando");
  };
  window.addEventListener("mousemove",ev=>{
    if(!arr)return;
    const r=caja.getBoundingClientRect();
    const esc=Math.min(r.width/W,r.height/H)*M.mapa.k;
    M.mapa.x=arr.ox-(ev.clientX-arr.x)/esc;
    M.mapa.y=arr.oy-(ev.clientY-arr.y)/esc;
    limitar(); pintarMapa();
  });
  window.addEventListener("mouseup",()=>{
    if(arr){arr=null;caja.classList.remove("arrastrando");}});
  caja.ondblclick=()=>{M.mapa={k:1,x:0,y:0};pintarMapa();};
  caja.classList.toggle("zoom",M.mapa.k>1.01);
}

/* Las laminas se generan aparte dos veces al dia; aqui solo se eligen. El indice
   se pide UNA vez: son imagenes en disco, no cambian entre latidos. */
const PRON = { idx:null, cargando:null };

function cargarPron(){

// el fichero usa guion bajo donde el codigo lleva espacio (Coca Codo Sinclair)
const claveLamina = cod => String(cod||"").replace(/ /g,"_");

/* Que otras variables hidrologicas mide ESTA estacion.

   La red no separa estaciones "de nivel" y "de caudal": son la misma. 287 de las
   296 con caudal miden tambien nivel, y en 18 de las 29 activas el caudal ni
   siquiera se mide -se deduce del nivel con la curva de descarga-. Las unicas
   nueve con caudal y sin nivel son las de CENACE, que calculan afluente por
   balance del embalse y no tienen limnimetro de rio.

   Separarlas en el desplegable obligaba a buscar dos veces la misma estacion.
   Aqui se consulta que mas tiene y se ofrece el salto conservando la seleccion.
   No se dibujan juntas en un eje: metros y m3/s no comparten escala, y un eje
   doble miente sobre la relacion entre las dos curvas. */
const HIDRO_HERMANAS = ["nivel", "caudal"];
const OTRAS = {};        // codigo -> [variables con dato en la ventana]

// Cache corta del censo de hermanas.
//
// Esto solo sirve para saber QUE estaciones tienen dato en la otra variable
// hidrologica, para ofrecer el salto. No es el dato que se dibuja, asi que no
// necesita estar al segundo. Y sin cache se notaba: en la publicacion estatica
// el adaptador ignora el parametro `horas` y devuelve el MISMO fichero, asi que
// nivel.json (427 kB) y caudal.json (194 kB) se descargaban dos veces en cada
// carga -620 kB de mas- y en el servidor en vivo eran dos consultas extra a la
// base para una respuesta que no habia cambiado.
const _CENSO = {};
const CENSO_TTL_MS = 120000;
async function _pulsoCensado(v, horas){
  const k = `${v}|${horas}`, ahora = Date.now();
  if(_CENSO[k] && ahora - _CENSO[k].t < CENSO_TTL_MS) return _CENSO[k].p;
  const p = fetch(`api/pulso?variable=${v}&horas=${horas}`).then(r=>r.json());
  _CENSO[k] = {t: ahora, p};
  return p;
}

async function censarHermanas(){
  const fam = M.fam, horas = document.getElementById("f-horas").value;
  await Promise.all(HIDRO_HERMANAS.map(async v=>{
    if(v === M.d.variable) return;
    try{
      const d = await _pulsoCensado(v, horas);
      (d.estaciones||[]).forEach(e=>{
        if(e.ultimo == null) return;
        (OTRAS[e.codigo] = OTRAS[e.codigo] || []);
        if(!OTRAS[e.codigo].includes(v)) OTRAS[e.codigo].push(v);
      });
    }catch(e){ /* si falla, simplemente no se ofrece el salto */ }
  }));
  if(M.fam === fam) pintarHermanas();
}

function pintarHermanas(){
  const cont = document.getElementById("serie-tit");
  if(!cont || !M.sel) return;
  cont.querySelectorAll(".hermana").forEach(x=>x.remove());
  (OTRAS[M.sel]||[]).filter(v=>v!==(M.d||{}).variable).forEach(v=>{
    const b = document.createElement("button");
    b.className = "hermana";
    // sin los parentesis, "ver "+undefined ya es una cadena verdadera y el
    // || nunca llegaba a actuar: salia literalmente "ver undefined"
    const et = ((M.vars||{})[v]||{}).etiqueta || v;
    b.textContent = "ver " + String(et).toLowerCase();
    b.title = "La misma estación mide también esta variable";
    b.onclick = () => {

    };

  });
}

async function verSerieAviso(codigo, variable){
  const caja = document.getElementById("serie-" + codigo);
