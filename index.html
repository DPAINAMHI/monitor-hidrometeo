  if(!caja.hidden){ caja.hidden = true; return; }
  caja.hidden = false;
  caja.innerHTML = `<div class="vacio">Cargando serie…</div>`;
  try{
    const r = await fetch(`api/pulso?variable=${encodeURIComponent(variable)}&horas=72`,
                          {cache:"no-store"});
    const d = await r.json();
    const s = (d.series||{})[codigo];
    const e = (d.estaciones||[]).find(z=>z.codigo===codigo);
    if(!s || !(s.v||[]).some(x=>x!=null)){
      caja.innerHTML = `<div class="vacio">Sin serie en las últimas 72 h</div>`;
      return;
    }
    const um = [];
    if(e && e.umbral){
      [["atencion","atención","var(--atencion)"],["alerta","alerta","var(--alerta)"],
       ["emergencia","emergencia","var(--emergencia)"]].forEach(([k,nm,c])=>{
        if(finito(e.umbral[k])) um.push({v:e.umbral[k], nombre:nm, color:c});});
    }
    const n = s.v.length, eti = [];
    [0, Math.floor(n/3), Math.floor(2*n/3), n-1].forEach(i=>{ if(i>=0&&i<n)
      eti.push({i, t:new Date(s.t[i]).toLocaleString("es-EC",
        {day:"2-digit",month:"short",hour:"2-digit"})}); });
    caja.innerHTML = grafico({n, w:700, h:190, umbrales:um, etiquetasX:eti,
      ejeY:`${esc(variable)} · ${esc(d.unidad||"")}`,
      series:[{v:s.v, clase:"gr-obs"}], alt:`Serie de ${codigo}`});
  }catch(err){
    caja.innerHTML = `<div class="vacio">No se pudo cargar la serie</div>`;
  }
}

/* El pronostico de corto plazo se DIBUJA, no se sirve como imagen: asi se puede
   pasar el cursor, leer un valor y compararlo con la serie observada en el mismo
   eje. Las de largo plazo y estacional siguen como lamina porque ahi lo que se
   mira es la forma general contra la climatologia, y la imagen ya la resuelve. */
/* ============================ PRONOSTICO DE LLUVIA Y TEMPERATURA =========
   Hasta ahora la pestaña meteorológica solo miraba hacia atrás: había serie
   observada y normales, pero ningún pronóstico, y el comentario de
   pintarBotonesPron() lo decía sin rodeos ("no hay pronóstico de lluvia ni de
   temperatura"). Ahora sí lo hay, del mismo sitio y con el mismo trato que el
   de caudal: multimodelo, corregido de sesgo contra la propia estación y con
   su banda p25-p75.

   La temperatura se reparte en DOS vistas —máximas y mínimas— porque son dos
   magnitudes distintas y mezclarlas en un eje no dice nada: lo que importa en
   una guardia es si la mínima baja de cierto valor o si la máxima sube, no un
   promedio que no ocurre nunca. La lluvia va en una sola, acumulada diaria,
   que es como se observa y como se pronostica.                               */
const VISTAS_METEO = {
  precipitacion: [["precipitacion_mm|suma", "Lluvia prevista", "Acumulado diario previsto, multimodelo corregido"]],
  temp_aire:     [["temp_aire_c|max", "Máximas", "Temperatura máxima diaria prevista"],
                  ["temp_aire_c|min", "Mínimas", "Temperatura mínima diaria prevista"]],
};
const PRON_METEO = { d:null, cargando:null };
function cargarPronMeteo(){
  if(PRON_METEO.d) return Promise.resolve(PRON_METEO.d);
  if(!PRON_METEO.cargando){
    PRON_METEO.cargando = fetch("api/pronostico-meteo",{cache:"no-store"})
      .then(r=>r.json()).then(d=>{PRON_METEO.d=d;return d;})
      .catch(e=>{PRON_METEO.d={puntos:{},variables:{},error:e.message};return PRON_METEO.d;});
  }
  return PRON_METEO.cargando;
}
function esVistaMeteo(v){ return typeof v==="string" && v.startsWith("meteo:"); }
function vistasMeteoDe(variable){ return VISTAS_METEO[variable] || []; }

async function dibujarPronMeteo(){
  const caja=$("#serie");
  const clave=M.vista.slice(6);
  const d=await cargarPronMeteo();
  for(let i=0;i<80&&!window.Plotly;i++)await new Promise(r=>setTimeout(r,50));
  if(!window.Plotly){caja.innerHTML='<div class="vacio">No se pudo cargar el gráfico interactivo</div>';return;}
  const pt=(d.puntos||{})[M.sel];
  const s=pt&&pt.series&&pt.series[clave];
  if(!s){
    caja.innerHTML=`<div class="vacio">Sin pronóstico meteorológico para ${esc(M.sel||"")}`
      +`<br><span style="font-size:11px">Solo lo hay en estaciones con al menos un año de serie diaria completa: es la condición para poder corregir el sesgo y verificar.</span></div>`;
    return;
  }
  caja.innerHTML='<div id="plot-meteo" class="plotly-serie" role="img"></div>';
  const lluvia=clave.startsWith("precipitacion");
  const meta=(d.variables||{})[clave.split("|")[0]]||{};
  const unidad=meta.unidad||(lluvia?"mm":"°C");
  const etiq=(vistasMeteoDe(M.fam==="meteo"?($("#f-var").value):"")
              .find(v=>v[0]===clave)||[])[1]||meta.etiqueta||clave;

  const azul=colorTema("--acento","#0B5FA5"), lluv=colorTema("--lluvia","#1D6FA8");
  const tinta3=colorTema("--tinta3","#8A94A6"), tinta2=colorTema("--tinta2","#4A5568");
  const color=lluvia?lluv:azul;
  const trazas=[];

  // banda p25-p75: la incertidumbre entre modelos, no una barra de error
  if(s.pron.p75&&s.pron.p25){
    trazas.push({type:"scatter",mode:"lines",x:s.pron.t,y:s.pron.p75,line:{width:0},
      hoverinfo:"skip",showlegend:false});
    trazas.push({type:"scatter",mode:"lines",x:s.pron.t,y:s.pron.p25,line:{width:0},
      fill:"tonexty",fillcolor:mezcla(color,colorTema("--fondo","#FFFFFF"),.20),
      hoverinfo:"skip",name:"p25–p75"});
  }
  // climatologia: la referencia contra la que se juzga si el dia es normal
  if(s.clima&&s.clima.some(z=>z!=null)){
    trazas.push({type:"scatter",mode:"lines",x:s.pron.t,y:s.clima,
      line:{color:tinta3,width:1.4,dash:"dot"},name:"Climatología",
      hovertemplate:`Climatología <b>%{y:.1f} ${unidad}</b><extra></extra>`});
  }
  // observado
  if(s.obs&&s.obs.t.length){
    trazas.push(lluvia
      ? {type:"bar",x:s.obs.t,y:s.obs.v,name:"Observado",marker:{color:tinta2,line:{width:0}},
         hovertemplate:`%{x|%d/%m/%Y}<br>Observado <b>%{y:.1f} ${unidad}</b><extra></extra>`}
      : {type:"scatter",mode:"lines+markers",x:s.obs.t,y:s.obs.v,name:"Observado",
         line:{color:tinta2,width:2},marker:{size:4},
         hovertemplate:`%{x|%d/%m/%Y}<br>Observado <b>%{y:.1f} ${unidad}</b><extra></extra>`});
  }
  // pronostico, con el valor escrito en cada punto o barra
  const textos=s.pron.v.map(z=>z==null?"":num(z,lluvia?1:1));
  trazas.push(lluvia
    ? {type:"bar",x:s.pron.t,y:s.pron.v,name:"Previsto",marker:{color:color,line:{width:0}},
       text:textos,textposition:"outside",cliponaxis:false,textfont:{size:10,color:color},
       hovertemplate:`%{x|%d/%m/%Y}<br>Previsto <b>%{y:.1f} ${unidad}</b><extra></extra>`}
    : {type:"scatter",mode:"lines+markers+text",x:s.pron.t,y:s.pron.v,name:"Previsto",
       line:{color:color,width:2.6},marker:{size:5},
       text:textos,textposition:"top center",cliponaxis:false,textfont:{size:10,color:color},
       hovertemplate:`%{x|%d/%m/%Y}<br>Previsto <b>%{y:.1f} ${unidad}</b><extra></extra>`});

  // linea de hoy: separa lo medido de lo previsto
  const hoy=new Date().toISOString().slice(0,10);
  const lay=layoutPlotlyBlanco(`${etiq} · ${unidad}`,{
    margin:{l:52,r:14,t:16,b:44},bargap:.28,showlegend:true,
    legend:{orientation:"h",y:1.12,x:0,font:{size:10,color:tinta2}},
    xaxis:{type:"date",automargin:true,tickformat:"%d/%m",
           tickfont:{color:tinta2,size:9}},
    shapes:[{type:"line",xref:"x",x0:hoy,x1:hoy,yref:"paper",y0:0,y1:1,
             line:{color:tinta3,width:1.2,dash:"dot"}}],
    annotations:[{xref:"x",x:hoy,yref:"paper",y:1.02,text:"hoy",showarrow:false,
                  xanchor:"left",font:{size:9,color:tinta3}}]});
  if(lluvia) lay.yaxis.rangemode="tozero";
  await Plotly.newPlot($("#plot-meteo"),trazas,lay,
    {responsive:true,displayModeBar:false,scrollZoom:false,doubleClick:"reset"});
}

const DATOS_PRON = { d:null, cargando:null };

function cargarDatosPron(){
  if(DATOS_PRON.d) return Promise.resolve(DATOS_PRON.d);
  if(!DATOS_PRON.cargando){
    DATOS_PRON.cargando = fetch("api/pronostico-datos",{cache:"no-store"})
      .then(r=>r.json()).then(d=>{DATOS_PRON.d=d;return d;})
      .catch(e=>{DATOS_PRON.d={puntos:{},error:e.message};return DATOS_PRON.d;});
  }
  return DATOS_PRON.cargando;
}

// Los graficos de la pestaña de PRONOSTICO pasaban por aqui, y aqui el fondo
// estaba escrito "#FFFFFF" a mano -de ahi el nombre de la funcion-. En modo
// oscuro salian laminas blancas dentro de una pagina negra. Ahora los colores
// se resuelven contra las variables del tema en cada llamada, que es lo que
// permite que al cambiar de tema el grafico cambie con la pagina. El nombre se
// mantiene para no tocar las quince llamadas que ya existen.
function layoutPlotlyBlanco(tituloY, opciones={}){
  const fondo=colorTema("--fondo","#FFFFFF");
  const superficie=colorTema("--superficie","#F7F8FA");
  const tinta=colorTema("--tinta","#12181F");
  const tinta2=colorTema("--tinta2","#4A5568");
  const tinta3=colorTema("--tinta3","#8A94A6");
  const reticula=mezcla(colorTema("--linea","#DDE1E8"),fondo,.72);
  return Object.assign({autosize:true,paper_bgcolor:fondo,plot_bgcolor:superficie,
    margin:{l:54,r:18,t:18,b:42},showlegend:false,hovermode:"x unified",
    font:{family:'"Segoe UI",sans-serif',size:10,color:tinta},
    hoverlabel:{bgcolor:fondo,bordercolor:colorTema("--linea","#DDE1E8"),font:{color:tinta,size:10}},
    xaxis:{type:"date",automargin:true,showline:true,linecolor:tinta3,linewidth:1,
      showgrid:true,gridcolor:reticula,zeroline:false,
      tickfont:{color:tinta2,size:9},tickformat:"%d/%m"},
    yaxis:{title:{text:tituloY,standoff:8,font:{size:10,color:tinta2}},automargin:true,
      showline:true,linecolor:tinta3,linewidth:1,showgrid:true,gridcolor:reticula,
      zeroline:false,tickfont:{color:tinta2,size:9}}},opciones);
}
function bandaPlotly(x,lo,hi,color,nombre){
  return [{type:"scatter",mode:"lines",x,y:hi,line:{width:0},hoverinfo:"skip",showlegend:false},
    {type:"scatter",mode:"lines",x,y:lo,line:{width:0},fill:"tonexty",fillcolor:color,
      name:nombre,hoverinfo:"skip",showlegend:false}];
}
function configPlotly(){return {responsive:true,displayModeBar:false,scrollZoom:false,doubleClick:"reset"};}
async function dibujarPron(){
  const caja = document.getElementById("serie");
  document.getElementById("serie-stats").innerHTML = "";
  const D = DATOS_PRON.d;
  const p = D && D.puntos && D.puntos[M.sel];
  caja.classList.add("pron");
  if(!p){
    caja.innerHTML = `<div class="vacio">Esta estación no tiene pronóstico anclado:`
      + ` su última observación de caudal es demasiado antigua.</div>`;
    return;
  }
  const n = p.fechas.length, u = D.unidad || "m³/s";
  const fx = i => new Date(p.fechas[i]+"T00:00:00");
  const eti = idx => idx.filter((v,i,a)=>a.indexOf(v)===i && v>=0 && v<n)
    .map(i=>({i, t:fx(i).toLocaleDateString("es-EC",{day:"2-digit",month:"short"})}));

  /* --- panel principal: observado + ensamble + banda ---------------------- */
  // La banda empieza el dia del anclaje valiendo el propio caudal observado. Sin
  // esto sus cuartiles son nulos ese dia, el area arranca desde el eje y dibuja
  // un triangulo que baja a cero: se lee como una caida del caudal que no existe.
  const b = {p25:[...p.p25], p75:[...p.p75], min:[...p.min], max:[...p.max]};
  if(p.corte!=null && p.q0!=null)
    ["p25","p75","min","max"].forEach(k=>{ b[k][p.corte]=p.q0; });

  const cPrin = { n, w:820, h:250, desdeCero:true, corte:p.corte,
    etiquetasX: eti([0, Math.floor(n/4), Math.floor(n/2), Math.floor(3*n/4), n-1]),
    ejeY:`Caudal  ·  ${u}`, alt:`Pronóstico de ${M.sel}`,
    banda:[{lo:b.min, hi:b.max}, {lo:b.p25, hi:b.p75}],
    series:[] };
  if(p.obs) cPrin.series.push({v:p.obs, clase:"gr-obs", rotulo:"observado",
    colorRot:"var(--tinta)"});
  cPrin.series.push({v:p.ens, clase:"gr-ens", rotulo:"ensamble",
    colorRot:"var(--acento)"});
  // Umbrales de alerta de la propia estacion. Sin ellos la curva no dice si el
  // caudal previsto es alto o normal PARA ESE RIO, que es lo que se decide.
  const est0 = (M.d.estaciones||[]).find(z=>z.codigo===M.sel);
  // El pronóstico SIEMPRE es caudal, en m³/s. Los umbrales de la estación son de
  // la variable que se esté viendo en el monitor, así que con "nivel" abierto se
  // colaban umbrales en METROS sobre un eje de cientos de m³/s: en H5026 los tres
  // —0,39, 0,51 y 0,89 m— caían en el mismo píxel contra el fondo del gráfico y
  // se leían como si fuesen idénticos. Se comparan las unidades, no los nombres,
  // para que esto no pueda repetirse al añadir variables.
  const um = (est0 && (M.d.unidad||"") === u) ? est0.umbral : null;
  if(um){
    cPrin.umbrales = [];
    [["atencion","atención","var(--atencion)"],
     ["alerta","alerta","var(--alerta)"],
     ["emergencia","emergencia","var(--critico)"]].forEach(([k,nm,col])=>{
      if(um[k]!=null && isFinite(um[k]))
        cPrin.umbrales.push({v:um[k], nombre:nm, color:col});
    });
  }
  // el valor escrito en los horizontes que se miran, y el punto de anclaje
  cPrin.puntos = [];
  if(p.corte!=null && p.q0!=null)
    cPrin.puntos.push({i:p.corte, v:p.q0, r:4.4, txt:num(p.q0,1)});
  [3,7].forEach(k=>{
    const i=(p.corte??0)+k;
    if(i<n && p.ens[i]!=null) cPrin.puntos.push({i, v:p.ens[i], txt:num(p.ens[i],1)});
  });

  /* --- miembros por separado --------------------------------------------- */
  const cMie = { n, w:420, h:210, desdeCero:true, corte:p.corte,
    etiquetasX: eti([0, Math.floor(n/2), n-1]), ejeY:u,
    alt:"Miembros del ensamble", series:[] };
  // Un color por modelo. Dibujarlos todos con la misma clase los hacia
  // indistinguibles: se veian como una sola curva gruesa. La paleta esta
  // comprobada contra los tres tipos de daltonismo (src/paleta.py).
  /* Once curvas no caben en seis colores seguros para daltonismo, pero tampoco
     hacen falta once colores DISTINTOS: los ocho algoritmos ML son variantes de
     un mismo metodo sobre las mismas entradas, y confundir dos de ellos entre si
     importa mucho menos que confundir GloFAS con GEOGloWS.

     Asi que los modelos estructuralmente distintos -cada global, el ensamble-
     se llevan los colores separados de la paleta comprobada (src/paleta.py), y
     los ocho ML una rampa de un solo tono. La rampa dice de por si "esto es una
     familia", que es informacion, no decoracion. Se retiro el trazo discontinuo:
     resolvia la colision pero anadia una senal que no significaba nada. */
  /* Once colores DISTINTOS, no una rampa. La version anterior daba a los ocho
     algoritmos ML tonos del mismo azul -eran una familia, y como familia se
     leian- pero en la practica no se distinguia ninguno de otro, que es peor
     que el problema que resolvia.

     Estos once salen de una busqueda que maximiza la separacion minima entre
     todos los pares en vision normal: deltaE 13,2 frente a 8,3 del conjunto
     anterior (src/paleta.py). Con once series no existe un conjunto que ademas
     pase el umbral de daltonismo -eso solo se sostiene hasta seis-, asi que la
     segunda señal no es el color: es el NOMBRE al final de cada curva, que va
     siempre y no depende de distinguir tonos. */
  const COLMOD = ["#0B5FA5","#CD5B45","#1B7837","#762A83","#FF8C00","#4D4D4D",
                  "#9932CC","#E7298A","#41AB5D","#993404","#56B4E9"];
  const mods = Object.entries(p.miembros||{});
  const estilo = k => ({col: COLMOD[k % COLMOD.length], guion: null});
  if(p.obs) cMie.series.push({v:p.obs, clase:"gr-obs"});
  mods.forEach(([nom,v],k)=>{const e=estilo(k);
    cMie.series.push({v, clase:"gr-mie", color:e.col, colorRot:e.col,
                      guion:e.guion});});
  cMie.series.push({v:p.ens, clase:"gr-ens"});
  const leyenda = `<div class="pron-ley">`
    + `<span><i style="background:var(--tinta)"></i>observado</span>`
    + mods.map(([nom],k)=>`<span><i style="background:${estilo(k).col}"></i>`
        + `${esc(nom)}</span>`).join("")
    + `<span><i style="background:var(--acento);height:3px"></i>ensamble</span>`
    + `</div>`;

  /* --- barras de cambio frente a hoy ------------------------------------- */
  // se calculan aqui y no en el servidor: es una resta y evita duplicar el dato
  // El cambio se calcula sobre la MEDIANA del ensamble, pero una barra sola no
  // dice si los modelos coinciden. Los bigotes llevan el mismo cambio calculado
  // sobre p25 y p75: cuando son cortos, los modelos están de acuerdo y la señal
  // es fuerte; cuando se abren, el pronóstico no sabe y el número de la barra no
  // debe leerse como una cifra firme.
  const dias = [], camb = [], cLo = [], cHi = [];
  if(p.corte!=null && p.q0){
    const pc = v => 100*(v/p.q0-1);
    for(let k=1;k<=10;k++){
      const i = p.corte + k;
      if(i<n && p.ens[i]!=null){
        dias.push(k); camb.push(pc(p.ens[i]));
        cLo.push(p.p25[i]!=null?pc(p.p25[i]):null);
        cHi.push(p.p75[i]!=null?pc(p.p75[i]):null);
      }
    }
  }
  // el color de cada barra sigue la señal, igual que en la lamina: sube en
  // calido, baja en frio. Asi la direccion se ve antes de leer el numero
  const colBar = camb.map(v => v>=25?"var(--critico)" : v>=10?"var(--atencion)"
    : v>-10?"var(--tinta3)" : v>-25?"var(--acento-cl)" : "var(--acento)");
  const cBar = { n:camb.length, w:430, h:200, conCero:true,
    etiquetasX: dias.map((d,i)=>({i, t:"+"+d})),
    ejeY:"cambio  ·  %", alt:"Cambio frente al caudal de hoy",
    barras:[{v:camb, colores:colBar, color:"var(--acento)", ancho:.66}],
    bigotes:[{lo:cLo, hi:cHi}],
    puntos: camb.map((v,i)=>({i, v, txt:(v>0?"+":"")+num(v,0)})) };

  const val = p.validacion;
  const cal = !val ? ["sin validar","var(--tinta3)"]
    : val.kge>=.75 ? ["muy buena","var(--ok)"]
    : val.kge>=.5  ? ["aceptable","var(--tinta2)"]
    : val.kge>=.3  ? ["limitada","var(--atencion)"]
    :                ["no fiable","var(--critico)"];

  const tarj = [
    ["caudal observado", num(p.q0,1)+" "+u],
    ["+3 días", num(p.d3,1)],
    ["+7 días", num(p.d7,1)],
    ["señal a 7 d", (p.senal||"—")],
    ["cambio 7 d", p.pct7==null?"—":(p.pct7>0?"+":"")+num(p.pct7,0)+"%"],
    ["dispersión p25–p75", num(p.dispersion,1)],
  ];

  /* AVISO DE HABILIDAD.
     Un pronostico con buena pinta y sin habilidad medida es peor que no tener
     pronostico, porque invita a decidir con el. En 19 de los 30 puntos que se
     publican el ensamble lo forman solo modelos globales, que sobre el
     reforecast -35 estaciones, ~1.380 casos por estacion y adelanto- dan KGE
     entre -0,34 y -0,45 y ganan a la persistencia en el 0-6% de las estaciones.
     Hasta ahora no se distinguian: misma linea, mismo color, misma banda que un
     punto con modelos entrenados. */
  const hab = p.habilidad || {};
  let avisoHab = "";
  if (hab.con_habilidad === false) {
    avisoHab =
      `<div class="aviso-habilidad aviso-habilidad--sin">`
    + `<b>Sin habilidad demostrada en este punto.</b> El ensamble lo forman solo `
    + `modelos globales (GEOGLOWS, GloFAS), que en la verificación sobre `
    + `reforecast no superan a la persistencia. `
    + `<b>Para decidir, use el último caudal medido (${num(p.q0,1)} ${u}).</b>`
    + `</div>`;
  } else if (hab.con_habilidad === true) {
    avisoHab =
      `<div class="aviso-habilidad aviso-habilidad--ok">`
    + `El modelo aporta sobre la persistencia <b>a partir del día `
    + `${hab.gana_persistencia_desde||2}</b>; en el día 1 el último caudal medido `
    + `es mejor referencia.`
    + `</div>`;
  }

  caja.innerHTML =
      avisoHab
    + `<div class="stat-grid">`
    + tarj.map(([k,x])=>`<div class="stat"><div class="k">${esc(k)}</div>`
        + `<div class="v">${esc(String(x))}</div></div>`).join("")
    + `</div>`
    + `<div class="pron-graf" id="pron-graf"><div class="plotly-serie"></div></div>`
    + `<div class="pron-abajo">`
    +   `<div class="pron-sub"><h3>Todos los modelos, ya anclados</h3>`
    +     `<div class="caja-g" id="pron-mie"><div class="plotly-serie"></div></div>`
    +     leyenda + `</div>`
    +   `<div class="pron-sub"><h3>Cambio frente al caudal de hoy `
    +     `<span style="font-weight:400;color:var(--tinta3)">% · barra: mediana`
    +     ` multimodelo · bigote: rango p25–p75 entre modelos</span></h3>`
    +     `<div class="caja-g" id="pron-cambio">${camb.length?'<div class="plotly-serie"></div>'
            :'<div class="vacio">sin datos</div>'}</div></div>`
    + `</div>`
    + tablaMetricas(p)
    + `<div class="pron-pie">`
    +   `Cada modelo se corrige por su sesgo histórico y se ancla al último caudal `
    +   `medido; la corrección decae con τ = ${p.tau||"—"} d. `
    +   `${p.n_miembros??"—"} miembros · anclado al ${p.fecha_ancla||"—"}`
    +   (p.dias_ancla ? ` (hace ${p.dias_ancla} d)` : "")
    +   (p.fuente_nota ? ` · <b>${esc(p.fuente_etq)}</b>: ${esc(p.fuente_nota)}` : "")
    +   ` · `
    +   (val ? `<b style="color:${cal[1]}">KGE ${num(val.kge,2)} (${cal[0]})</b>`
            + ` · NSE ${num(val.nse,2)} · sesgo ${val.sesgo>0?"+":""}${num(val.sesgo,0)}%`
          : `<span style="color:var(--tinta3)">sin validación en este punto</span>`)
    + `</div>`;

  if(!window.Plotly){
    document.querySelector("#pron-graf .plotly-serie").innerHTML='<div class="vacio">No se pudo cargar el gráfico interactivo</div>';
    return;
  }
  const xp=p.fechas.map(f=>f+"T12:00:00"),tPrin=[];
  tPrin.push(...bandaPlotly(xp,b.min,b.max,"rgba(116,132,153,.10)","mín–máx"));
  tPrin.push(...bandaPlotly(xp,b.p25,b.p75,"rgba(30,111,168,.16)","p25–p75"));
  if(p.obs)tPrin.push({type:"scatter",mode:"lines",x:xp,y:p.obs,name:"Observado",line:{color:colorTema("--tinta","#263241"),width:2},connectgaps:false});
  tPrin.push({type:"scatter",mode:"lines",x:xp,y:p.ens,name:"Ensamble",line:{color:colorTema("--acento","#0B5FA5"),width:2.8},connectgaps:false});
  const fShapes=[],fAnot=[];
  if(p.corte!=null&&xp[p.corte])fShapes.push({type:"line",xref:"x",x0:xp[p.corte],x1:xp[p.corte],yref:"paper",y0:0,y1:1,line:{color:colorTema("--tinta2","#4A5568"),width:1.2,dash:"dot"}});
  (cPrin.umbrales||[]).forEach((q,i)=>{const col=colorTema(q.color.slice(4,-1),["#D97706","#C2410C","#B3261E"][i]);
    fShapes.push({type:"line",xref:"paper",x0:0,x1:1,yref:"y",y0:q.v,y1:q.v,line:{color:col,width:1.4,dash:"dash"}});
    fAnot.push({xref:"paper",x:1,yref:"y",y:q.v,text:`${q.nombre} ${num(q.v,1)}`,showarrow:false,xanchor:"right",yanchor:"bottom",font:{size:9,color:col},bgcolor:colorTema("--fondo","#FFFFFF")});});
  const layPrin=layoutPlotlyBlanco(`Caudal · ${u}`,{showlegend:true,legend:{orientation:"h",x:0,y:1.08,font:{size:9}},margin:{l:54,r:18,t:34,b:42},shapes:fShapes,annotations:fAnot});
  const tMie=[];
  if(p.obs)tMie.push({type:"scatter",mode:"lines",x:xp,y:p.obs,name:"Observado",line:{color:colorTema("--tinta","#263241"),width:2}});
  mods.forEach(([nom,v],k)=>tMie.push({type:"scatter",mode:"lines",x:xp,y:v,name:nom,line:{color:estilo(k).col,width:1.2},connectgaps:false}));
  tMie.push({type:"scatter",mode:"lines",x:xp,y:p.ens,name:"Ensamble",line:{color:colorTema("--acento","#0B5FA5"),width:2.6},connectgaps:false});
  const trabajos=[
    Plotly.newPlot(document.querySelector("#pron-graf .plotly-serie"),tPrin,layPrin,configPlotly()),
    Plotly.newPlot(document.querySelector("#pron-mie .plotly-serie"),tMie,layoutPlotlyBlanco(u,{margin:{l:48,r:10,t:10,b:38}}),configPlotly())];
  if(camb.length){
    const errMas=camb.map((v,i)=>finito(cHi[i])?Math.max(0,cHi[i]-v):0),errMenos=camb.map((v,i)=>finito(cLo[i])?Math.max(0,v-cLo[i]):0);
    trabajos.push(Plotly.newPlot(document.querySelector("#pron-cambio .plotly-serie"),[{type:"bar",x:dias.map(d=>`+${d}`),y:camb,marker:{color:colBar.map(c=>colorTema(c.slice(4,-1),"#0B5FA5"))},
      error_y:{type:"data",symmetric:false,array:errMas,arrayminus:errMenos,color:colorTema("--tinta3","#8A94A6"),thickness:1,width:3},
      text:camb.map(v=>(v>0?"+":"")+num(v,0)),textposition:"outside",cliponaxis:false,hovertemplate:"día %{x}<br><b>%{y:.0f}%</b><extra></extra>"}],
      layoutPlotlyBlanco("Cambio · %",{margin:{l:48,r:10,t:10,b:38},xaxis:{type:"category",showline:true,linecolor:colorTema("--tinta3","#8A94A6"),showgrid:false},yaxis:{title:{text:"Cambio · %"},showline:true,linecolor:colorTema("--tinta3","#8A94A6"),showgrid:true,gridcolor:mezcla(colorTema("--linea","#DDE1E8"),colorTema("--fondo","#FFFFFF"),.72),zeroline:true,zerolinecolor:colorTema("--tinta3","#8A94A6")}}),configPlotly()));
  }
  await Promise.all(trabajos);
}


/* --------------------------------------------- largo plazo y estacional -- */
/* Misma anatomia que el corto plazo: tarjetas arriba, curva, y el pie con el
   metodo. Lo que cambia es contra que se compara. A tres meses el nivel absoluto
   de un modelo global no dice nada por si solo, asi que la referencia es la
   climatologia del propio rio: la banda gris es su rango historico p25-p75 en
   esas mismas fechas, y la linea discontinua su mediana. Sin eso, "200 m3/s en
   noviembre" no se puede juzgar. */
/* Un cambio frente a la normal deja de leerse como porcentaje en cuanto la
   referencia es pequena: en H0158 el modelo daba 11 m3/s contra una mediana
   historica de 0,1 y salia "+11.134%", que no dice nada. A partir de cinco veces
   la normal se expresa como multiplicador, que es como se lee de verdad. Y por
   debajo del 1% se dice "igual a la normal" en vez de fingir precision. */
function fmtCambio(pct){
  if(pct==null || !isFinite(pct)) return "";
  const razon = 1 + pct/100;
  if(razon >= 5)  return `  ×${num(razon, razon<10?1:0)} la normal`;
  if(razon > 0 && razon <= 0.2) return `  ×${num(razon,2)} la normal`;
  if(Math.abs(pct) < 1) return "  igual a la normal";
  return `  ${pct>0?"+":""}${num(pct,0)}%`;
}

function ejeFechas(fechas, cuantas){
  const n = fechas.length, paso = Math.max(1, Math.floor(n/(cuantas-1)));
  const idx = [];
  for(let i=0;i<n;i+=paso) idx.push(i);
  // El ultimo dia siempre interesa, pero si cae pegado al tick anterior los dos
  // textos se pisan ("26-nov" sobre "29-nov"). En ese caso lo SUSTITUYE en vez
  // de anadirse.
  if(idx[idx.length-1]!==n-1){
    if(n-1 - idx[idx.length-1] < paso*0.55) idx[idx.length-1] = n-1;
    else idx.push(n-1);
  }
  return idx.map(i=>({i, t:new Date(fechas[i]+"T00:00:00")
    .toLocaleDateString("es-EC",{day:"2-digit",month:"short"})}));
}


/* Tabla de desempeno validado. Va en la vista porque un pronostico sin su
   habilidad no se puede usar para decidir: el mismo dibujo convincente sale de
   un modelo con KGE 0,94 y de otro con 0,13. Se muestra el desempeno POR
   REGIMEN ademas del global, porque un NSE alto puede esconder que el modelo
   falla justo en las crecidas, que es cuando importa. */
function calKGE(k){
  return k>=.75?["muy buena","var(--ok)"] : k>=.5?["aceptable","var(--tinta2)"]
       : k>=.3?["limitada","var(--atencion)"] : ["no fiable","var(--critico)"];
}

/* Desempeno UNO POR UNO de los modelos dibujados, no un resumen del conjunto.
   El grafico traza once curvas: sin saber cual de ellas acierta, la tabla no
   ayuda a decidir. Se incluyen las dos referencias gratuitas -persistencia y
   climatologia- porque son la vara de medir: a UN dia la persistencia gana a
   todos los ML, y un KGE de 0,52 al decimo dia parece mediocre hasta que se ve
   que la persistencia da 0,34 ahi. */
function tablaMetricas(p){
  const MM = p.metricas_modelo;
  if(!MM || !(MM.filas||[]).length)
    return `<div class="pron-pie">Sin validación en este punto: no hay caudal`
      + ` observado suficiente para medir la habilidad de ningún modelo.</div>`;

  /* UNA sola tabla. Antes habia dos -una por metrica con los horizontes en
     columnas, y otra aparte por regimen- y para comparar dos modelos habia que
     ir y volver entre pestanas. Aqui las pestanas son el HORIZONTE y todas las
     metricas caben a la vez, que es como se compara de verdad: fijas el plazo y
     lees la fila entera. El desglose por regimen del ensamble entra como filas
     al final, no como tabla aparte. */
  const D = ["1","3","7","10"];
  const COLS = [
    {k:"kge",   et:"KGE",        d:2, suf:"",      mejor:"alto"},
    {k:"nse",   et:"NSE",        d:2, suf:"",      mejor:"alto"},
    {k:"r",     et:"r",          d:2, suf:"",      mejor:"alto"},
    {k:"sesgo", et:"sesgo",      d:1, suf:"%",     mejor:"cero"},
    {k:"mae",   et:"MAE",        d:1, suf:"",      mejor:"cero", crudo:true,
     unidad:"m³/s"},
    {k:"err",   et:"error rel.", d:0, suf:"%",     mejor:"cero"},
  ];
  const cal = (c,v) => {
    if(v==null) return ["","var(--tinta3)"];
    if(c.crudo) return ["","var(--tinta)"];
    if(c.mejor==="cero"){ const a=Math.abs(v);
      return a<=10?["muy bueno","var(--ok)"] : a<=25?["aceptable","var(--tinta2)"]
           : a<=50?["alto","var(--atencion)"] : ["inservible","var(--critico)"]; }
    return v>=.75?["muy buena","var(--ok)"] : v>=.5?["aceptable","var(--tinta2)"]
         : v>=.3?["limitada","var(--atencion)"] : ["no fiable","var(--critico)"];
  };
  const celda = (c,v) => v==null
    ? `<td style="color:var(--tinta3)">–</td>`
    : `<td style="color:${cal(c,v)[1]};font-weight:${c.k==="kge"?600:500}">`
      + `${v>0&&c.mejor==="cero"&&!c.crudo?"+":""}${num(v,c.d)}${c.suf}</td>`;

  const cuerpo = dia => {
    let h = MM.filas.map(f=>{
      const ref = f.tipo!=="aprendizaje";
      const marca = f.tipo==="referencia" ? ` <span class="pron-marca">referencia gratuita</span>`
        : f.tipo==="global" ? ` <span class="pron-marca">sin corregir</span>` : "";
      const cs = COLS.map(c=>{
        const v = f.tipo==="global" ? (f[c.k+"_global"] ?? null) : (f[c.k]||{})[dia];
        return celda(c, v);
      }).join("");
      const kge = f.tipo==="global" ? f.kge_global : (f.kge||{})[dia];
      return `<tr${ref?` style="background:var(--superficie)"`:""}>`
        + `<td>${esc(f.modelo)}${marca}</td>${cs}`
        + `<td style="color:${cal(COLS[0],kge)[1]}">${cal(COLS[0],kge)[0]}</td></tr>`;
    }).join("");
    // el ensamble por regimen, como filas del mismo cuadro
    const m2 = p.metricas;
    if(m2 && m2.length){
      const v = m2.find(x=>x.variante===(dia==="1"||dia==="3"?"corto_plazo":"medio_plazo")) || m2[0];
      if(v){
        h += `<tr><td colspan="${COLS.length+2}" class="pron-sep">`
          + `el ensamble, separado por régimen del río `
          + `<span class="pron-marca">${v.n} días de prueba · un NSE global alto`
          + ` puede esconder que falla justo en las crecidas</span></td></tr>`;
        [["estiaje","estiaje"],["normal","caudal normal"],["crecida","crecida"]]
          .forEach(([k,et])=>{
            const nse = v[k];
            h += `<tr><td style="padding-left:14px">ensamble · ${et}</td>`
              + `<td style="color:var(--tinta3)">–</td>`
              + celda(COLS[1], nse)
              + `<td style="color:var(--tinta3)">–</td>`
              + `<td style="color:var(--tinta3)">–</td>`
              + `<td style="color:var(--tinta3)">–</td>`
              + `<td style="color:var(--tinta3)">–</td>`
              + `<td style="color:${cal(COLS[1],nse)[1]}">${cal(COLS[1],nse)[0]}</td></tr>`;
          });
      }
    }
    return h;
  };

  const amb = MM.ambito==="estacion" ? `medido en esta estación`
    : `<span style="color:var(--atencion)">habilidad: mediana de la red (esta`
      + ` estación no tiene caudal observado propio) · MAE en sus unidades,`
      + ` sobre su caudal medio de ${num(MM.q_medio,1)} m³/s</span>`;
  const cab = `<tr><th>modelo</th>`
    + COLS.map(c=>`<th>${esc(c.et)}${c.unidad
        ? ` <span class="pron-marca">${c.unidad}</span>`:""}</th>`).join("")
    + `<th>veredicto</th></tr>`;
  const cuerpos = D.map((d,k)=>
    `<div class="pron-tabla met-cuerpo" data-met="${d}"${k===2?"":" hidden"}>`
    + `<table><thead>${cab}</thead><tbody>${cuerpo(d)}</tbody></table></div>`).join("");

  return `<div class="pron-sub"><h3>Desempeño validado por modelo`
    + ` <span style="font-weight:400;color:var(--tinta3)">separación temporal:`
    + ` entrena en el pasado, valida en el futuro · ${amb}</span></h3>`
    + `<div class="met-tabs">`
    + D.map((d,k)=>`<button type="button" data-met="${d}"`
        + ` aria-pressed="${k===2}">+${d} día${d==="1"?"":"s"}</button>`).join("")
    + `</div>${cuerpos}`
    + `<div class="pron-pie">KGE y NSE: 1 es perfecto, bajo 0 el modelo pierde`
    + ` contra la media histórica. r mide si acierta la FORMA de la crecida`
    + ` aunque falle la magnitud. El sesgo es el error sistemático; el MAE, los`
    + ` m³/s que se equivoca de media cada pronóstico; el error relativo, ese`
    + ` mismo MAE en % del caudal medio, para comparar entre ríos distintos.`
    + `</div></div>`;
}

/* Las pestañas de métrica se enganchan por delegación: la tabla se rehace en
   cada cambio de estación y un onclick directo se perdería en cada redibujo. */
document.addEventListener("click", ev=>{
  const b = ev.target.closest(".met-tabs button");
  if(!b) return;
  const caja = b.closest(".pron-sub");
  caja.querySelectorAll(".met-tabs button").forEach(x=>
    x.setAttribute("aria-pressed", x===b));
  caja.querySelectorAll(".met-cuerpo").forEach(x=>
    x.hidden = x.dataset.met !== b.dataset.met);
});

/* Largo plazo: lo unico medido de verdad a ese plazo es el sesgo del modelo en
   crudo. La habilidad mas alla de dos semanas NO esta validada -el reforecast
   diario solo esta descargado para 2 de 30 puntos, y el estacional cubre
   1993-2005 sin evaluar todavia- y decirlo es parte de la tabla. */
function tablaLargo(P){
  const E = P && P.estacional, V = E && E.validacion;
  const L = (DATOS_PRON.d||{}).metricas_largo;
  let h = "";

  /* Desempeno del ESTACIONAL en esta estacion, medido contra la climatologia
     mensual del propio rio. Corregir el sesgo mejora muchisimo el KGE -en H0148
     va de -6,5 a +0,06- pero eso no significa que el pronostico sirva: lo que
     decide es si gana a la media historica de ese mes, que no cuesta nada. En
     esta red gana en 2 de 18 estaciones, y decirlo forma parte del producto. */
  /* Largo plazo diario: lo primero, porque es el horizonte que mas se consulta. */
  const LM = P && P.largo && P.largo.ml, VL = LM && LM.validacion;
  if(VL && VL.length){
    const cl = k => k>=.5?"var(--ok)" : k>=.2?"var(--tinta2)"
             : k>=-.2?"var(--atencion)" : "var(--critico)";
    const fl = VL.map(x=>`<tr><td>${esc(x.banda)}</td>`
      + `<td style="color:var(--tinta3)">${num(x.kge_crudo,2)}</td>`
      + `<td>${x.kge_corregido==null?"–":num(x.kge_corregido,2)}</td>`
      + `<td style="color:${cl(x.kge_ml)};font-weight:600">${num(x.kge_ml,2)}</td>`
      + `<td style="color:${cl(x.kge_persistencia)}">${num(x.kge_persistencia,2)}</td>`
      + `<td style="color:${cl(x.kge_climatologia)}">${num(x.kge_climatologia,2)}</td>`
      + `<td>${x.n}</td>`
      + `<td style="color:${x.gana?"var(--ok)":"var(--critico)"};font-weight:600">`
      +   `${x.gana?"aporta":"no aporta"}</td></tr>`).join("");
    h += `<div class="pron-sub"><h3>Largo plazo diario, por tramo`
      + ` <span style="font-weight:400;color:var(--tinta3)">reforecast 2003–2023,`
      + ` separación temporal · estado de la cuenca:`
      + ` ${num(LM.estado_inicial.q30,1)} m³/s los últimos 30 días</span></h3>`
      + `<div class="pron-tabla"><table><thead><tr><th>tramo</th>`
      + `<th>GloFAS crudo</th><th>GloFAS corregido</th><th>ML</th>`
      + `<th>persistencia</th><th>climatología</th><th>n</th><th></th>`
      + `</tr></thead><tbody>${fl}</tbody></table></div>`
      + `<div class="pron-pie">`
      + (LM.dibujar
          ? `<b style="color:var(--ok)">La curva ML se dibuja</b>: gana a la`
            + ` persistencia y a la climatología en ${LM.gana} de 4 tramos.`
          : `<b style="color:var(--atencion)">La curva ML no se dibuja aquí</b>:`
            + ` solo gana en ${LM.gana} de 4 tramos, así que no aporta nada que no`
            + ` dé ya mantener el caudal de hoy o mirar la media histórica.`)
      + ` <b>Del día 31 en adelante no hay validación posible</b>: el reforecast`
      + ` de GloFAS llega a 30 días, así que ese tramo de la curva azul se lee`
      + ` como tendencia, no como caudal previsto.</div></div>`;
  }
  /* El ML primero: a estos plazos es el que mas habilidad tiene. */
  const ML = E && E.ml, VM = ML && ML.validacion;
  if(VM && VM.length){
    const calm = k => k>=.5?"var(--ok)" : k>=.2?"var(--tinta2)"
              : k>=-.2?"var(--atencion)" : "var(--critico)";
    const fml = VM.map(x=>`<tr><td>mes ${x.mes}</td>`
      + `<td style="color:${calm(x.kge_ml)};font-weight:600">${num(x.kge_ml,2)}</td>`
      + `<td style="color:${calm(x.kge_climatologia)}">${num(x.kge_climatologia,2)}</td>`
      + `<td style="color:${calm(x.kge_estado_inicial)}">${num(x.kge_estado_inicial,2)}</td>`
      + `<td>${x.r==null?"–":num(x.r,2)}</td><td>${x.n}</td>`
      + `<td style="color:${x.gana?"var(--ok)":"var(--critico)"};font-weight:600">`
      +   `${x.gana?"aporta":"no aporta"}</td></tr>`).join("");
    const g2 = ML.gana_climatologia||0;
    h += `<div class="pron-sub"><h3>Estacional por aprendizaje`
      + ` <span style="font-weight:400;color:var(--tinta3)">estado de la cuenca al`
      + ` emitir: ${num(ML.estado_inicial.q30,1)} m³/s los últimos 30 días,`
      + ` ${num(ML.estado_inicial.q90,1)} los últimos 90</span></h3>`
      + `<div class="pron-tabla"><table><thead><tr><th>anticipación</th>`
      + `<th>KGE del ML</th><th>KGE climatología</th><th>KGE solo estado inicial</th>`
      + `<th>r</th><th>n</th><th></th></tr></thead><tbody>${fml}</tbody></table></div>`
      + `<div class="pron-pie">${g2>=3
          ? `<b style="color:var(--ok)">Aquí el ML sí aporta</b>: gana a la`
            + ` climatología en ${g2} de ${VM.length} horizontes.`
          : `<b style="color:var(--atencion)">Aquí el ML gana solo en ${g2} de`
            + ` ${VM.length} horizontes</b>.`}`
      + ` La habilidad a estos plazos no viene del modelo global sino del estado`
      + ` de la cuenca: el caudal del mes anterior correlaciona 0,58 con el mes`
      + ` siguiente, y esa memoria se agota hacia el tercer mes, donde toma el`
      + ` relevo la climatología. Eso es lo que el modelo aprende a pesar.`
      + `</div></div>`;
  }
  if(V && V.length){
    const cal = k => k>=.5?"var(--ok)" : k>=.2?"var(--tinta2)"
              : k>=-.2?"var(--atencion)" : "var(--critico)";
    const filas = V.map(x=>`<tr>`
      + `<td>mes ${x.mes}</td>`
      + `<td style="color:var(--tinta3)">${num(x.kge_crudo,2)}</td>`
      + `<td style="color:${cal(x.kge_corregido)};font-weight:600">${num(x.kge_corregido,2)}</td>`
      + `<td style="color:${cal(x.kge_climatologia)}">${num(x.kge_climatologia,2)}</td>`
      + `<td>${x.r==null?"–":num(x.r,2)}</td><td>${x.n}</td>`
      + `<td style="color:${x.gana?"var(--ok)":"var(--critico)"};font-weight:600">`
      +   `${x.gana?"aporta":"no aporta"}</td></tr>`).join("");
    const g = E.gana_climatologia||0;
    const veredicto = g>=3
      ? `<b style="color:var(--ok)">En esta estación el estacional sí aporta</b>:`
        + ` gana a la climatología en ${g} de ${V.length} horizontes.`
      : `<b style="color:var(--atencion)">En esta estación el estacional no supera`
        + ` a la climatología</b> (gana en ${g} de ${V.length} horizontes): para`
        + ` decidir a estos plazos, la media histórica del mes es mejor guía.`;
    h += `<div class="pron-sub"><h3>El estacional en esta estación`
      + ` <span style="font-weight:400;color:var(--tinta3)">reforecast 1993–2005,`
      + ` factor ajustado solo con el pasado y validado con el futuro`
      + ` · factor ${num(E.factor,2)}×</span></h3>`
      + `<div class="pron-tabla"><table><thead><tr><th>anticipación</th>`
      + `<th>KGE crudo</th><th>KGE corregido</th><th>KGE climatología</th>`
      + `<th>r</th><th>n</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>`
      + `<div class="pron-pie">${veredicto} Corregir el sesgo arregla el nivel`
      + ` medio, no la capacidad de distinguir un año húmedo de uno seco: eso lo`
      + ` mide la columna r, y a estos plazos está entre 0,2 y 0,4.</div></div>`;
  } else if(E){
    h += `<div class="pron-pie"><b>El estacional de esta estación no está`
      + ` validado</b>: hace falta caudal observado que solape con el reforecast`
      + ` de 1993–2005. La curva va ${E.corregido?"corregida con el factor"
      + " disponible":"SIN corregir"}, y debe leerse como tendencia frente a la`
      + ` banda histórica, nunca como un caudal previsto.</div>`;
  }

  if(L && L.length){
    const fila = f => `<tr><td>${esc(f.modelo)}</td>`
      + `<td style="font-weight:600">${num(f.kge_corto,2)}</td>`
      + `<td>${f.sesgo==null?"–":(f.sesgo>0?"+":"")+num(f.sesgo,0)+"%"}</td>`
      + `<td>${f.vs_persistencia>0?"+":""}${num(f.vs_persistencia,2)}</td>`
      + `<td>${f.puntos}</td></tr>`;
    h += `<div class="pron-sub"><h3>Los modelos base, medidos a corto plazo`
      + ` <span style="font-weight:400;color:var(--tinta3)">es donde hay`
      + ` observación con la que comparar</span></h3>`
      + `<div class="pron-tabla"><table><thead><tr><th>modelo</th><th>KGE</th>`
      + `<th>sesgo</th><th>vs persistencia</th><th>puntos</th>`
      + `</tr></thead><tbody>${L.map(fila).join("")}</tbody></table></div>`
      + `<div class="pron-pie"><b>La habilidad del GloFAS DIARIO más allá de dos`
      + ` semanas sigue sin validar</b>: su reforecast solo está descargado para`
      + ` 2 de los 30 puntos. Con un sesgo en crudo del +95%, esa curva se lee`
      + ` como tendencia frente a la banda histórica.</div></div>`;
  }
  return h;
}

async function dibujarLargo(){
  const caja = document.getElementById("serie");
  document.getElementById("serie-stats").innerHTML = "";
  caja.classList.add("pron");
  const P = ((DATOS_PRON.d||{}).puntos||{})[M.sel];
  const L = P && P.largo, E = P && P.estacional;
  if(!L && !E){
    caja.innerHTML = `<div class="vacio">Esta estación no tiene pronóstico de`
      + ` largo plazo.</div>`;
    return;
  }
  const u = (DATOS_PRON.d||{}).unidad || "m³/s";

  /* Eje común. Los dos productos traen rejillas distintas —el diario llega a 90
     días, el estacional a cuatro meses con un punto cada semana— así que se
     dibujan sobre la unión de sus fechas. Antes eran dos vistas separadas que
     terminaban con un día de diferencia y parecían la misma cosa. */
  const fechas = [...new Set([...(L?L.fechas:[]), ...(E?E.fechas:[])])].sort();
  const idx = {}; fechas.forEach((f,i)=>idx[f]=i);
  const sobreEje = (fs, vs) => {
    const v = new Array(fechas.length).fill(null);
    fs.forEach((f,i)=>{ if(idx[f]!=null) v[idx[f]] = vs[i]; });
    return v;
  };
  /* El estacional es de paso semanal. Sobre un eje diario quedan huecos, y el
     motor parte la curva en cada hueco: saldrían diecisiete trocitos sueltos.
     Se interpola en línea recta entre sus puntos, que es honesto para un
     producto de resolución mensual mientras se diga en la leyenda. */
  const rellenar = v => {
    const w = v.slice();
    let a = null;
    for(let i=0;i<w.length;i++){
      if(w[i]!=null){
        if(a!=null && i-a>1)
          for(let k=a+1;k<i;k++) w[k] = w[a] + (w[i]-w[a])*(k-a)/(i-a);
        a = i;
      }
    }
    return w;
  };

  const n = fechas.length;
  const cfg = { n, w:820, h:250, desdeCero:true, ejeY:`Caudal  ·  ${u}`,

function seriePorEscala(s,variable){
  if(!s||M.escala!=="diaria")return s;
  const lluvia=variable==="precipitacion", CORTE=lluvia?7:0, dias=new Map();
  s.t.forEach((t,i)=>{
    const f=new Date(t),g=new Date(f.getTime()-CORTE*3600000);
    const k=[g.getFullYear(),String(g.getMonth()+1).padStart(2,"0"),String(g.getDate()).padStart(2,"0")].join("-");
    const z=dias.get(k)||{v:[],vmin:[],horas:new Set(),horasMin:new Set()};
    const paso=Math.floor(f.getTime()/3600000);z.horas.add(paso);
    if(finito(s.v[i]))z.v.push(s.v[i]);
    if(s.v_min&&finito(s.v_min[i])){z.vmin.push(s.v_min[i]);z.horasMin.add(paso);}
    dias.set(k,z);
  });
  const r={t:[],v:[],pasos:[],pasos_min:[]};if(s.v_min)r.v_min=[];
  const hoy=new Date(Date.now()-CORTE*3600000),claveAbierta=[hoy.getFullYear(),String(hoy.getMonth()+1).padStart(2,"0"),String(hoy.getDate()).padStart(2,"0")].join("-");
  [...dias.entries()].filter(([k])=>k!==claveAbierta).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([k,g])=>{
    const nv=g.v.length,nm=g.vmin.length;
    let v=null,vmin=null;
    // El agregado se conserva aun cuando falten pasos; el propio punto lleva
    // (N/24) para impedir que un valor parcial se lea como jornada completa.
    // Precipitación usa el día hidrológico 07–07; las demás variables 00–24.
    if(nv){
      if(lluvia)v=g.v.reduce((a,b)=>a+b,0);
      else if(s.v_min)v=Math.max(...g.v);
      else v=g.v.reduce((a,b)=>a+b,0)/nv;
    }
    if(s.v_min&&nm)vmin=Math.min(...g.vmin);
    r.t.push(k+"T12:00:00");r.v.push(v);if(r.v_min)r.v_min.push(vmin);
    r.pasos.push(nv);r.pasos_min.push(s.v_min?nm:nv);
  });
  const nd=Math.max(1,Math.round((+($("#f-horas")||{}).value||168)/24)),ini=Math.max(0,r.t.length-nd);
  for(const k of ['t','v','pasos','pasos_min','v_min'])if(r[k])r[k]=r[k].slice(ini);
  return r;
}

function colorTema(nombre,respaldo){
  const v=getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
  return v||respaldo;
}
// Plotly no entiende var(--x) ni color-mix(): hay que darle un color resuelto.
// Estas dos funciones son el puente entre el tema de la pagina y el grafico.
function esTemaOscuro(){
  const t=document.documentElement.getAttribute("data-tema");
  if(t==="oscuro")return true;
  if(t==="claro")return false;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function aRGB(c){
  c=(c||"").trim();
  if(c.startsWith("#")){
    let h=c.slice(1);
    if(h.length===3)h=h.split("").map(x=>x+x).join("");
    if(h.length>=6)return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  }
  const m=c.match(/-?\d+(\.\d+)?/g);
  return m&&m.length>=3?[+m[0],+m[1],+m[2]]:[128,128,128];
}
// mezcla(a,b,t) = a con peso t sobre b. Devuelve #rrggbb.
function mezcla(a,b,t){
  const A=aRGB(a),B=aRGB(b);
  const v=A.map((x,i)=>Math.round(x*t+B[i]*(1-t)));
  return "#"+v.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("");
}
function serieConHuecos(t,v,diaria){
  const x=[],y=[],puentes=[],paso=(diaria?24:1)*3600000;
  let previo=-1;
  for(let i=0;i<t.length;i++){
    const ok=finito(v[i]);
    if(ok&&previo>=0){
      let hayNulo=false;for(let j=previo+1;j<i;j++)if(!finito(v[j])){hayNulo=true;break;}
      const salto=new Date(t[i])-new Date(t[previo]);
      if(hayNulo||salto>paso*1.5){
        x.push(new Date((+new Date(t[previo]) + +new Date(t[i]))/2));y.push(null);
        puentes.push({x:[t[previo],t[i]],y:[v[previo],v[i]]});
      }
    }
    x.push(t[i]);y.push(ok?v[i]:null);if(ok)previo=i;
  }
  return {x,y,puentes};
}
// EL VALOR, EN CADA PUNTO.
//
// Antes esto etiquetaba como mucho `ancho/90` puntos -siete en un grafico de
// 700 px- y ademas, con `soloExtremos`, se quedaba en TRES: el ultimo, el
// maximo y el minimo. Que es lo que pasaba en todas las series que no son
// lluvia. El resultado es que segun la variable y la escala aparecian o no
// aparecian numeros, sin logica visible desde fuera.
//
// Ahora se etiqueta TODO lo que quepa: el limite lo pone el ancho real de la
// etiqueta (unos 8 px por caracter mas aire), no una constante. Con pocos
// puntos salen todos; con 700 puntos horarios se reparten los que caben, que
// es lo unico que se puede hacer sin convertir el grafico en una mancha. El
// ultimo valor, el maximo y el minimo entran siempre, se pongan como se pongan.
function etiquetasSinSolape(v,pasos,diaria,decimales,ancho,soloExtremos=false){
  const validos=v.map((z,i)=>finito(z)?i:null).filter(i=>i!=null);
  if(!validos.length)return v.map(()=>"");
  const may=Math.max(...validos.map(i=>Math.abs(v[i])).filter(Number.isFinite),1);
  const digitos=Math.floor(Math.log10(may))+1+(decimales?decimales+1:0);
  const anchoEtiq=Math.max(24,digitos*7.5+8);
  const limite=Math.max(3,Math.floor((ancho||700)/anchoEtiq));
  const salto=Math.max(1,Math.ceil(validos.length/limite)),mostrar=new Set();
  validos.forEach((i,k)=>{if(k%salto===0)mostrar.add(i)});
  {
    mostrar.add(validos.at(-1));
    mostrar.add(validos.reduce((a,b)=>v[b]>v[a]?b:a));
    mostrar.add(validos.reduce((a,b)=>v[b]<v[a]?b:a));
  }
  return v.map((z,i)=>{
    if(!mostrar.has(i)||!finito(z))return"";
    return num(z,decimales);
  });
}

      connectgaps:false,text:txtMin,textposition:"bottom center",cliponaxis:false,
      textfont:{size:10,color:frio},customdata:datosCustom(),

    agregarPuentes(minimo.puentes,frio);
  }
  const shapes=[],anot=[],leyendaSerie=[];
  leyendaSerie.push({nombre:etiqVar, color:lluvia?colorTema("--lluvia","#1D6FA8")
                                                :colorTema("--acento","#0B5FA5")});
  umbrales.forEach((u,idx)=>{
    const vals=u.valores||s.t.map(()=>u.v),c=u.color.startsWith("var(")
      ? colorTema(u.color.slice(4,-1),idx===0?"#D97706":idx===1?"#C2410C":"#B3261E") : u.color;
    vals.filter(finito).forEach(v=>todos.push(v));
    // EL NOMBRE A LA LEYENDA, EL NUMERO A LA LINEA.
    //
    // La anotacion decia "Calor Muy Alto  28,40" pegada al borde derecho, y por
    // ese texto el margen se reservaba a 104 px. El nombre del umbral es el
    // mismo los 365 dias del año -no cambia, no hay que volver a leerlo- y el
    // valor si. Asi que el nombre va una vez a la leyenda y en la linea queda
    // solo la cifra, que es lo que se compara de un vistazo con la serie.
    trazas.push({type:"scatter",mode:"lines",x:s.t,y:vals,line:{color:c,width:1.5,dash:"dash",shape:"hv"},
      hoverinfo:"skip",showlegend:false,name:u.nombre||u.corto,connectgaps:false});
    // Se anota para la leyenda HTML: el color resuelto, no la variable CSS.
    leyendaSerie.push({nombre:u.nombre||u.corto, color:c});
    if(u.leyenda)return;          // la mediana no lleva ni cifra al margen
    const ultimo=[...vals].reverse().find(finito);
    if(finito(ultimo))anot.push({xref:"paper",x:1.004,yref:"y",y:ultimo,text:num(ultimo,2),
      showarrow:false,xanchor:"left",font:{size:9,color:c},bgcolor:fondo,borderpad:1});
  });
  // El margen derecho solo se reserva si queda alguna etiqueta que colocar ahi.
  // Con la mediana en la leyenda, lo normal es que no quede ninguna.
  const hayRotuloDerecha = anot.length > 0;
  let lo=Math.min(...todos),hi=Math.max(...todos);if(!finito(lo)||!finito(hi)){lo=0;hi=1}
  if(lluvia)lo=0;const rango=Math.max(hi-lo,Math.abs(hi)*.08,1);
  // HUECO PARA LAS ETIQUETAS.

  // Si el eje acaba justo en el maximo, ese numero cae fuera del area de
  // dibujo y Plotly lo recorta: los textos existen en el SVG -se pueden contar-
  // pero no se ven. Y aqui el area util es minuscula: el panel mide 150 px y
  // los margenes se comen 86, asi que quedan 64 px para dibujar.
  //
  // Un 10% de margen no basta para una etiqueta de 10 px sobre una barra que
  // ocupa casi todo el alto. Pero el 26% fijo que habia aqui era el numero
  // calculado para un panel de 150 px, y AHORA el area de dibujo pasa de 340.
  //
  // La etiqueta mide lo mismo en pixeles pase lo que pase -unos 18 px con su
  // aire-, asi que como FRACCION del eje tiene que encoger cuando el grafico
  // crece. Dejarlo en 26% regalaba casi un tercio del alto a un hueco vacio y
  // aplastaba la serie contra el suelo.
  const altoUtil = Math.max(altoNodo - 100, 60);

    ? Math.min(.26, Math.max(.07, 22/altoUtil))
    : Math.min(.10, Math.max(.03, 10/altoUtil)));

     Se construye a mano en vez de con `tickformat` porque un formato unico no

     pondria con el mismo paso y se rotula cada una segun caiga o no en 00:00. */
  const ejeHorario = () => {

    const medianoche=new Date(t0); medianoche.setHours(0,0,0,0);
    let ini=medianoche.getTime();
    while(ini<t0.getTime()) ini+=paso;
    for(let x=ini; x<=tf.getTime(); x+=paso){
      const f=new Date(x);
      vals.push(f.toISOString());
      txts.push(f.getHours()===0
        ? String(f.getDate()).padStart(2,"0")+"/"+String(f.getMonth()+1).padStart(2,"0")
        : String(f.getHours()).padStart(2,"0")+":00");
    }
    return vals.length ? {tickmode:"array", tickvals:vals, ticktext:txts} : {};
  };

  const dias=[],formasDia=[],pasosAnot=[];
  if(!diaria){
    let clave="",alterno=false,desde=null;
    s.t.forEach((t,i)=>{const f=new Date(t),k=f.toDateString();if(k!==clave){
      // SIN BANDAS ALTERNAS. Se pintaban para separar dias, pero la linea
      // vertical de cambio de dia ya lo hace y con mucho menos ruido: el
      // sombreado compite con las propias barras y ensucia la lectura.
      clave=k;desde=t;alterno=!alterno;

      dias.push({xref:"x",x:t,yref:"paper",y:1.035,text:`<b>${String(f.getDate()).padStart(2,"0")}/${String(f.getMonth()+1).padStart(2,"0")}</b>`,showarrow:false,xanchor:"left",font:{size:10,color:tinta2}});
    }
    // (sin banda final: ya no se sombrea)
    });
  }

  if(diaria){
    const maxTicks=Math.max(4,Math.floor(ancho/82)),salto=Math.max(1,Math.ceil(s.t.length/maxTicks));
    const indices=[];for(let i=0;i<s.t.length;i+=salto)indices.push(i);
    if(s.t.length&&indices.at(-1)!==s.t.length-1){
      if(s.t.length-1-indices.at(-1)<salto*.55)indices[indices.length-1]=s.t.length-1;
      else indices.push(s.t.length-1);
    }
    tickDiario.tickmode="array";tickDiario.tickvals=indices.map(i=>s.t[i]);
    tickDiario.ticktext=indices.map(i=>{
      const f=new Date(s.t[i]),fecha=String(f.getDate()).padStart(2,"0")+"/"+String(f.getMonth()+1).padStart(2,"0");
      const candidatos=[s.pasos&&s.pasos[i],s.pasos_min&&s.pasos_min[i]].filter(finito);

  // En escala horaria el formato era "%H:%M" a secas, asi que en cuanto pasabas

    // LA LEYENDA NO PUEDE ROBARLE ALTO AL GRAFICO.
    //
    // Primer intento: y:1.14 con 16 px de margen. 1,14 es el 14% del ALTO DEL
    // AREA DE DIBUJO, no 14 px, asi que en un panel corto la leyenda se salia
    // por arriba, Plotly comprimia el area para encajarla y el eje X se quedaba
    // fuera. El grafico aparecia aplastado contra el borde inferior.
    //
    // Con y:1 y yanchor:"bottom" la leyenda se apoya justo en el borde superior
    // del area y crece hacia el margen, que es lo que hay que reservar: 22 px
    // bastan para una fila de 9 px. El area de dibujo no pierde ni un pixel
    // respecto a no tener leyenda.
    // La leyenda va DEBAJO del eje X y centrada. Arriba competia con la cabecera
    // de dias y obligaba a reservar margen superior, que es el que mas se nota
    // porque es donde esta el maximo de la serie.
    // LA LEYENDA, DEBAJO DE LAS ETIQUETAS DEL EJE.
    //
    // Con y:0 el borde superior de la leyenda coincide con el borde inferior del
    // area de dibujo, o sea justo donde Plotly escribe las horas: se montaba
    // encima y no se leia ninguna de las dos cosas. Hay que bajarla el alto de
    // esas etiquetas, y ese hueco hay que reservarlo ademas en el margen.
    // MARGENES AL MINIMO QUE CABE.
    // Entre los cuatro se comian 98 px de alto y 98 de ancho de un lienzo
    // de 914x441. Cada uno se ha bajado a lo que de verdad ocupa su
    // contenido: el rotulo del dia, las etiquetas del eje, la leyenda y la
    // cifra del umbral. Lo que se recorta va entero al area de dibujo.
    // Sin leyenda interna: la dibuja `serie-ley` en HTML, debajo. Asi el
    // margen inferior solo tiene que dar para las etiquetas del eje.
    margin:{l:44,r:hayRotuloDerecha?38:10,t:diaria?12:20,b:diaria?44:32,pad:0},
    showlegend:false,
    font:{family:'"Segoe UI",sans-serif',color:tinta,size:10},
    hovermode:"x unified",hoverlabel:{bgcolor:fondo,bordercolor:linea,font:{color:tinta,size:11}},
    xaxis:{type:"date",automargin:true,fixedrange:false,showline:true,linecolor:tinta3,linewidth:1,
      showgrid:true,gridcolor:reticula,gridwidth:.6,zeroline:false,
      ticks:"outside",ticklen:4,tickcolor:tinta3,tickfont:{color:tinta2,size:9},
      // LA FECHA SOLO EN EL CAMBIO DE DIA.
      // Repetirla en cada paso horario -"17/09 06:00", "17/09 12:00"...-
      // gasta ancho en decir tres veces lo mismo y obliga a leer ocho

    yaxis:{title:{text:`${etiqVar} · ${unidad}`,standoff:6,font:{size:10,color:tinta2}},automargin:true,

     450 px. El grafico se dibujaba a 450 dentro de una caja de 190 y todo lo
     que caia por debajo se recortaba, empezando por el eje X. No era que no se

  // instante despues: el grafico aparecia con un tamano y saltaba al definitivo.
  // Ese es el parpadeo de cada recarga. Dos rAF garantizan que el reparto de la
  // rejilla ya esta hecho cuando se pregunta el alto.
  // SE ESPERA A QUE LA CAJA TENGA TAMANO. NO A UN INSTANTE CONCRETO.
  //
  // Esperar "un par de fotogramas" no servia: cuando se mide, el contenedor
  // sigue midiendo 0 y Plotly se queda con SUS valores por defecto, 700x450.
  // Eso producia las dos cosas a la vez -el grafico pequeno y el salto al
  // redibujarse, primero en vertical y luego en horizontal- porque el
  // observador corregia despues, en dos pasos.
  //
  // Preguntar por el tamano hasta que lo haya resuelve los dos: se dibuja UNA
  // vez y con la medida buena. El tope de 1,5 s evita esperar indefinidamente
  // si el panel esta oculto; en ese caso se dibuja con lo que haya y el
  // observador lo ajusta en cuanto se muestre, que es cuando importa.
  // El alto ya se midio al entrar en la funcion; aqui solo se aplica.

     entera de que su contenedor ha cambiado de alto mientras la ventana sigue
     igual, que es justo lo que pasa aqui: al reorganizar el panel, el grafico
     seguia dibujado a 450 px dentro de una caja de 190 y quedaba recortado, sin
     eje X y con las barras aplastadas contra el borde.
     El observador lo ata al contenedor real. Se guarda en el nodo para no
     acumular uno nuevo en cada repintado. */
  /* AJUSTE AL CONTENEDOR.
     `ajustar()` se llama ADEMAS de observar, y esa es la parte que faltaba: un
     ResizeObserver solo avisa cuando el tamano CAMBIA. Si al engancharlo la caja
     ya tiene su tamano definitivo -que es lo normal: el grafico se dibuja
     mientras el panel aun vale 0 y para cuando termina ya vale 914x441- no se
     dispara nunca, y el grafico se queda con la medida con la que nacio.

     cambios posteriores (plegar un panel, girar la pantalla). */
  const ajustar = () => { try {
    const h = Math.max(nodo.clientHeight || 0, 170);
    const w = Math.max(nodo.clientWidth  || 0, 320);
    const fl = nodo._fullLayout || {};
    if (Math.abs((fl.height || 0) - h) > 4 || Math.abs((fl.width || 0) - w) > 4){
      /* EL HUECO DEL EJE SE RECALCULA CON EL ALTO NUEVO.
         El margen que se reserva encima de la serie para las etiquetas de valor
         se fija al construir el grafico, cuando el contenedor todavia puede
         valer 0: sale el maximo del 26%. Si despues se corrige el tamano pero
         no el rango, queda un grafico grande con la serie aplastada abajo y un
         tercio del alto vacio. Al cambiar el alto se rehace tambien el rango. */
      const util = Math.max(h - 100, 60);
      const f = M.mostrarValores ? Math.min(.26, Math.max(.07, 22/util))
                                 : Math.min(.10, Math.max(.03, 10/util));
      Plotly.relayout(nodo, {height:h, width:w,
        "yaxis.range":[lluvia?0:lo-rango*f, hi+rango*f]});

  if(cajaLey) cajaLey.innerHTML = leyendaSerie.map(x=>
    '<span><i style="background:'+x.color+'"></i>'+esc(x.nombre)+'</span>').join("");

      clearTimeout(pend);

    :[Object.assign({type:"scatter",mode:"lines+markers",line:{color:colorTema("--acento","#0B5FA5"),width:2.6},marker:{size:6,color:colorTema("--acento","#0B5FA5")}},comun)];
  const lay=layoutPlotlyBlanco(`Normal mensual · ${d.unidad}`,{margin:{l:54,r:12,t:16,b:42},
    xaxis:{type:"category",showline:true,linecolor:colorTema("--tinta3","#8A94A6"),showgrid:false,tickfont:{color:colorTema("--tinta2","#4A5568"),size:9}},
    yaxis:{title:{text:`Normal mensual · ${d.unidad}`,standoff:8},automargin:true,showline:true,linecolor:colorTema("--tinta3","#8A94A6"),showgrid:true,gridcolor:mezcla(colorTema("--linea","#DDE1E8"),colorTema("--fondo","#FFFFFF"),.72),zeroline:lluvia,zerolinecolor:colorTema("--tinta3","#8A94A6")}});

}
async function pintarSerie(){

      const der = q && String(q.fuente_obs||"").endsWith("_derivado_curva");

        + `${esc(etq)}</span>`);

    $("#serie-stats").innerHTML="";return;}

  const ultimoEscala=diarios&&sv.length?sv[sv.length-1]:x.ultimo;
  const tar=[[diarios?"Último día":"Último",num(ultimoEscala,lluvia?1:2)+" "+d.unidad]];

        tar.push(["Mediana mín.",num(emin.percentiles.p50,2)]);
    }
    if(ev.maximo)tar.push(["Máx hist.",num(ev.maximo.valor,1)]);
    tar.push(["Registro",ev.anios+" a"]);
    const nm=(ev.normales||[]).find(z=>z.mes===new Date().getMonth()+1);
    if(nm&&nm.mediana!=null)tar.push(["Normal "+MES[new Date().getMonth()],num(nm.mediana,1)]);
  }
  $("#serie-stats").innerHTML=tar.map(([k,v])=>
    `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

  // tendencia de la ventana, junto al titulo
  let tnd="";
  if(s&&s.v){
    const vv=s.v.filter(z=>z!=null&&isFinite(z));
    if(vv.length>3){
      const mitad=Math.floor(vv.length/2);
      const a=vv.slice(0,mitad).reduce((p,q)=>p+q,0)/mitad;
      const b=vv.slice(mitad).reduce((p,q)=>p+q,0)/(vv.length-mitad);
      const dif=lluvia?b-a:(a!==0?100*(b-a)/Math.abs(a):0);
      const sube=dif>(lluvia?0.2:3), baja=dif<(lluvia?-0.2:-3);
      const col=sube?"var(--atencion)":baja?"var(--baja)":"var(--tinta3)";
      tnd=`<span class="tend" style="color:${col}">${sube?"▲":baja?"▼":"■"} `+
          `${lluvia?num(Math.abs(dif),1)+(diarios?" mm/d":" mm/h"):num(Math.abs(dif),0)+" %"}</span>`;
    }
  }
  $("#serie-tit").innerHTML=`${esc(x.codigo)} `+
    `<span class="nomest">${esc((x.nombre||"").slice(0,22))}</span> ${tnd}`;
  // este innerHTML se ejecuta DESPUES del primer pintarHermanas y se llevaba por
  // delante el boton, asi que se vuelve a poner aqui, que es el ultimo sitio que
  // toca el titulo
  pintarHermanas();

  if(M.vista==="normal"){
    if(!ev||!(ev.normales||[]).some(z=>z.mediana!=null)){
      $("#serie").innerHTML=`<div class="vacio">Sin normales para esta estación${
        est&&est.sin_estadistica?": "+esc(est.motivo):""}</div>`;return;}
    const nn=ev.normales;
    await dibujarNormalesPlotly(nn,d,lluvia);
    return;
  }
  if(!s){$("#serie").innerHTML=`<div class="vacio">Sin serie en la ventana</div>`;return;}
  const um=umbralesQCSerie(x,d,s);
  // Mediana histórica. En temperatura son DOS: la de las máximas y la de las
  // mínimas. Trazar una sola recta sobre un gráfico que lleva las dos curvas no
  // informa de nada —queda encima de una y lejos de la otra—, y era lo que hacía
  // que la mediana pareciese la propia serie.
  // Se rotula con los años que la sostienen: una mediana de 2,8 años y otra de 60
  // se dibujan idénticas y no valen lo mismo.
  const medianas = d.variable==="temp_aire"
    ? [["temp_aire_max","mediana de máximas"],["temp_aire_min","mediana de mínimas"]]
    : [[VAR_LAKE[d.variable],"mediana histórica"]];
  if(!lluvia&&!M.mostrarUmbrales) medianas.forEach(([k,nm])=>{
    const e = est && est.variables && est.variables[k];
    if(!e || !finito((e.percentiles||{}).p50)) return;
    // serie marcada como inservible en el catálogo: no se traza nada
    if(e.cobertura && e.cobertura.percentiles_utiles===false) return;
    // LA MEDIANA VA A LA LEYENDA, NO AL BORDE DEL GRAFICO.
    //
    // Se rotulaba fuera del area de dibujo, a la derecha, y por esa etiqueta el
    // margen derecho pasaba de 12 a 104 px: casi cien pixeles de ancho util
    // gastados en repetir un numero que ya esta en la tarjeta MEDIANA de
    // arriba. En un panel que mide 150 px de alto, ese ancho es justo lo que
    // falta para que la serie se lea.
    um.push({v:e.percentiles.p50, color:"var(--tinta3)", cero:true,
      leyenda:true,
      corto:nm.replace("mediana de ",""),
      nombre:`${nm} · ${num(e.percentiles.p50,2)} (${num(e.anios,0)} años)`});
  });

  const n=s.v.length,eti=[];
  if(diarios){
    const marcas=new Set([0,Math.floor(n/3),Math.floor(2*n/3),n-1]);
    for(let i=1;i<n;i++)if(new Date(s.t[i]).getFullYear()!==new Date(s.t[i-1]).getFullYear())marcas.add(i);
    [...marcas].sort((a,b)=>a-b).forEach(i=>{if(i>=0&&i<n){const f=new Date(s.t[i]),ant=i>0?new Date(s.t[i-1]):null,cambia=!ant||f.getFullYear()!==ant.getFullYear();
      eti.push({i,t:String(f.getDate()).padStart(2,"0")+"/"+String(f.getMonth()+1).padStart(2,"0")+(cambia?"/"+f.getFullYear():"")});}});
  }else s.t.forEach((z,i)=>{const h=new Date(z).getHours();if([0,6,12,18].includes(h))eti.push({i,t:(h===0?"24":String(h).padStart(2,"0"))+" h"});});

  // tramos por dia natural, para sombrear en alterno y marcar el cambio
  // Tramos por día. En lluvia el día hidrológico va de 07 a 07 (convención del
  // INAMHI): una tormenta que cruza medianoche es el mismo evento y partirla
  // falsea el acumulado.
  const CORTE = lluvia ? 7 : 0;
  const claveDia = f => {
    const g = new Date(f.getTime() - CORTE * 3600000);
    return g.getFullYear() + "-" + g.getMonth() + "-" + g.getDate();
  };
  const dias=[];
  let claveAnt=null;
  s.t.forEach((z,i)=>{
    const f=new Date(z), clave=claveDia(f);
    if(clave!==claveAnt){
      if(dias.length)dias[dias.length-1].fin=i-1;
      const g=new Date(f.getTime()-CORTE*3600000);
      dias.push({i, t:String(g.getDate()).padStart(2,"0")+"/"+String(g.getMonth()+1).padStart(2,"0")});
      claveAnt=clave;
    }});
  if(dias.length)dias[dias.length-1].fin=n-1;

  // Resumen de cada tramo, dentro del gráfico. Solo se rotula el día CERRADO:
  // el acumulado de un día a medias no se puede comparar con uno completo, y la
  // máxima de hoy no es la máxima del día si aún no ha salido el sol.
  const ultimoT=new Date(s.t[n-1]), primeroT=new Date(s.t[0]), AHORA=Date.now();
  dias.forEach((d,k)=>{
    const fin=(d.fin!=null?d.fin:n-1);
    const ini=new Date(s.t[d.i]);
    // apertura y cierre teóricos del día hidrológico al que pertenece el tramo
    const base=new Date(new Date(ini.getTime()-CORTE*3600000).setHours(0,0,0,0));
    const apertura=new Date(base.getTime()+CORTE*3600000);
    const cierre=new Date(base.getTime()+(24+CORTE)*3600000);
    // Un día está incompleto por los DOS lados: porque aún no ha terminado, o
    // porque la ventana empezó a media mañana y le faltan las primeras horas.
    // El primer tramo de la ventana casi siempre está truncado por delante.
    // Que el dia haya cerrado lo dice el reloj, no el ultimo dato de la
    // estacion: si dejo de transmitir el viernes, su ultimo dia habia cerrado
    // igual, y marcarlo "en curso" para siempre es mentir sobre por que.
    // Lo que si depende de la estacion es si el dia salio completo o con huecos.
    d.cerrado  = AHORA >= cierre.getTime();
    d.truncado = (primeroT > apertura && k === 0);   // recorte de la ventana
    d.abierto  = !d.cerrado || d.truncado;
    const tramo=[];
    for(let i=d.i;i<=fin;i++)if(s.v[i]!=null&&isFinite(s.v[i]))tramo.push(s.v[i]);
    if(!tramo.length)return;
    if(lluvia){
      // El acumulado SOLO se publica cuando el día hidrológico se ha cerrado
      // (07:00 del día siguiente). Antes es un total parcial, y escribirlo junto
      // a los de días completos invita a compararlos como si fueran lo mismo.
      // Un día cerrado sin lluvia sí se rotula "0,0 mm": no llovió es un dato.
      // Un dia cerrado con huecos sigue dando un total util: se publica, pero
      // con las horas que tenia al lado para que nadie lo compare a ciegas con
      // uno completo. Mismo criterio que el servidor (MIN_HORAS_DIA).
      const suma=num(tramo.reduce((a,b)=>a+b,0),1);
      if(diarios)d.resumen=suma+` (${tramo.length}/24)`;
      else if(d.truncado||!d.cerrado)d.resumen=null;
      else d.resumen=suma+` (${tramo.length}/24)`;
    }else if(s.v_min){
      const mn=[];
      for(let i=d.i;i<=fin;i++)if(s.v_min[i]!=null&&isFinite(s.v_min[i]))mn.push(s.v_min[i]);
      // maxima / minima del dia. Si al dia le faltan horas MEDIDAS se dice
      // cuantas hay, porque una maxima sacada de 9 horas no es la del dia.
      if(d.cerrado&&!d.truncado&&mn.length)
        d.resumen=num(Math.max(...tramo),1)+" / "+num(Math.min(...mn),1)
                  +` (${Math.min(tramo.length,mn.length)}/24)`;
    }
  });

  const etiqVar=(M.vars&&M.vars[d.variable]||{}).etiqueta||d.variable;
  await dibujarSeriePlotly(s,d,x,um,etiqVar,lluvia);
}

/* ======================================================== eventos ======= */
function llenarVariables(fam){
  const v=M.vars||{};
  const opts=Object.keys(v).filter(k=>v[k].familia===fam);
  const sel=$("#f-var");
  // El desplegable nombra la variable y su unidad, nada mas. De donde sale cada
  // dato se dice en la propia estacion, que es donde importa.
  sel.innerHTML=opts.map(k=>`<option value="${k}">${esc(v[k].etiqueta)}`
    +` (${esc(v[k].unidad)})</option>`).join("");
  // Se abre en la variable que de verdad se vigila, no en la primera de la
  // lista: caudal solo transmiten 2 estaciones del INAMHI y nivel 23, así que
  // abrir en caudal daba un mapa casi vacío y parecía que la red estaba caída.
  const preferida={meteo:"precipitacion",hidro:"nivel"}[fam];
  if(preferida&&opts.includes(preferida))sel.value=preferida;
  return sel.value;
}
function pestana(cual){
  $("#t-met").setAttribute("aria-selected",cual==="met");
  $("#t-hid").setAttribute("aria-selected",cual==="hid");
  $("#t-avi").setAttribute("aria-selected",cual==="avi");
  // el panel de avisos sustituye al del monitor, no convive con el: son dos
  // lecturas distintas y superponerlas obliga a decidir cual manda
  $("#p-mon").hidden = (cual==="avi");
  $("#p-avisos").hidden = (cual!=="avi");
  if(cual==="avi") pintarAvisos();
  const fam=cual==="met"?"meteo":"hidro";
  if(fam!==M.fam){M.fam=fam;M.sel=null;M.d=null;
    // las vistas no se comparten entre familias: la de caudal no existe en
    // meteo y al reves, y arrastrarla deja el panel en blanco
    if(esVistaMeteo(M.vista)||esVistaPron(M.vista)){
      M.vista="serie";$("#v-serie").setAttribute("aria-pressed",true);
      $("#v-normal").setAttribute("aria-pressed",false);}
    llenarVariables(fam);latir(true);}
}
$("#t-met").onclick=()=>pestana("met");
$("#t-hid").onclick=()=>pestana("hid");
$("#t-avi").onclick=()=>pestana("avi");
/* El visor se recarga solo cuando se despliega una version nueva. Una pestania
   que lleva horas abierta se queda con el JavaScript de cuando se cargo, y el
   operador ve una version antigua creyendo que es la actual: paso con las
   estaciones de CENACE, que ya estaban servidas y no aparecian en su pantalla. */
/* La referencia es la version de ESTA pagina, no la primera que se lea del
   servidor. `window.VERSION_CONSTRUIDA` la escribe publicar_github.py dentro
   del HTML al publicarlo. Sin ella -en el visor interno, que sirve el fichero
   vivo- se mantiene el comportamiento anterior. */
let VERSION_VISOR = (typeof window !== "undefined" && window.VERSION_CONSTRUIDA) || null;
async function comprobarVersion(){
  try{
    const v = (await (await fetch("api/version",{cache:"no-store"})).json()).visor;
    if(VERSION_VISOR === null){ VERSION_VISOR = v; return; }
    if(v && v !== VERSION_VISOR){
      luz("carga","versión nueva, recargando…");
      setTimeout(()=>location.reload(true), 900);
    }
  }catch(_){}
}
comprobarVersion();
setInterval(comprobarVersion, 120000);

function reprog(){clearInterval(M.timer);const s=+$("#f-cada").value;if(s>0)M.timer=setInterval(latir,s*1000);}

/* El navegador frena o para los temporizadores de una pestaña que no se ve.
   Al volver a ella los datos pueden llevar parados un buen rato sin que se note,
   porque la hora que se muestra es la del ultimo latido, no la de ahora. Se
   refresca al volver, y tambien al recuperar la red. */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && +$("#f-cada").value>0) latir();
});
window.addEventListener("online",()=>{ if(+$("#f-cada").value>0) latir(); });
// Al cambiar de variable, una vista de pronostico meteo que ya no aplica
// -maximas cuando se ha pasado a lluvia- dejaria el grafico vacio sin
// explicacion. Se vuelve a la serie.
$("#f-var").onchange=()=>{M.sel=null;
  if(esVistaMeteo(M.vista)&&!vistasMeteoDe($("#f-var").value).some(v=>"meteo:"+v[0]===M.vista)){
    M.vista="serie";$("#v-serie").setAttribute("aria-pressed",true);}
  latir(true)};
function configurarVentana(){
  const diario=M.escala==="diaria",f=$("#f-horas"),actual=+f.value;
  const opciones=diario?[[168,"7 d"],[360,"15 d"],[720,"30 d"]]:[[24,"24 h"],[48,"48 h"],[72,"3 d"],[168,"7 d"]];
  f.innerHTML=opciones.map(([v,t])=>`<option value="${v}">${t}</option>`).join("");
  f.value=String(opciones.some(x=>x[0]===actual)?actual:(diario?720:48));
}
$("#f-escala").onchange=e=>{M.escala=e.target.value;configurarVentana();latir(true);};
$("#f-horas").onchange=()=>{latir(true);};
$("#f-cada").onchange=reprog;
$("#f-buscar").oninput=e=>{M.busca=e.target.value;pintarMon()};
$("#f-solo-linea").onclick=e=>{M.soloLinea=!M.soloLinea;
  e.currentTarget.setAttribute("aria-pressed",M.soloLinea);pintarMon()};
$("#v-serie").onclick=()=>{M.vista="serie";$("#v-serie").setAttribute("aria-pressed",true);
  $("#v-normal").setAttribute("aria-pressed",false);pintarSerie()};
$("#v-normal").onclick=()=>{M.vista="normal";M.mostrarUmbrales=false;$("#v-normal").setAttribute("aria-pressed",true);
  $("#v-serie").setAttribute("aria-pressed",false);$("#v-umbral").setAttribute("aria-pressed",false);pintarSerie()};
$("#v-umbral").onclick=e=>{M.vista="serie";M.mostrarUmbrales=!M.mostrarUmbrales;
  e.currentTarget.setAttribute("aria-pressed",M.mostrarUmbrales);
  $("#v-serie").setAttribute("aria-pressed",true);$("#v-normal").setAttribute("aria-pressed",false);pintarSerie()};
$("#v-valores").onclick=e=>{M.mostrarValores=!M.mostrarValores;
  e.currentTarget.setAttribute("aria-pressed",M.mostrarValores);pintarSerie()};
// el indice de laminas se pide una vez al arrancar y no bloquea el monitor
cargarPron().then(()=>{ if(M.d) pintarBotonesPron(); });
cargarDatosPron();
$("#f-tema").onclick=e=>{const o=temaOscuroMapa();
  document.documentElement.classList.add("cambiando-tema");
  document.documentElement.setAttribute("data-tema",o?"claro":"oscuro");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.documentElement.classList.remove("cambiando-tema");
    actualizarBaseMapa();
    if(M.d)pintarMapa();
    // Los graficos tambien. Plotly pinta sobre un lienzo propio: cambiar las
    // variables CSS no repinta lo ya dibujado, asi que al cambiar de tema el
    // grafico se quedaba con los colores del tema anterior hasta que algo lo
    // redibujara -normalmente, cambiar de estacion-. Se rehacen aqui.
    try{ pintarSerie(); }catch(_){}
    try{ if(typeof dibujarPron==="function") dibujarPron(); }catch(_){}
    try{ if(typeof dibujarLargo==="function"&&M.vista==="largo") dibujarLargo(); }catch(_){}
  }));
  e.currentTarget.setAttribute("aria-pressed",!o);
  try{localStorage.setItem("tema",o?"claro":"oscuro")}catch(_){}};
// el estado del botón; el tema en sí ya se aplicó en el <head>
$("#f-tema").setAttribute("aria-pressed",
  document.documentElement.getAttribute("data-tema")==="oscuro");
// Y si el tema lo cambia el SISTEMA -Windows pasa a oscuro al anochecer- sin
// que aquí haya una preferencia explícita, los gráficos también se rehacen.
try{
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  const alCambiar=()=>{
    if(document.documentElement.getAttribute("data-tema"))return; // manda el botón
    actualizarBaseMapa();
    if(M.d)pintarMapa();
    try{ pintarSerie(); }catch(_){}
    try{ if(typeof dibujarPron==="function") dibujarPron(); }catch(_){}
  };
  mq.addEventListener?mq.addEventListener("change",alCambiar):mq.addListener(alCambiar);
}catch(_){}
document.addEventListener("click",ev=>{
  const a=ev.target.closest("[data-cod]");if(a){M.sel=a.getAttribute("data-cod");pintarMon();return;}
});
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ")return;
  const a=ev.target.closest("[data-cod]");if(a){ev.preventDefault();M.sel=a.getAttribute("data-cod");pintarMon();return;}
});

/* La pestaña y la variable se pueden fijar por URL: ?vista=met&var=precipitacion
   Sirve para enlazar directo a una vista y para capturar la pantalla sin tener
   que simular clics, que es donde fallaban las capturas automáticas. */
const URLP=new URLSearchParams(location.search);
(async()=>{
  try{
    const e=await (await fetch("api/estado",{cache:"no-store"})).json();
    M.vars=e.variables||{};
    const vista=URLP.get("vista")||"hid";
    M.fam=vista==="met"?"meteo":"hidro";
    llenarVariables(M.fam);
    const pedida=URLP.get("var");
    if(pedida&&M.vars[pedida]){$("#f-var").value=pedida;
      M.fam=M.vars[pedida].familia;}
    const panel=URLP.get("panel");
    if(["normal","completo","largo"].includes(panel))M.vista=panel;
    const escala=URLP.get("escala");
    if(escala==="diaria"||escala==="horaria"){
      M.escala=escala;$("#f-escala").value=escala;configurarVentana();
    }
    // Los umbrales salen por defecto; ?umbrales=0 los apaga. Antes era al reves
    // -solo con ?umbrales=1- y eso pisaba el arranque aunque el estado inicial
    // los pidiera encendidos, porque esto se ejecuta despues.
    M.mostrarUmbrales=URLP.get("umbrales")!=="0";
    // Los valores salen por defecto; ?valores=0 los apaga. Antes era al reves y
    // habia que acordarse de encenderlos en cada sesion.
    M.mostrarValores=URLP.get("valores")!=="0";
    $("#v-valores").setAttribute("aria-pressed",M.mostrarValores);
    if(URLP.get("estacion"))M.sel=URLP.get("estacion").toUpperCase();
    const h=URLP.get("horas");
    if(h&&[...$("#f-horas").options].some(o=>o.value===h))$("#f-horas").value=h;
      // el pie desaparecio; el estado del archivo se cuenta en el título del panel
    if(e.cartografia){try{M.carto=await (await fetch("api/cartografia")).json();}catch(_){}}
  }catch(_){ luz("error","sin conexión con el servidor"); }
  // ARRANQUE EN METEOROLOGICO.
  //
  // Esta linea ponia "hid" por defecto y se ejecuta AL FINAL, asi que pisaba
  // tanto el estado inicial (fam:"meteo") como el aria-selected del HTML. El
  // visor arrancaba en hidrologico pasara lo que pasara.
  // Se usa pestana() y no dos setAttribute sueltos, porque ademas de marcar la
  // pestaña hay que llenar el selector de variables de la familia y limpiar la
  // seleccion anterior; haciendolo a mano quedaba la pestaña de meteo con las
  // variables de hidro. ?vista=hid sigue abriendo en hidrologico.
  const vista=URLP.get("vista")||"met";
  pestana(vista==="hid"?"hid":vista==="avi"?"avi":"met");
  if(M.vista==="normal"){$("#v-normal").setAttribute("aria-pressed",true);
    $("#v-serie").setAttribute("aria-pressed",false);}
  await latir();
  reprog();
  // marca para las capturas: solo aparece cuando la vista ya tiene datos
  document.body.dataset.listo="1";
})();
</script>
